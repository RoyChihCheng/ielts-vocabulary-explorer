<style>
:root{
  --navy:#2E1A47;--gold:#8E5FB0;--gold2:#C9A8E0;
  --paper:#FAF7FC;--g100:#F0E9F7;--g200:#E2D5EE;--g400:#9A8AA8;
  --known:#2B6830;--r:2px;
  --fd:'Playfair Display',Georgia,serif;
  --fb:'Lora','Times New Roman',serif;
  --fm:'JetBrains Mono','Courier New',monospace;
  --shadow:0 1px 3px rgba(46,26,71,.06),0 4px 16px rgba(46,26,71,.08),0 16px 48px rgba(46,26,71,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);font-family:var(--fb);color:var(--navy);
  height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── HEADER ── */
#hdr{height:52px;background:var(--navy);display:flex;align-items:center;
  padding:0 18px;flex-shrink:0;position:relative;gap:12px;}
.hdr-unit{font-family:var(--fd);font-size:.85rem;font-weight:700;color:var(--gold2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;}
.hdr-center{position:absolute;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;}
#counter{font-family:var(--fm);font-size:.82rem;color:#fff;letter-spacing:.02em;}
#known-badge{font-family:var(--fm);font-size:.62rem;color:var(--gold2);opacity:.75;min-height:.85em;}
.hdr-nav{margin-left:auto;display:flex;align-items:center;gap:10px;}
.mode-toggle{display:flex;border:1px solid rgba(142,95,176,.35);border-radius:var(--r);overflow:hidden;}
.mode-btn{background:transparent;border:none;color:rgba(142,95,176,.6);font-family:var(--fm);
  font-size:.66rem;padding:4px 10px;cursor:pointer;transition:background .15s,color .15s;
  letter-spacing:.04em;text-transform:uppercase;}
.mode-btn.active{background:var(--gold);color:#fff;}
#home-link{color:rgba(201,168,224,.5);font-size:1.15rem;text-decoration:none;
  line-height:1;transition:color .15s;padding:2px;}
#home-link:hover{color:var(--gold2);}

/* ── PROGRESS ── */
#prog-track{height:2px;background:rgba(142,95,176,.15);flex-shrink:0;}
#prog-fill{height:100%;background:var(--gold);transition:width .3s ease;width:0%;}

/* ── STAGE ── */
#stage{flex:1;display:flex;align-items:center;justify-content:center;
  padding:14px 16px;overflow:hidden;}
.scene{width:min(660px,100%);height:min(460px,calc(100vh - 130px));
  perspective:1400px;cursor:pointer;user-select:none;}
.card{width:100%;height:100%;position:relative;
  transform-style:preserve-3d;transition:transform .52s cubic-bezier(.4,0,.2,1);}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r);display:flex;flex-direction:column;padding:28px 36px;}

/* FRONT face */
.front{background:var(--paper);border:1px solid var(--g200);box-shadow:var(--shadow);}
.f-top{display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;}
.f-meta{display:flex;flex-direction:column;gap:2px;}
.f-num{font-family:var(--fm);font-size:.66rem;color:var(--gold);letter-spacing:.1em;}
.f-part{font-family:var(--fm);font-size:.58rem;color:var(--g400);letter-spacing:.05em;}
.f-known-mark{font-family:var(--fm);font-size:.62rem;color:var(--known);
  opacity:0;transition:opacity .2s;}
.f-known-mark.vis{opacity:1;}
.f-body{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;text-align:center;padding:4px 0;}
.f-word{font-family:var(--fd);font-size:clamp(2rem,6vw,3.4rem);
  color:var(--navy);font-weight:700;line-height:1.05;letter-spacing:-.01em;}
.f-ipa{font-family:var(--fm);font-size:.76rem;color:var(--g400);letter-spacing:.02em;}
.f-pos{font-family:var(--fb);font-size:.88rem;color:var(--g400);font-style:italic;}
.f-hint{font-family:var(--fm);font-size:.6rem;color:var(--g200);
  letter-spacing:.06em;flex-shrink:0;text-align:right;}

/* BACK face */
.back{background:var(--navy);transform:rotateY(180deg);overflow:hidden;}
.b-zh{font-family:var(--fd);font-size:clamp(1.5rem,4.2vw,2.3rem);
  color:var(--gold2);font-weight:700;line-height:1.2;flex-shrink:0;margin-bottom:10px;}
.b-quiz-word{font-family:var(--fd);font-size:clamp(1.6rem,4.5vw,2.5rem);
  color:var(--gold2);font-weight:700;line-height:1.1;flex-shrink:0;}
.b-quiz-meta{font-family:var(--fb);font-size:.82rem;color:rgba(201,168,224,.65);
  font-style:italic;flex-shrink:0;margin-bottom:10px;}
.b-rule{height:1px;background:rgba(255,255,255,.1);flex-shrink:0;margin-bottom:10px;}
.b-content{flex:1;overflow-y:auto;display:flex;flex-direction:column;
  gap:11px;scrollbar-width:none;-ms-overflow-style:none;}
.b-content::-webkit-scrollbar{display:none;}
.b-sec{display:flex;flex-direction:column;gap:5px;}
.b-label{font-family:var(--fm);font-size:.57rem;
  color:rgba(142,95,176,.75);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px;}

/* Examples */
.b-ex{font-family:var(--fb);font-size:.77rem;color:#ccc;font-style:italic;
  line-height:1.6;padding-left:10px;border-left:2px solid rgba(142,95,176,.3);}

/* Collocations */
.b-col{font-family:var(--fm);font-size:.67rem;color:#e8dff2;line-height:1.35;
  padding-left:10px;border-left:2px solid var(--gold);padding-top:1px;padding-bottom:1px;}
.b-cols{display:flex;flex-direction:column;gap:4px;}

/* Synonyms */
.b-syns{display:flex;flex-direction:column;gap:5px;}
.b-syn-row{display:flex;flex-direction:column;gap:1px;}
.b-syn-w{font-family:var(--fm);font-size:.7rem;color:var(--gold2);}
.b-syn-n{font-family:var(--fb);font-size:.71rem;color:#999;line-height:1.45;
  padding-left:6px;}

/* Note */
.b-note{font-family:var(--fb);font-size:.74rem;color:#cdb0e2;font-style:italic;
  line-height:1.6;padding:8px 10px;
  border:1px solid rgba(142,95,176,.2);border-radius:2px;
  background:rgba(142,95,176,.07);}

/* ── INTRO CARD ── */
.intro-face{cursor:default;}
.ic-eyebrow{font-family:var(--fm);font-size:.62rem;color:var(--gold);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;flex-shrink:0;}
.ic-title{font-family:var(--fd);font-size:clamp(1.3rem,3.2vw,1.9rem);
  color:var(--navy);font-weight:700;line-height:1.1;margin-bottom:4px;flex-shrink:0;}
.ic-zh{font-family:var(--fb);font-size:.85rem;color:var(--g400);
  font-style:italic;flex-shrink:0;}
.ic-rule{height:1px;background:var(--g200);margin:14px 0;flex-shrink:0;}
.ic-body{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:12px;}
.ic-sec-label{font-family:var(--fm);font-size:.57rem;color:var(--gold);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px;}
.ic-about{font-family:var(--fb);font-size:.81rem;color:var(--navy);line-height:1.65;}
.ic-steps{display:flex;flex-direction:column;gap:6px;}
.ic-step{font-family:var(--fb);font-size:.79rem;color:var(--navy);
  line-height:1.5;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.ic-tag{font-family:var(--fm);font-size:.62rem;background:var(--g100);
  border:1px solid var(--g200);color:var(--navy);padding:1px 7px;
  border-radius:var(--r);white-space:nowrap;flex-shrink:0;}
.ic-hint{font-family:var(--fm);font-size:.6rem;color:var(--g200);
  letter-spacing:.06em;flex-shrink:0;text-align:right;margin-top:auto;}

/* ── NAV BAR ── */
#nav-bar{height:52px;background:var(--g100);border-top:1px solid var(--g200);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;flex-shrink:0;}
.nav-btn{background:transparent;border:1px solid var(--g200);color:var(--navy);
  font-family:var(--fb);font-size:.82rem;padding:6px 14px;cursor:pointer;
  border-radius:var(--r);transition:all .15s;}
.nav-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.action-center{display:flex;align-items:center;gap:6px;}
#action-count{font-family:var(--fm);font-size:.65rem;color:#aaa;white-space:nowrap;}
#know-btn{background:var(--known);border:none;color:#fff;font-family:var(--fb);
  font-size:.78rem;padding:7px 13px;cursor:pointer;border-radius:var(--r);
  transition:opacity .15s;}
#know-btn:hover{opacity:.85;}
#review-btn{background:var(--gold);border:none;color:#fff;font-family:var(--fb);
  font-size:.78rem;padding:7px 13px;cursor:pointer;border-radius:var(--r);
  transition:opacity .15s;}
#review-btn:hover{opacity:.8;}
.nav-right{display:flex;align-items:center;gap:8px;}
#dots{display:flex;gap:3px;align-items:center;max-width:200px;overflow:hidden;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--g200);
  flex-shrink:0;transition:background .2s;}
.dot.cur{background:var(--gold);}
.dot.known{background:var(--known);}

/* ===== MOBILE / PHONE (added for touch navigation) ===== */
@media (max-width:600px){
  body{height:100dvh;}
  #hdr{height:48px;padding:0 12px;gap:8px;}
  .hdr-unit{max-width:76px;font-size:.68rem;}
  #counter{font-size:.76rem;}
  #known-badge{font-size:.56rem;}
  .hdr-nav{gap:7px;}
  .mode-btn{padding:5px 9px;font-size:.6rem;}
  #stage{padding:8px;}
  .scene{width:100%;height:100%;max-height:100%;}
  .face{padding:18px 18px;}
  .f-word{font-size:clamp(1.9rem,9vw,2.8rem);}
  .b-zh{font-size:clamp(1.4rem,7vw,2rem);}
  .b-quiz-word{font-size:clamp(1.5rem,7.5vw,2.1rem);}
  .b-ex{font-size:.8rem;}
  .b-col{font-size:.72rem;}
  .ic-body{overflow-y:auto;}
  .f-hint,.ic-hint{display:none;}
  #nav-bar{height:58px;padding:0 8px;}
  #dots{display:none;}
  #action-count{display:none;}
  .action-center{gap:8px;}
  .nav-btn{padding:12px 16px;font-size:.92rem;}
  #know-btn,#review-btn{padding:12px 15px;font-size:.86rem;}
}
/* ===== END MOBILE ===== */
</style>

ds"], "syn": [{"w": "tendency", "n": "強調某種傾向或習慣性方向"}, {"w": "pattern", "n": "強調重複出現的規律"}, {"w": "movement", "n": "強調有目的性的集體走向"}, {"w": "shift", "n": "強調方向的改變，比 trend 更突然"}], "note": "Trend 是IELTS寫作中的超高頻詞。注意搭配：'trend towards + noun/gerund'（e.g., a trend towards remote working）。"}, {"word": "condensation", "ipa": "/ˌkɒndənˈseɪʃn/", "pos": "noun", "zh": "凝結", "part": "A", "examples": ["Condensation forms on the outside of a cold glass because warm air cools rapidly upon contact with the surface.", "The process of condensation is a fundamental part of the water cycle that replenishes freshwater supplies."], "col": ["water condensation", "air condensation", "rate of condensation", "condensation point", "cause condensation", "condensation process"], "syn": [{"w": "liquefaction", "n": "指氣體或固體轉化為液態的過程，較技術性"}, {"w": "precipitation", "n": "更廣義，也指雨雪等降水現象"}, {"w": "dew formation", "n": "特指露珠形成"}, {"w": "moisture build-up", "n": "較口語化的描述"}], "note": "Condensation 在IELTS科學類閱讀文章和地理類寫作中常見。注意與 evaporation（蒸發）形成對比。"}, {"word": "debris", "ipa": "/ˈdebriː/", "pos": "noun", "zh": "碎片；殘骸", "part": "A", "examples": ["Tonnes of plastic debris continue to accumulate in the world's oceans, threatening marine ecosystems.", "Emergency teams spent days clearing the debris left behind after the earthquake destroyed the town centre."], "col": ["space debris", "clear debris", "debris field", "falling debris", "storm debris", "marine debris", "under debris"], "syn": [{"w": "wreckage", "n": "強調事故或災難後的殘骸"}, {"w": "rubble", "n": "特指建築廢材、瓦礫"}, {"w": "fragments", "n": "強調破碎成小塊的部分"}, {"w": "litter", "n": "較口語，指隨意丟棄的垃圾"}], "note": "Debris 在IELTS環境、科技和自然災害議題中均有出現。Space debris（太空垃圾）是近年的重要話題。"}, {"word": "eclipse", "ipa": "/ɪˈklɪps/", "pos": "noun", "zh": "蝕（日、月蝕）", "part": "A", "examples": ["A total solar eclipse occurs when the moon passes directly between the Earth and the Sun, temporarily blocking sunlight.", "Ancient civilisations often interpreted eclipses as powerful omens that required ritual responses."], "col": ["solar eclipse", "lunar eclipse", "total eclipse", "partial eclipse", "witness an eclipse", "eclipse path", "eclipse cycle"], "syn": [{"w": "occultation", "n": "天文術語，指天體被另一天體遮蔽"}, {"w": "shadow", "n": "比喻性使用時指某事物遮蔽另一事物"}, {"w": "obscuration", "n": "技術性術語，強調遮蔽現象"}, {"w": "overshadow", "n": "常用作動詞，意為蓋過、使黯然失色"}], "note": "Eclipse 也常用作動詞（to eclipse someone/something）或比喻（his achievements eclipsed all rivals），在IELTS中比喻用法同樣出現。"}, {"word": "evaporation", "ipa": "/ɪˌvæpəˈreɪʃn/", "pos": "noun", "zh": "蒸發", "part": "A", "examples": ["Rising global temperatures are causing accelerated evaporation from lakes and rivers, leading to water shortages.", "The water cycle depends on the evaporation of surface water, which eventually condenses and falls as precipitation."], "col": ["rate of evaporation", "surface evaporation", "evaporation process", "cause evaporation", "evaporation loss", "solar evaporation"], "syn": [{"w": "vaporisation", "n": "技術性同義詞，指液體轉化為蒸汽"}, {"w": "drying out", "n": "口語化，強調水分散失"}, {"w": "moisture loss", "n": "廣義的水分散失"}, {"w": "dissipation", "n": "強調逐漸消散的過程"}], "note": "Evaporation 是IELTS地理、環境和科學類文章的常見詞彙，常與 condensation 和 precipitation 一起構成水循環的核心詞組。"}, {"word": "gravity", "ipa": "/ˈɡrævɪti/", "pos": "noun", "zh": "重力", "part": "A", "examples": ["Without gravity, the structure of the entire solar system would collapse, and planets would drift into space.", "The gravity of the situation finally became clear when scientists announced that the asteroid's trajectory was on a collision course."], "col": ["centre of gravity", "defy gravity", "gravitational pull", "gravity field", "law of gravity", "gravity of situation", "zero gravity"], "syn": [{"w": "gravitation", "n": "更技術性的科學術語"}, {"w": "attraction", "n": "廣義的吸引力，不限於物理"}, {"w": "pull", "n": "口語化，強調拉力方向"}, {"w": "weight", "n": "重力在物體上的表現（質量×重力加速度"}], "note": "Gravity 有兩個常見含義：(1) 物理學中的重力；(2) 比喻性的「嚴重性」（the gravity of the crisis）。IELTS中兩種用法均有出現。"}, {"word": "light year", "ipa": "/ˈlaɪt jɪə/", "pos": "noun", "zh": "光年", "part": "A", "examples": ["The nearest star to our solar system, Proxima Centauri, is approximately 4.2 light years away.", "The James Webb Space Telescope can observe galaxies that are billions of light years from Earth."], "col": ["billion light years", "light years away", "light year distance", "distant light year", "measure in light years"], "syn": [{"w": "astronomical unit", "n": "天文距離單位，主要用於太陽系內"}, {"w": "parsec", "n": "更大的天文距離單位（1 parsec ≈ 3.26 light years"}, {"w": "cosmic distance", "n": "廣義宇宙距離的描述"}, {"w": "vast distance", "n": "形容性的廣大距離描述"}], "note": "Light year（光年）是距離單位，不是時間單位——這是常見的誤解。在IELTS科學類閱讀中，理解此單位有助於理解宇宙相關文章。"}, {"word": "abrupt", "ipa": "/əˈbrʌpt/", "pos": "adjective", "zh": "突然的", "part": "B", "examples": ["The abrupt closure of the factory left hundreds of workers without income or warning.", "An abrupt change in government policy can destabilise financial markets and undermine investor confidence."], "col": ["abrupt change", "abrupt end", "abrupt halt", "abrupt departure", "abrupt shift", "come to an abrupt stop", "abrupt manner"], "syn": [{"w": "sudden", "n": "最常見的同義詞，口語和書面均適用"}, {"w": "unexpected", "n": "強調出乎意料，不一定是突然發生"}, {"w": "precipitate", "n": "較正式，指倉促而來不及準備的"}, {"w": "sharp", "n": "強調驟然性，如 a sharp decline"}], "note": "Abrupt 帶有稍微負面的語氣，暗示缺乏警告或準備。用於描述語氣或行為時，還有「粗魯、唐突」之意（an abrupt reply）。"}, {"word": "bygone", "ipa": "/ˈbaɪɡɒn/", "pos": "adjective", "zh": "過去的", "part": "B", "examples": ["The restored building stands as a monument to a bygone era of architectural craftsmanship.", "Many older residents feel a sense of nostalgia for the bygone days of close-knit community life."], "col": ["bygone era", "bygone days", "bygone age", "relic of a bygone time", "bygone customs", "a bygone civilisation"], "syn": [{"w": "past", "n": "最廣義的同義詞，中性"}, {"w": "former", "n": "強調曾經存在但現已改變（former glory"}, {"w": "historical", "n": "強調具有歷史意義的"}, {"w": "obsolete", "n": "更強調過時而不再使用的"}], "note": "Bygone 帶有懷舊或感傷的色彩，常用於文學性或評論性寫作。IELTS寫作中用來描述消逝的傳統或時代 : "negligible", "n": "強調小到幾乎可以忽略不計"}, {"w": "imperceptible", "n": "強調小到難以察覺"}, {"w": "microscopic", "n": "強調小到需要顯微鏡才能看到"}], "note": "Infinitesimal 是高階詞彙，在IELTS中出現於科學和統計類文章。使用此詞可顯著提升詞彙分數。"}, {"word": "moderate", "ipa": "/ˈmɒdərɪt/", "pos": "adjective", "zh": "適度的", "part": "B", "examples": ["Doctors recommend moderate exercise of at least 150 minutes per week to maintain cardiovascular health.", "Economic growth has remained moderate, neither booming nor entering recession, creating a stable but uninspiring environment."], "col": ["moderate amount", "moderate exercise", "moderate pace", "moderate climate", "moderate growth", "moderate view", "moderate risk"], "syn": [{"w": "reasonable", "n": "強調合理且不過分"}, {"w": "measured", "n": "強調謹慎地保持平衡"}, {"w": "restrained", "n": "強調刻意控制，不過度"}, {"w": "temperate", "n": "特別用於氣候或態度上的溫和"}], "note": "Moderate 也可作動詞（to moderate a debate = 主持辯論）。形容詞用法表示「不極端的」，在政治或科學語境中很常見。"}, {"word": "periodic", "ipa": "/ˌpɪərɪˈɒdɪk/", "pos": "adjective", "zh": "週期的；定期的", "part": "B", "examples": ["The organisation conducts periodic reviews of its safety procedures to ensure compliance with updated regulations.", "Periodic flooding has shaped the agricultural practices of communities living along the river delta for centuries."], "col": ["periodic review", "periodic table", "periodic flooding", "periodic checks", "periodic assessment", "at periodic intervals", "periodic outbreaks"], "syn": [{"w": "regular", "n": "強調有規律地重複，最口語化"}, {"w": "recurring", "n": "強調反覆出現，可能不規律"}, {"w": "cyclical", "n": "強調循環性的規律模式"}, {"w": "intermittent", "n": "強調不持續、時斷時續的"}], "note": "Periodic table（元素週期表）是最著名的固定搭配。作形容詞使用時，periodic 強調有規律的時間間隔，比 regular 更正式。"}, {"word": "preceding", "ipa": "/prɪˈsiːdɪŋ/", "pos": "adjective", "zh": "在前的", "part": "B", "examples": ["The preceding chapter outlined the theoretical framework that underpins the current analysis.", "The economic crisis of the preceding decade had fundamentally reshaped the government's fiscal priorities."], "col": ["preceding year", "preceding chapter", "preceding decade", "preceding paragraph", "preceding period", "as noted in the preceding section"], "syn": [{"w": "previous", "n": "最常見的同義詞，口語和書面均適用"}, {"w": "prior", "n": "較正式（prior to this / the prior year"}, {"w": "former", "n": "強調曾在前者位置或狀態的"}, {"w": "earlier", "n": "強調時間上在前，可作副詞和形容詞"}], "note": "Preceding 主要用於書面語，常出現在學術寫作中指涉前一節、前一年等（the preceding section / the preceding year）。"}, {"word": "prehistoric", "ipa": "/ˌpriːhɪˈstɒrɪk/", "pos": "adjective", "zh": "史前的", "part": "B", "examples": ["Prehistoric cave paintings discovered in Spain suggest that early humans had a sophisticated artistic sensibility.", "The fossil record reveals that prehistoric marine creatures were far more diverse than those alive today."], "col": ["prehistoric times", "prehistoric cave", "prehistoric creature", "prehistoric era", "prehistoric settlement", "prehistoric humans", "prehistoric art"], "syn": [{"w": "ancient", "n": "廣義古老的，不一定指文字記錄以前"}, {"w": "primeval", "n": "強調遠古原始的，帶有荒蠻感"}, {"w": "antediluvian", "n": "文學化，指洪水以前的（上古的"}, {"w": "primitive", "n": "強調原始的狀態，有時帶負面含義"}], "note": "Prehistoric 特指有文字記錄之前的時期。在IELTS考古和科學類閱讀文章中是基礎詞彙。"}, {"word": "profound", "ipa": "/prəˈfaʊnd/", "pos": "adjective", "zh": "深遠的", "part": "B", "examples": ["The Industrial Revolution had a profound impact on social structures, urban development, and working conditions.", "Travelling abroad at a young age can have a profound effect on a person's worldview and cultural empathy."], "col": ["profound impact", "profound effect", "profound change", "profound influence", "profound insight", "profoundly affected", "profound implications"], "syn": [{"w": "deep", "n": "廣義深刻，也可形容情感（deep grief"}, {"w": "far-reaching", "n": "強調影響範圍廣泛，波及久遠"}, {"w": "significant", "n": "強調重要性，較中性"}, {"w": "momentous", "n": "強調具有歷史性意義的重大"}], "note": "Profound 在IELTS寫作中是展示高級詞彙的絕佳選擇。搭配 impact、effect、change 效果尤佳。比 deep 更正式、更學術。"}, {"word": "rapid", "ipa": "/ˈræpɪd/", "pos": "adjective", "zh": "快速的", "part": "B", "examples": ["The rapid growth of online shopping has forced many traditional retailers to fundamentally rethink their business models.", "Rapid urbanisation in developing countries has created significant challenges in infrastructure, housing, and public services."], "col": ["rapid growth", "rapid decline", "rapid change", "rapid urbanisation", "rapid development", "at a rapid pace", "rapid advancement"], "syn": [{"w": "swift", "n": "強調速度快，可形容決策或行動"}, {"w": "accelerated", "n": "強調速度不斷加快的過程"}, {"w": "fast-paced", "n": "強調節奏快，常修飾生活方式或行業"}, {"w": "exponential", "n": "強調爆炸式的增長速度，常用於數據"}], "note": "Rapid 是IELTS寫作中的高頻詞，常用於描述社會或科技變化（rapid urbanisation, rapid advancement）。比 fast 更正式。"}, {"word": "topical", "ipa": "/ˈtɒpɪkl/", "pos": "adjective", "zh": "現下熱門的", "part": "B", "examples": ["Climate change remains one of the most topical issues in contemporary politics and international relations.", "The documentary tackles several topical questions about the ethics of artificial intelligence in public life."], "col": ["topical issue", "topical subject", "highly topical", "topical debate", "remain topical", "topical reference"], "syn": [{"w": "current", "n": "廣義「當前的、現時的」"}, {"w": "contemporary", "n": "強調屬於當代的、現代的"}, {"w": "relevant", "n": "強調具有現實意義"}, {"w": "pressing", "n": "強調緊迫性，需要立即關注"}], "note": "Topical 強調「時事熱點性」，比 current 更強調話題的討論熱度。在IELTS寫作簡介中，指出議題的時事性是提分策略。"}, {"word": "tremendous", "ipa": "/trɪˈmendəs/", "pos": "adjective", "zh": "巨大的；極好的", "part": "B", "examples": ["Scientists have made tremendous advances in understanding the human genome over the past three decades.", "The success of the campaign required tremendous dedication, coordination, and perseverance from all team members."], "col": ["tremendous effort", "tremendous amount", "tremendous potential", "tremendous impact", "tremendous success", "at tremendous speed", "tremendous pressure"], "syn": [{"w": "enormous", "n": "強調規模極大，最常見"}, {"w": "immense", "n": "側重數量或程度的巨大"}, {"w": "extraordinary", "n": "強調超越尋常的卓越程度"}, {"w": "remarkable", "n": "強調值得稱道，令人印象深刻"}], "note": "Tremendous 在口語中也可表達「極好的、了不起的」，帶有正面的讚嘆感。在學術寫作中通常作「巨大的」解釋。"}, {"word": "turbulent", "ipa": "/ˈtɜːbjʊlənt/", "pos": "adjective", "zh": "動盪的", "part": "B", "examples": ["The country endured a turbulent decade of political instability, economic recession, and social unrest.", "Air passengers can experience turbulent conditions during flight when the aircraft passes through unstable air currents."], "col": ["turbulent times", "turbulent history", "turbulent period", "turbulent relationship", "turbulent economy", "politically turbulent", "turbulent weather"], "syn": [{"w": "tumultuous", "n": "強調充滿混亂和騷動的狀態"}, {"w": "volatile", "n": "強調不穩定、容易發生劇烈變化"}, {"w": "unstable", "n": "最中性的同義詞，指缺乏穩定性"}, {"w": "stormy", "n": "比喻性使用，指充滿衝突和爭議"}], "note": "Turbulent 的本義是氣流的「湍流」，比喻性地形容充滿動蕩的時期。在IELTS歷史和政治類題目中非常有用。"}, {"word": "astronomical", "ipa": "/ˌæstrəˈnɒmɪkl/", "pos": "adjective", "zh": "天文數字的；天文學的", "part": "B", "examples": ["The cost of constructing a new nuclear power plant has risen to astronomical levels, making it commercially unviable.", "Astronomical observations have confirmed that the universe is expanding at an accelerating rate."], "col": ["astronomical cost", "astronomical figure", "astronomical object", "astronomical research", "astronomical scale", "astronomically high", "astronomical sum"], "syn": [{"w": "colossal", "n": "強調極為巨大的規模或數量"}, {"w": "staggering", "n": "強調大到令人咋舌的程度"}, {"w": "exorbitant", "n": "特指費用、價格高得離譜"}, {"w": "astronomical", "n": "本身也可指「天文的、天文學的」"}], "note": "Astronomical 作「天文數字的」解釋時帶強烈誇飾語氣（astronomical prices/fees），適合IELTS討論高昂成本或極端數量。"}, {"word": "climatic", "ipa": "/klaɪˈmætɪk/", "pos": "adjective", "zh": "氣候的", "part": "B", "examples": ["Climatic conditions in the region have changed significantly over the past century, affecting local agriculture.", "Scientists warn that failing to reduce emissions will trigger irreversible climatic shifts within decades."], "col": ["climatic conditions", "climatic change", "climatic factors", "climatic extremes", "climatic zone", "climatic impact"], "syn": [{"w": "meteorological", "n": "更技術性，指氣象學的"}, {"w": "atmospheric", "n": "強調大氣層相關的"}, {"w": "environmental", "n": "更廣義，指環境整體的"}, {"w": "weather-related", "n": "口語化，指與天氣有關的"}], "note": "注意區分 climatic（氣候的）和 climactic（高潮的、climax 的形容詞形式）——拼寫相近但意義完全不同！"}, {"word": "colossal", "ipa": "/kəˈlɒsl/", "pos": "adjective", "zh": "巨大的", "part": "B", "examples": ["The colossal statue of Liberty stands as a symbol of freedom and democracy visible from miles offshore.", "The project represented a colossal financial undertaking that stretched the organisation's resources to their limits."], "col": ["colossal structure", "colossal failure", "colossal amount", "colossal task", "colossal mistake", "a colossal waste", "colossal effort"], "syn": [{"w": "enormous", "n": "最廣義，強調規模極大"}, {"w": "gigantic", "n": "強調體積或數量上的龐大"}, {"w": "monumental", "n": "強調具有紀念碑式的重大感"}, {"w": "mammoth", "n": "強調龐然大物，語氣略帶誇張"}], "note": "Colossal 帶有令人震撼的視覺感，比 enormous 更具衝擊力，適合描述令人難以置信的巨大規模或失敗。"}, {"word": "magnetic", "ipa": "/mæɡˈnetɪk/", "pos": "adjective", "zh": "有磁性的", "part": "B", "examples": ["The Earth's magnetic field protects life on the surface from harmful solar radiation.", "She had a magnetic personality that drew people to her effortlessly, making her a natural leader."], "col": ["magnetic field", "magnetic force", "magnetic personality", "magnetically charged", "magnetic attraction", "magnetic north", "highly magnetic"], "syn": [{"w": "attractive", "n": "比喻性地形容吸引人的特質"}, {"w": "compelling", "n": "強調令人難以抗拒的吸引力"}, {"w": "charismatic", "n": "特指個人魅力上的吸引力"}, {"w": "captivating", "n": "強調讓人著迷、無法移開注意力"}], "note": "Magnetic 有物理學（磁性的）和比喻性（極具魅力的）兩種用法。在IELTS中，注意根據語境判斷哪種含義適用。"}, {"word": "transient", "ipa": "/ˈtrænziənt/", "pos": "adjective", "zh": "短暫的；轉瞬即逝的", "part": "B", "examples": ["Economic booms are often transient, and governments must plan for the inevitable downturns that follow.", "The philosopher argued that fame and wealth are transient pleasures that do not lead to lasting fulfilment."], "col": ["transient effect", "transient population", "transient pleasure", "transient experience", "transient worker", "transient phase", "a transient moment"], "syn": [{"w": "fleeting", "n": "帶有珍貴或遺憾的情感色彩"}, {"w": "ephemeral", "n": "最文雅，強調極短暫的本質"}, {"w": "temporary", "n": "最廣義，強調非永久性"}, {"w": "short-lived", "n": "強調雖曾出現但很快結束"}], "note": "Transient 比 temporary 更正式、更學術，強調事物本質上的無常性。在哲學、社會學和IELTS高分寫作中很有用。"}, {"word": "excavate", "ipa": "/ˈekskəveɪt/", "pos": "verb", "zh": "挖掘", "part": "C", "examples": ["Archaeologists have been excavating the site for over a decade, uncovering thousands of ancient artefacts.", "Construction workers were forced to halt operations after they accidentally excavated a previously unknown burial ground."], "col": ["excavate site", "excavate fossils", "excavate ruins", "carefully excavate", "archaeologists excavate", "excavation work"], "syn": [{"w": "unearth", "n": "強調從地下挖出，常用於考古"}, {"w": "dig up", "n": "口語化，最廣義的挖掘"}, {"w": "uncover", "n": "廣義指揭露，不一定指物理挖掘"}, {"w": "extract", "n": "強調從某處取出，更廣義"}], "note": "Excavate 是考古學的核心動詞，名詞 excavation（挖掘工程）在IELTS歷史類閱讀中頻繁出現。"}, {"word": "activate", "ipa": "/ˈæktɪveɪt/", "pos": "verb", "zh": "啟動", "part": "C", "examples": ["Pressing the emergency button will immediately activate the building's fire suppression system.", "Certain hormones activate specific genes, triggering biological processes that would otherwise remain dormant."], "col": ["activate alarm", "activate system", "activate mechanism", "activate a gene", "automatically activate", "activate a response", "activate an account"], "syn": [{"w": "trigger", "n": "強調引發某個連鎖反應或事件"}, {"w": "initiate", "n": "較正式，強調開始啟動一個過程"}, {"w": "set off", "n": "口語化，指引發某事（常用於警報"}, {"w": "launch", "n": "強調正式啟動，如 launch a programme"}], "note": "Activate 比 start 更正式，常用於機械、生物學或計算機系統語境。動詞 deactivate（停止運作）是其反義詞。"}, {"word": "burst", "ipa": "/bɜːst/", "pos": "verb", "zh": "爆裂", "part": "C", "examples": ["A pipe burst in the basement, flooding the entire ground floor of the building within minutes.", "The dam burst after three days of continuous rainfall, sending a devastating wave of water into the valley below."], "col": ["burst bubble", "burst into tears", "burst open", "burst into flames", "burst a pipe", "pressure burst", "burst at the seams"], "syn": [{"w": "rupture", "n": "較技術性，指裂開（rupture a vessel"}, {"w": "explode", "n": "強調猛烈爆炸式的破裂"}, {"w": "split", "n": "強調沿一條線裂開"}, {"w": "shatter", "n": "強調破碎成碎片"}], "note": "Burst 有豐富的習語用法：burst into tears（突然大哭）、burst out laughing（突然大笑）、burst with pride（充滿驕傲），在IELTS口語中很有用。"}, {"word": "collide", "ipa": "/kəˈlaɪd/", "pos": "verb", "zh": "碰撞", "part": "C", "examples": ["Two tectonic plates colliding beneath the ocean floor can trigger powerful earthquakes and devastating tsunamis.", "The documentary explores what happens when traditional cultural values collide with the demands of modern globalisation."], "col": ["collide with", "particles collide", "head-on collision", "collide at high speed", "cultures collide", "ideas collide"], "syn": [{"w": "crash", "n": "口語化，強調衝撞事故"}, {"w": "impact", "n": "強調碰撞的衝擊力"}, {"w": "clash", "n": "常用於比喻性的衝突（values clash"}, {"w": "smash into", "n": "強調激烈的衝撞，口語化"}], "note": "Collide 和 clash 都可用於比喻性的衝突（當不同觀點、文化「碰撞」時）。Collide 更客觀，clash 常帶有更激烈的敵意。"}, {"word": "dilute", "ipa": "/daɪˈluːt/", "pos": "verb", "zh": "稀釋", "part": "C", "examples": ["The acid must be carefully diluted with water before use to prevent chemical burns.", "Critics argued that the policy had been diluted to the point where it would have virtually no practical effect."], "col": ["dilute acid", "dilute with water", "dilute a solution", "dilute responsibility", "highly diluted", "dilute the impact", "dangerously diluted"], "syn": [{"w": "weaken", "n": "廣義削弱，不限於液體"}, {"w": "water down", "n": "口語化，指刻意削弱（water down a policy"}, {"w": "thin", "n": "強調使濃度降低"}, {"w": "reduce", "n": "廣義降低，最中性"}], "note": "Dilute 除化學含義外，還常用於比喻：'dilute the impact of a policy'（削弱政策效力），在IELTS議論文中是個有力的動詞。"}, {"word": "dissolve", "ipa": "/dɪˈzɒlv/", "pos": "verb", "zh": "溶解", "part": "C", "examples": ["Salt dissolves in water to form a saline solution used in many medical and industrial applications.", "The government threatened to dissolve parliament and call a snap election if the bill was not passed."], "col": ["dissolve in water", "dissolve salt", "dissolve parliament", "dissolve a partnership", "dissolve tension", "completely dissolve"], "syn": [{"w": "melt", "n": "強調固體因溫度而液化（ice melts"}, {"w": "break up", "n": "廣義分解或終止（break up a group"}, {"w": "disintegrate", "n": "強調逐漸瓦解"}, {"w": "liquefy", "n": "技術性，強調使之液化"}], "note": "Dissolve 有化學（溶解）和政治（解散）兩種截然不同的含義，在IELTS中需根據語境判斷。"}, {"word": "penetrate", "ipa": "/ˈpenɪtreɪt/", "pos": "verb", "zh": "穿透；滲透", "part": "C", "examples": ["Ultraviolet radiation from the sun can penetrate clouds and still cause skin damage on overcast days.", "The company spent years trying to penetrate the Chinese market before eventually withdrawing its investment."], "col": ["penetrate market", "penetrate surface", "penetrate defences", "penetrate deeply", "penetrate the barrier", "light penetrates", "penetrate disguise"], "syn": [{"w": "permeate", "n": "強調逐漸滲透或充滿（an odour permeates the room"}, {"w": "pierce", "n": "強調尖銳地刺穿"}, {"w": "infiltrate", "n": "強調秘密或逐漸滲入"}, {"w": "break through", "n": "強調克服障礙進入"}], "note": "Penetrate 在商業語境中常指「打入市場」（penetrate a new market），在IELTS商業類題目中是一個有分量的動詞。"}, {"word": "pierce", "ipa": "/pɪəs/", "pos": "verb", "zh": "刺穿", "part": "C", "examples": ["A sharp stalagmite could pierce even a thick rubber sole, making appropriate footwear essential for cave exploration.", "The sound of the alarm pierced the silence of the laboratory, alerting all staff to the potential hazard."], "col": ["pierce skin", "pierce ears", "pierce the silence", "pierce armour", "pierce through", "a piercing sound", "piercing eyes"], "syn": [{"w": "penetrate", "n": "強調穿透，比 pierce 更廣義"}, {"w": "puncture", "n": "強調在表面刺出一個洞"}, {"w": "perforate", "n": "技術性，強調打孔（perforated paper"}, {"w": "stab", "n": "強調用力刺入，語氣更強"}], "note": "Pierce 也有比喻用法：a piercing look（銳利的眼神）、a piercing scream（刺耳的尖叫），在IELTS描寫型語境中很生動。"}, {"word": "reflect", "ipa": "/rɪˈflekt/", "pos": "verb", "zh": "反射", "part": "C", "examples": ["The calm surface of the lake reflected the mountains perfectly, creating a mirror image of the landscape.", "Government statistics reflect a widening gap between the wealthiest and poorest segments of society."], "col": ["reflect light", "reflect image", "reflect reality", "reflect a trend", "reflect on", "reflect poorly on", "reflect views"], "syn": [{"w": "mirror", "n": "強調像鏡子一樣映照（the data mirrors the trend"}, {"w": "indicate", "n": "強調顯示或表明某種情況"}, {"w": "represent", "n": "強調代表或體現某種現實"}, {"w": "reveal", "n": "強調揭示出原本不明顯的情況"}], "note": "Reflect 既指物理反射（reflect light），又可表示「反映、體現」（reflect social values）。兩種用法在IELTS中均有出現。"}, {"word": "repel", "ipa": "/rɪˈpel/", "pos": "verb", "zh": "排斥；驅除", "part": "C", "examples": ["Like magnetic poles repel each other, a principle that underlies the design of magnetic levitation trains.", "The government's aggressive rhetoric served only to repel potential foreign investors rather than attract them."], "col": ["repel insects", "magnets repel", "repel an attack", "repel invaders", "repel moisture", "repel bacteria", "deeply repelled"], "syn": [{"w": "deter", "n": "強調阻止某人做某事（deter crime"}, {"w": "drive away", "n": "強調驅趕離開"}, {"w": "ward off", "n": "強調防禦性地驅走（ward off disease"}, {"w": "disgust", "n": "強調引起強烈的反感"}], "note": "Repel 有物理學（磁場相斥）和比喻性（使人反感）兩種用法。其形容詞 repellent（令人厭惡的）也常出現於IELTS描述性文章。"}, {"word": "solidify", "ipa": "/səˈlɪdɪfaɪ/", "pos": "verb", "zh": "凝固；使確定", "part": "C", "examples": ["Molten rock solidifies as it cools, forming new igneous rock layers that gradually build up the ocean floor.", "The partnership agreement solidified the relationship between the two companies after months of negotiation."], "col": ["solidified plans", "liquid solidified", "solidify a position", "solidify support", "solidify an agreement", "solidify control"], "syn": [{"w": "harden", "n": "廣義使變硬，也可比喻態度強硬"}, {"w": "set", "n": "指混凝土或果凍等凝固（the cement has set"}, {"w": "crystallise", "n": "可指結晶或比喻性地使想法清晰成形"}, {"w": "consolidate", "n": "比喻性地鞏固、加強"}], "note": "Solidify 在科學語境中指物理凝固；在比喻語境中指「鞏固、確立」（solidify one's position/alliance），在IELTS政治和商業議題寫作中很有用。"}, {"word": "revolve", "ipa": "/rɪˈvɒlv/", "pos": "verb", "zh": "旋轉；環繞", "part": "C", "examples": ["The Earth revolves around the Sun once every 365.25 days, defining our calendar year.", "Modern business strategy increasingly revolves around data analytics and consumer behaviour insights."], "col": ["revolve around", "earth revolve", "revolve on an axis", "revolve slowly", "life revolves around", "conversation revolves around"], "syn": [{"w": "orbit", "n": "特指天體沿固定軌道運行"}, {"w": "rotate", "n": "強調物體本身的自轉（rotate on its axis"}, {"w": "circle", "n": "廣義環繞移動"}, {"w": "centre on", "n": "比喻性地以…為中心"}], "note": "注意 revolve（公轉/環繞）與 rotate（自轉）的區別：地球 revolves around the sun（公轉），同時 rotates on its axis（自轉）。"}, {"word": "rotate", "ipa": "/rəʊˈteɪt/", "pos": "verb", "zh": "旋轉；輪作", "part": "C", "examples": ["Farmers rotate crops between fields each season to maintain soil fertility and reduce the build-up of pests.", "The mechanism causes the blades to rotate at high speed, generating sufficient lift for the helicopter."], "col": ["rotate crops", "earth rotate", "rotate on axis", "rotate staff", "rotate duties", "rotate freely", "rotating schedule"], "syn": [{"w": "spin", "n": "強調快速旋轉"}, {"w": "revolve", "n": "強調繞某點轉動（公轉"}, {"w": "turn", "n": "最廣義的轉動，口語化"}, {"w": "alternate", "n": "輪替的動作（alternate between tasks"}], "note": "Rotate 除物理旋轉外，還有「輪換」的含義（rotate staff / crop rotation），在農業和管理議題中很常見。"}, {"word": "strike", "ipa": "/straɪk/", "pos": "verb", "zh": "擊打；發現", "part": "C", "examples": ["Lightning struck the old oak tree during the storm, splitting it cleanly in two.", "It only  "have time on your hands", "ipa": "", "pos": "phrase", "zh": "有空閒時間", "part": "D", "examples": ["Retirees who suddenly have time on their hands often find it difficult to adjust to an unstructured daily routine.", "She had so much time on her hands during the lockdown that she learned two new languages."], "col": ["have time on your hands", "find yourself with time on your hands", "plenty of time on your hands"], "syn": [{"w": "have free time", "n": "最直白的說法"}, {"w": "be at leisure", "n": "較文雅，強調悠閒的狀態"}, {"w": "have nothing to do", "n": "強調缺乏任務，略帶無聊感"}, {"w": "have spare time", "n": "中性，指額外的空閒時間"}], "note": "這個習語通常帶有「時間多得不知如何是好」的隱含意思，不一定是正面的，在IELTS討論退休、失業或生活節奏時有用。"}, {"word": "in next to no time", "ipa": "", "pos": "phrase", "zh": "很快地；立刻", "part": "D", "examples": ["Thanks to the high-speed rail network, passengers can travel between the two cities in next to no time.", "The technician repaired the complex machinery in next to no time, surprising everyone present."], "col": ["finish in next to no time", "done in next to no time", "completed in next to no time"], "syn": [{"w": "in no time at all", "n": "強調幾乎立即完成"}, {"w": "in a flash", "n": "強調瞬間完成"}, {"w": "almost immediately", "n": "較正式的同義說法"}, {"w": "with remarkable speed", "n": "強調速度之快令人印象深刻"}], "note": "In next to no time 是口語化的固定習語，意指極快完成，適用於IELTS口語對話，書面寫作中宜改用 almost immediately 或 rapidly。"}, {"word": "in the blink of an eye", "ipa": "", "pos": "phrase", "zh": "轉眼之間", "part": "D", "examples": ["Technology that once seemed futuristic has become an everyday reality in the blink of an eye.", "Children grow up in the blink of an eye, which is why parents are encouraged to cherish each stage of development."], "col": ["happen in the blink of an eye", "disappear in the blink of an eye", "change in the blink of an eye"], "syn": [{"w": "in an instant", "n": "最直接的同義詞"}, {"w": "overnight", "n": "強調出乎意料的迅速變化"}, {"w": "almost instantaneously", "n": "較科學性的說法"}, {"w": "before you know it", "n": "口語，強調快得令人措手不及"}], "note": "在IELTS寫作中，可用 with astonishing speed 或 almost instantaneously 替代，以維持學術語體。In the blink of an eye 更適合口語語境。"}, {"word": "there aren't enough hours in the day", "ipa": "", "pos": "phrase", "zh": "時間不夠用", "part": "D", "examples": ["Working parents often feel there aren't enough hours in the day to balance career demands and family responsibilities.", "In a modern society with endless tasks and digital distractions, many people feel there simply aren't enough hours in the day."], "col": ["feel like there aren't enough hours in the day"], "syn": [{"w": "be overwhelmed by commitments", "n": "強調任務量超過承受能力"}, {"w": "s plate", "n": "口語化，強調責任太多"}, {"w": "struggle to manage time", "n": "強調時間管理困難"}, {"w": "be overworked", "n": "強調工作量超過負荷"}], "note": "這是高度口語化的習語，最適合IELTS口語Part 3討論現代生活節奏的話題。寫作時宜改為 many people find it difficult to fit all their responsibilities into a single day。"}, {"word": "time goes so fast", "ipa": "", "pos": "phrase", "zh": "時間過得真快", "part": "D", "examples": ["Parents frequently remark on how time goes so fast as they watch their children grow through each milestone.", "It is only when we look back that we realise just how fast time goes during our most formative years."], "col": ["realise time goes so fast", "time goes so fast when you're busy", "time goes by so quickly"], "syn": [{"w": "time flies", "n": "最著名的近義習語（Time flies when you're having fun"}, {"w": "the years pass quickly", "n": "較正式的同義表達"}, {"w": "time is fleeting", "n": "帶有哲學或詩意色彩"}, {"w": "how swiftly time passes", "n": "文學性較強的說法"}], "note": "在IELTS口語中這類表達自然生動；在寫作中可升級為 'the pace at which time passes' 或 'how swiftly the years go by'。"}]
};

const PART_LABELS = {
  A:'Part A · Nouns', B:'Part B · Adjectives',
  C:'Part C · Verbs',  D:'Part D · Phrases'
};

const SK = 'ielts_u2';
let cur=0, mode='browse', flipped=false, known=[], onIntro=true;

function load(){ try{ known=JSON.parse(localStorage.getItem(SK)||'[]'); }catch(e){known=[];} }
function save(){ try{ localStorage.setItem(SK,JSON.stringify(known)); }catch(e){} }
function isKnown(i){ return known.includes(i); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function updateDots(){
  const n=UNIT.words.length, max=Math.min(n,30);
  let h='';
  for(let i=0;i<max;i++){
    const c=(!onIntro&&i===cur)?'dot cur':isKnown(i)?'dot known':'dot';
    h+='<div class="'+c+'"></div>';
  }
  if(n>max) h+='<span style="font-family:var(--fm);font-size:.5rem;color:var(--g400);margin-left:2px;">+'+(n-max)+'</span>';
  document.getElementById('dots').innerHTML=h;
}

function renderIntro(){
  document.getElementById('counter').textContent='Introduction';
  document.getElementById('known-badge').textContent='';
  document.getElementById('prog-fill').style.width='0%';
  document.getElementById('action-count').textContent='';
  document.getElementById('know-btn').style.display='none';
  document.getElementById('review-btn').style.display='none';

  const f=document.getElementById('front-face');
  f.className='face front intro-face';
  f.innerHTML=
    '<div class="ic-eyebrow">IELTS Core Thematic Vocabulary · Chapter 2 of 10</div>'+
    '<div class="ic-title">Time, Change & Science Processes</div>'+
    '<div class="ic-zh">時間、變遷與科學程序</div>'+
    '<div class="ic-rule"></div>'+
    '<div class="ic-body">'+
      '<div>'+
        '<div class="ic-sec-label">關於本章</div>'+
        '<div class="ic-about">本章收錄 55 個核心詞彙。每個詞條包含例句、搭配詞、近義辨析，部分附有學習注意事項。</div>'+
      '</div>'+
      '<div>'+
        '<div class="ic-sec-label">使用方式</div>'+
        '<div class="ic-steps">'+
          '<div class="ic-step"><span class="ic-tag">Browse</span>正面顯示英文單字，翻面查看中文、例句與搭配詞。</div>'+
          '<div class="ic-step"><span class="ic-tag">Quiz</span>正面顯示中文，翻面前先回想英文，訓練主動回憶。</div>'+
          '<div class="ic-step"><span class="ic-tag">Know it ✓</span>標記已掌握。<span class="ic-tag">Review ↺</span>重新複習。</div>'+
          '<div class="ic-step"><span class="ic-tag">快捷鍵</span>← → 切換卡片 &nbsp;·&nbsp; F 翻轉 &nbsp;·&nbsp; K 標記</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="ic-hint">按 Next → 開始學習</div>';

  document.getElementById('back-face').innerHTML='';
  updateDots();
}

function render(){
  if(onIntro){ renderIntro(); return; }
  document.getElementById('front-face').className='face front';
  document.getElementById('know-btn').style.display='';
  document.getElementById('review-btn').style.display='';

  const w=UNIT.words[cur], n=UNIT.words.length, k=isKnown(cur);
  document.getElementById('counter').textContent=(cur+1)+' / '+n;
  document.getElementById('known-badge').textContent=known.length+' / '+n+' known';
  document.getElementById('prog-fill').style.width=((cur+1)/n*100)+'%';
  document.getElementById('action-count').textContent=known.length+'/'+n;

  const isQuiz=(mode==='quiz');

  document.getElementById('front-face').innerHTML=
    '<div class="f-top">'+
      '<div class="f-meta">'+
        '<div class="f-num">#'+String(cur+1).padStart(3,'0')+'</div>'+
        '<div class="f-part">'+(PART_LABELS[w.part]||'')+'</div>'+
      '</div>'+
      '<span class="f-known-mark'+(k?' vis':'')+'">✓ known</span>'+
    '</div>'+
    '<div class="f-body">'+
      '<div class="f-word">'+esc(isQuiz?w.zh:w.word)+'</div>'+
      (!isQuiz&&w.ipa?'<div class="f-ipa">'+esc(w.ipa)+'</div>':'')+
      (!isQuiz?'<div class="f-pos">'+esc(w.pos)+'</div>':'')+
    '</div>'+
    '<div class="f-hint">'+(isQuiz?'think → click to flip':'click to flip →')+'</div>';

  const exH=(w.examples||[]).map(e=>'<div class="b-ex">“'+esc(e)+'”</div>').join('');
  const colH=(w.col||[]).map(c=>'<div class="b-col">'+esc(c)+'</div>').join('');
  const synH=(w.syn||[]).map(s=>
    '<div class="b-syn-row"><div class="b-syn-w">'+esc(s.w)+'</div>'+
    '<div class="b-syn-n">（'+esc(s.n)+'）</div></div>'
  ).join('');
  const noteH=w.note
    ?'<div class="b-sec"><div class="b-label">注意</div><div class="b-note">'+esc(w.note)+'</div></div>':'';

  let zhLine, metaLine='';
  if(isQuiz){
    zhLine='<div class="b-quiz-word">'+esc(w.word)+'</div>';
    metaLine='<div class="b-quiz-meta">'+esc(w.pos)+(w.ipa?' &nbsp;'+esc(w.ipa):'')+'</div>';
  } else {
    zhLine='<div class="b-zh">'+esc(w.zh)+'</div>';
  }

  document.getElementById('back-face').innerHTML=
    zhLine+metaLine+
    '<div class="b-rule"></div>'+
    '<div class="b-content">'+
      (exH?'<div class="b-sec"><div class="b-label">Examples</div>'+exH+'</div>':'')+
      (colH?'<div class="b-sec"><div class="b-label">搭配</div><div class="b-cols">'+colH+'</div></div>':'')+
      (synH?'<div class="b-sec"><div class="b-label">近義</div><div class="b-syns">'+synH+'</div></div>':'')+
      noteH+
    '</div>';

  updateDots();
}

function flip(){
  if(onIntro) return;
  flipped=!flipped;
  document.getElementById('card').classList.toggle('flipped',flipped);
}

function go(dir){
  if(onIntro&&dir>0){
    onIntro=false;cur=0;flipped=false;
    document.getElementById('card').classList.remove('flipped');
    render();return;
  }
  if(!onIntro&&dir<0&&cur===0){
    onIntro=true;flipped=false;
    document.getElementById('card').classList.remove('flipped');
    render();return;
  }
  if(onIntro) return;
  cur=Math.max(0,Math.min(UNIT.words.length-1,cur+dir));
  flipped=false;
  document.getElementById('card').classList.remove('flipped');
  render();
}

function markKnown(){
  if(onIntro) return;
  if(!isKnown(cur)) known.push(cur);
  save();render();
  setTimeout(function(){ if(cur<UNIT.words.length-1) go(1); },180);
}

function markReview(){
  if(onIntro) return;
  known=known.filter(function(x){return x!==cur;});
  save();render();
}

function setMode(m){
  mode=m;flipped=false;
  document.getElementById('card').classList.remove('flipped');
  document.querySelectorAll('.mode-btn').forEach(function(b){
    b.classList.toggle('active',b.dataset.mode===m);
  });
  render();
}

let suppressClick=false;
(function(){
  const sc=document.getElementById('scene');
  sc.addEventListener('click',function(){
    if(suppressClick){suppressClick=false;return;}
    flip();
  });
  let x0=null,y0=null;
  sc.addEventListener('touchstart',function(e){
    const t=e.changedTouches[0];x0=t.clientX;y0=t.clientY;
  },{passive:true});
  sc.addEventListener('touchend',function(e){
    if(x0===null)return;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4){
      suppressClick=true;
      go(dx<0?1:-1);
      setTimeout(function(){suppressClick=false;},400);
    }
    x0=null;
  },{passive:true});
})();
document.getElementById('prev-btn').addEventListener('click',function(e){e.stopPropagation();go(-1);});
document.getElementById('next-btn').addEventListener('click',function(e){e.stopPropagation();go(1);});
document.getElementById('know-btn').addEventListener('click',function(e){e.stopPropagation();markKnown();});
document.getElementById('review-btn').addEventListener('click',function(e){e.stopPropagation();markReview();});
document.querySelectorAll('.mode-btn').forEach(function(b){
  b.addEventListener('click',function(e){e.stopPropagation();setMode(b.dataset.mode);});
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='f'||e.key==='F') flip();
  else if(e.key==='k'||e.key==='K') markKnown();
});

load();render();
</script>
</body>
</html>
