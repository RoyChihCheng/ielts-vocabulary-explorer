<script>
const UNIT = {
  number: 7,
  title_en: "Environment, Weather & Energy",
  title_zh: "\u74b0\u5883\u4fdd\u80b2\u3001\u6c23\u8c61\u8207\u80fd\u6e90",
  src: "Units 15 & 16",
  count: 55,
  words: [{"word": "acid rain","ipa": "/ˌæsɪd ˈreɪn/","pos": "noun","zh": "酸雨","part": "A","examples": ["Acid rain caused by sulphur dioxide emissions from coal-fired power stations has devastated forests across Scandinavia and Central Europe.","Strict emission controls introduced in the 1990s have significantly reduced the incidence of acid rain in many developed countries."],"col": ["acid rain damage","effects of acid rain","cause acid rain","acid rain pollution","reduce acid rain","acid rain and forests","acid rain formation","acid rain crisis"],"syn": [{"w": "acidic precipitation","n": "更正式的科學術語，涵蓋酸雨、酸霧和酸雪"},{"w": "sulphuric deposition","n": "最學術，強調硫磺化合物沉降的化學過程"},{"w": "atmospheric pollution","n": "更廣義，包含acid rain在內的所有大氣污染形式"}],"note": "acid rain是IELTS環境類核心詞彙；其形成機制（SO₂ + 水蒸氣）和對生態的影響（forest dieback、lake acidification）是常見考點。"},{"word": "aftershock","ipa": "/ˈɑːftəʃɒk/","pos": "noun","zh": "餘震","part": "A","examples": ["Rescue teams were repeatedly hampered in their efforts by a series of powerful aftershocks following the initial earthquake.","Economists speak of the financial aftershocks of the 2008 crisis still being felt by governments and households more than a decade later."],"col": ["powerful aftershock","series of aftershocks","aftershock damage","feel aftershocks","aftershock warning","economic aftershock","aftershock zone","aftershock magnitude"],"syn": [{"w": "tremor","n": "可指小型地震或餘震，比aftershock更廣義，也可指初次地震"},{"w": "seismic activity","n": "最學術，泛指所有地震相關活動"},{"w": "repercussion","n": "比喻義：指事件的連帶後果，如economic repercussions"}],"note": "aftershock除地質意義外，也常比喻性地用於描述重大事件（如金融危機）的後續衝擊；IELTS自然災害類文章和社會議題類文章中均可出現。"},{"word": "draft","ipa": "/drɑːft/","pos": "noun","zh": "草稿；冷風","part": "A","examples": ["A cold draft swept through the poorly insulated building, making it uncomfortable for residents during winter months.","The initial draft of the environmental policy was revised multiple times before receiving approval from the committee."],"col": ["cold draft","first draft","draft legislation","draft agreement","military draft","draft policy","draft version","draft copy"],"syn": [{"w": "draught","n": "英式英語拼法，與draft同義，在氣流語境中更常用"},{"w": "breeze","n": "偏正面，指輕柔的微風，比draft更溫和"},{"w": "current","n": "偏指氣流或水流的流動方向，比draft更廣義"}],"note": "draft在美式英語中通用，draught是英式拼法；在IELTS英式英語語境中，draught（通風/風吹）和drought（旱災，不同詞）是常被混淆的詞，需特別區分。"},{"word": "flooding","ipa": "/ˈflʌdɪŋ/","pos": "noun","zh": "洪水","part": "A","examples": ["The severity of flooding in low-lying coastal areas is expected to increase dramatically as global sea levels continue to rise.","Urban flooding has become an increasingly common phenomenon as impermeable surfaces replace natural drainage systems."],"col": ["severe flooding","coastal flooding","urban flooding","flooding risk","flooding event","flash flooding","prevent flooding","flooding damage"],"syn": [{"w": "inundation","n": "最正式的學術術語，描述被水淹沒的狀態"},{"w": "deluge","n": "強調大量水的湧入，帶有文學性和戲劇感"},{"w": "overflow","n": "強調水超出容量而溢出，比flooding更強調原因"}],"note": "flooding是IELTS氣候和城市規劃類核心詞彙；flash flooding（暴洪）是重要的極端天氣類型；coastal flooding與sea level rise的關聯是必知考點。"},{"word": "lava","ipa": "/ˈlɑːvə/","pos": "noun","zh": "岩漿","part": "A","examples": ["The Hawaiian islands were formed entirely from lava produced by a volcanic hotspot deep beneath the Pacific Ocean floor.","Lava flows from the eruption advanced slowly towards the town, giving residents time to evacuate safely."],"col": ["lava flow","volcanic lava","lava field","solidified lava","lava tube","fast-moving lava","lava eruption","streams of lava"],"syn": [{"w": "magma","n": "指地表以下未噴出的熔融岩石，lava是噴出地表的magma"},{"w": "molten rock","n": "最描述性，強調液態融化的岩石"},{"w": "volcanic rock","n": "指冷卻固化後的火山岩，是lava的固態形式"}],"note": "lava（地表上）vs. magma（地表下）是IELTS地理類閱讀的常見區分考點；lava flow的速度和影響是自然災害題的典型細節。"},{"word": "petal","ipa": "/ˈpetəl/","pos": "noun","zh": "花瓣","part": "A","examples": ["Bees use their vision to detect the ultraviolet patterns on petals that guide them towards pollen and nectar.","The falling petals of cherry blossoms have become a symbol of the transience of beauty in Japanese culture."],"col": ["rose petal","fallen petal","petal pattern","scatter petals","delicate petal","petal colour","flower petal","petal shape"],"syn": [{"w": "bloom","n": "指整朵花或花朵的狀態，比petal更廣義"},{"w": "blossom","n": "特指樹木開出的花，比petal更強調整體花序"},{"w": "floret","n": "指複合花序中的單個小花，比petal更學術"}],"note": "petal在IELTS生態類閱讀中常作為授粉機制描述的一部分出現；petals attracting pollinators（花瓣吸引授粉者）是植物生態學的核心概念。"},{"word": "puddle","ipa": "/ˈpʌdəl/","pos": "noun","zh": "水窪","part": "A","examples": ["After the storm, the poorly drained streets were covered in puddles that made cycling hazardous for commuters.","Urban planners are incorporating permeable paving materials that allow rainwater to drain quickly rather than forming puddles."],"col": ["muddy puddle","large puddle","rain puddle","step in a puddle","puddle formation","avoid puddles","puddle of water","puddle of oil"],"syn": [{"w": "pool","n": "比puddle更大的水聚積，也可指游泳池"},{"w": "waterlogged area","n": "強調土地因水分過多而飽和，比puddle更強調土壤狀態"},{"w": "depression","n": "地理術語，指可能積水的地形低窪處"}],"note": "puddle是IELTS城市規劃中描述排水問題的具體詞彙；permeable pavement（透水鋪面）可防止積水，是sponge city設計的重要組成。"},{"word": "reservoir","ipa": "/ˈrezəvwɑː/","pos": "noun","zh": "水庫；蓄水池","part": "A","examples": ["The construction of a new reservoir has provided the region with a reliable water supply capable of sustaining the growing population.","Forests serve as natural reservoirs of biodiversity, harbouring thousands of species that depend on specific ecological conditions."],"col": ["water reservoir","underground reservoir","reservoir capacity","fill a reservoir","reservoir level","natural reservoir","reservoir dam","carbon reservoir"],"syn": [{"w": "storage tank","n": "最廣義，泛指任何儲存液體的設施"},{"w": "catchment","n": "指集水區，是向reservoir供水的地理範圍"},{"w": "aquifer","n": "特指地下水層，是地下的天然水儲存層"}],"note": "reservoir既指人工水庫，也可比喻為資源儲存庫（a reservoir of talent）；IELTS中reservoir water levels是衡量乾旱嚴重程度的重要指標。"},{"word": "stem","ipa": "/stem/","pos": "noun","zh": "莖；源於","part": "A","examples": ["Scientists have discovered that the stem cells found in bone marrow can be used to treat a variety of blood disorders.","The stem of a plant serves as the structural support that connects the root system to the leaves and flowers."],"col": ["plant stem","stem cell","stem the tide","stem from","flower stem","main stem","stem growth","stem research"],"syn": [{"w": "stalk","n": "特指較細的花莖或草莖，與stem幾乎同義"},{"w": "trunk","n": "特指樹幹，比stem更強調木質結構"},{"w": "branch","n": "特指從主幹分出的枝條，是stem的延伸"}],"note": "stem既是名詞（莖、主幹）也是動詞；IELTS中stem from（源自）是描述因果關係的高分表達，stem the tide（遏制趨勢）也常出現。"},{"word": "tremor","ipa": "/ˈtremə/","pos": "noun","zh": "顫動；小地震","part": "A","examples": ["A series of minor tremors in the weeks preceding the major earthquake were not given sufficient attention by local authorities.","The elderly man's hands showed a slight tremor that had become more pronounced over the previous year."],"col": ["earth tremor","minor tremor","seismic tremor","feel a tremor","tremor activity","tremor detection","aftershock tremor","ground tremor"],"syn": [{"w": "earthquake","n": "比tremor規模更大，泛指所有地震，tremor多指較小的震動"},{"w": "shudder","n": "強調身體的顫抖或震動，比tremor更偏生理或情感反應"},{"w": "vibration","n": "泛指任何規律性震動，比tremor更廣義且中性"}],"note": "tremor比earthquake規模小；IELTS地質和災害類文章中，tremor常作為earthquake的前兆（precursor）出現，其探測和預警是防災的重要議題。"},{"word": "current","ipa": "/ˈkʌrənt/","pos": "noun","zh": "水流；目前的","part": "A","examples": ["Ocean currents play a critical role in regulating the Earth's climate by distributing heat around the globe.","There is a current of opinion among economists that traditional monetary policy tools are becoming less effective."],"col": ["ocean current","air current","electric current","current of opinion","strong current","underwater current","jet stream current","prevailing current"],"syn": [{"w": "flow","n": "最廣義，強調液體或氣體的流動，比current更廣"},{"w": "stream","n": "強調連續流動的水或氣流，比current更具體"},{"w": "trend","n": "比喻義：與currents of opinion同義，指思想或社會的走向"}],"note": "current有多義：ocean currents（洋流）、electric current（電流）、a current of change（趨勢）；IELTS氣候類文章中thermohaline circulation是核心概念。"},{"word": "dense","ipa": "/dens/","pos": "adj","zh": "濃密的","part": "B","examples": ["The dense canopy of tropical rainforests filters out most sunlight before it can reach the forest floor.","Urban areas with dense populations require sophisticated public transport networks to prevent crippling traffic congestion."],"col": ["dense forest","dense population","dense fog","dense vegetation","dense network","extremely dense","dense urban area","dense traffic"],"syn": [{"w": "thick","n": "最廣義，強調密集或厚重，與dense幾乎同義"},{"w": "concentrated","n": "強調在小範圍內高度集中，比dense更強調比例"},{"w": "compact","n": "強調緊密壓縮，比dense更強調物理結構"}],"note": "dense population是IELTS城市類核心搭配；dense forest是環境類常見搭配；相對詞sparse（稀疏）常與dense對照使用。"},{"word": "freezing","ipa": "/ˈfriːzɪŋ/","pos": "adj","zh": "冰凍的","part": "B","examples": ["Freezing temperatures in the polar regions are essential for maintaining the ice sheets that regulate global sea levels.","Deep-sea hydrothermal vents support unique life forms capable of surviving in freezing, high-pressure conditions."],"col": ["freezing temperature","freezing conditions","freezing cold","below freezing","freezing point","nearly freezing","freezing weather","freezing water"],"syn": [{"w": "sub-zero","n": "特指低於零度的溫度，比freezing更精確"},{"w": "arctic","n": "形容極度寒冷，比freezing更強烈，帶有極地聯想"},{"w": "glacial","n": "與冰川相關，比喻義：冷漠的、慢如冰川的"}],"note": "freezing point（冰點，0°C）是IELTS科學類閱讀的基礎概念；freezing conditions（冰凍條件）在描述極端氣候對基礎設施和生態的影響時是核心詞彙。"},{"word": "heavy","ipa": "/ˈhevi/","pos": "adj","zh": "重的；猛烈的","part": "B","examples": ["Heavy rainfall has intensified in frequency across many regions, causing more frequent and severe flash flooding events.","Heavy investment in renewable energy technology is widely regarded as essential for meeting long-term carbon reduction targets."],"col": ["heavy rainfall","heavy traffic","heavy industry","heavy investment","heavy pollution","heavy snowfall","heavy burden","heavy reliance"],"syn": [{"w": "substantial","n": "強調分量重大，比heavy更正式，可修飾抽象概念"},{"w": "significant","n": "強調重要性，比heavy更廣義，不強調物理重量"},{"w": "intense","n": "強調強度高，比heavy更常用於情緒、競爭等語境"}],"note": "heavy在IELTS中多功能：heavy rainfall/snow（大量降雨/雪）、heavy traffic（嚴重交通）、heavy industry（重工業）；學術寫作中可用substantial替換提升分數。"},{"word": "long-term","ipa": "/ˌlɒŋ ˈtɜːm/","pos": "adj","zh": "長期的","part": "B","examples": ["Long-term exposure to fine particulate matter in the air has been linked to increased rates of lung disease and cardiovascular conditions.","Investing in education yields significant long-term economic benefits, even though the returns may not be immediately apparent."],"col": ["long-term effects","long-term solution","long-term investment","long-term impact","long-term goal","long-term sustainability","long-term consequence","long-term strategy"],"syn": [{"w": "sustained","n": "強調長時間持續的努力或狀態，比long-term更強調主動維持"},{"w": "enduring","n": "強調持久不衰，帶有積極的永恆意涵"},{"w": "permanent","n": "強調永久性，比long-term更絕對，不一定有特定時限"}],"note": "long-term是IELTS最常見複合形容詞之一；long-term consequences vs. short-term gains的權衡是Task 2論述環境、教育和經濟政策的核心框架。"},{"word": "resistant","ipa": "/rɪˈzɪstənt/","pos": "adj","zh": "有抵抗力的；耐...的","part": "B","examples": ["The emergence of antibiotic-resistant bacteria is one of the most serious public health challenges of the twenty-first century.","Modern building codes require that coastal structures be constructed from materials resistant to both salt corrosion and storm surge."],"col": ["resistant to change","antibiotic-resistant","heat-resistant","weather-resistant","drug-resistant","resistant bacteria","resistant material","naturally resistant"],"syn": [{"w": "resilient","n": "強調能夠承受壓力並從中恢復，比resistant更積極"},{"w": "immune","n": "強調完全不受影響，比resistant程度更強"},{"w": "durable","n": "強調耐用性，比resistant更廣義的物理特性"}],"note": "resistant在IELTS醫學類文章中幾乎必出（antibiotic-resistant bacteria）；環境類文章中resistant materials是描述氣候適應基礎設施的重要詞彙。"},{"word": "severe","ipa": "/sɪˈvɪə/","pos": "adj","zh": "嚴重的","part": "B","examples": ["Severe weather events, including hurricanes and wildfires, are increasing in both frequency and intensity as global temperatures rise.","The economic consequences of the pandemic were severe for many developing nations whose tourism-dependent economies collapsed overnight."],"col": ["severe weather","severe consequences","severe damage","severe shortage","severe punishment","extremely severe","severe impact","severe drought"],"syn": [{"w": "serious","n": "最廣義，強調值得重視的嚴重程度，比severe更口語"},{"w": "acute","n": "強調問題突然且嚴重，常用於醫療語境（acute shortage）"},{"w": "grave","n": "強調危及生死的嚴重性，比severe更正式且帶有威脅感"}],"note": "severe是IELTS最高頻形容詞之一，幾乎適用於所有主題；在Task 1中，severe floods/droughts/storms是描述極端天氣數據的核心詞彙。"},{"word": "a storm in a teacup","ipa": "/ə stɔːm ɪn ə ˈtiːkʌp/","pos": "phrase","zh": "小事化大；茶壺裡的風暴","part": "D","examples": ["What the media portrayed as a constitutional crisis was, in retrospect, little more than a storm in a teacup that was resolved within days.","Critics dismissed the public outcry over the new parking policy as a storm in a teacup that would quickly fade from public attention."],"col": ["merely a storm in a teacup","describe as a storm in a teacup","nothing but a storm in a teacup","turn out to be a storm in a teacup","prove to be a storm in a teacup","a political storm in a teacup","what seemed like a storm in a teacup","overblown storm in a teacup"],"syn": [{"w": "much ado about nothing","n": "莎士比亞式表達，意指大驚小怪，比此短語更文學性"},{"w": "overreaction","n": "最直接，強調反應過度於事件本身的重要性"},{"w": "tempest in a teapot","n": "美式英語的對應說法，意義完全相同"}],"note": "a storm in a teacup是英式英語慣用語（美式：tempest in a teapot），指誇大的小爭議；在IELTS口語中使用此類習語可展現豐富語言能力。"},{"word": "be snowed under","ipa": "/biː snəʊd ˈʌndə/","pos": "phrase","zh": "忙得不可開交","part": "D","examples": ["Many small businesses were completely snowed under with applications following the announcement of the government's emergency funding scheme.","Doctors at urban clinics are frequently snowed under with patients during winter months when respiratory illnesses peak."],"col": ["completely snowed under","snowed under with work","snowed under with requests","feel snowed under","be totally snowed under","snowed under with applications","snowed under during peak season","currently snowed under"],"syn": [{"w": "overwhelmed","n": "最直接，強調被過多的事情淹沒而應付不來"},{"w": "inundated","n": "更正式，比喻性地指被大量的事情、請求所充斥"},{"w": "swamped","n": "口語，強調事務繁多到不知所措的狀態"}],"note": "be snowed under是IELTS口語實用慣用語，表示應接不暇；正式寫作中建議替換為overwhelmed with responsibilities或inundated with requests。"},{"word": "every cloud has a silver lining","ipa": "/ˈevri klaʊd hæz ə ˈsɪlvə ˈlaɪnɪŋ/","pos": "phrase","zh": "否極泰來；黑暗中總有一線生機","part": "D","examples": ["While the pandemic caused immense suffering, every cloud has a silver lining: it also accelerated the development of remote work infrastructure.","Economic recessions are painful, but every cloud has a silver lining, often forcing companies to innovate and eliminate inefficiency."],"col": ["every cloud has a silver lining","see the silver lining","find the silver lining","remind that every cloud","believe every cloud has","silver lining in crisis","find a silver lining in","look for the silver lining"],"syn": [{"w": "look on the bright side","n": "強調積極樂觀地看待問題，比此諺語更口語"},{"w": "optimistic outlook","n": "正式表達，強調對未來的樂觀態度"},{"w": "benefits of adversity","n": "最學術，強調逆境所帶來的積極影響"}],"note": "Every cloud has a silver lining是IELTS口語展示諺語的好機會；Task 2中可用despite the challenges, there are potential benefits替換以提升學術性。"},{"word": "in the cold light of day","ipa": "/ɪn ðə kəʊld laɪt əv deɪ/","pos": "phrase","zh": "冷靜清醒的時候","part": "D","examples": ["In the cold light of day, the government's hasty decision to impose the policy appeared far more reckless than it had seemed under pressure.","Many contracts that seem attractive when first proposed look very different in the cold light of day once the full terms are understood."],"col": ["in the cold light of day","reassess in the cold light of day","view in the cold light of day","seen in the cold light of day","look different in the cold light of day","examine in the cold light","reconsider in the cold light","judge in the cold light of day"],"syn": [{"w": "upon reflection","n": "強調事後的仔細思考，比此短語更正式"},{"w": "in retrospect","n": "強調回顧過去時的清醒判斷，是IELTS高分表達"},{"w": "with hindsight","n": "強調事後了解到的智慧，比此短語更正式且常用"}],"note": "in the cold light of day指去除情感後冷靜分析；IELTS正式寫作中，with hindsight或upon reflection是更學術的替換表達。"},{"word": "know which way the wind is blowing","ipa": "/nəʊ wɪtʃ weɪ ðə wɪnd ɪz ˈbləʊɪŋ/","pos": "phrase","zh": "察言觀色；掌握趨勢","part": "D","examples": ["Experienced politicians know which way the wind is blowing and often adjust their positions before public opinion fully crystallises.","Savvy investors know which way the wind is blowing in the technology sector and position themselves ahead of major market shifts."],"col": ["know which way the wind is blowing","sense which way the wind blows","read the way the wind is blowing","watch which way the wind blows","see which way the wind is blowing","understand which way wind blows","detect which way the wind blows","anticipate which way wind blows"],"syn": [{"w": "read the situation","n": "最直接，強調準確判斷當前形勢"},{"w": "anticipate trends","n": "更正式，強調預測未來走向"},{"w": "gauge public opinion","n": "強調測量並理解民意走向，偏政治語境"}],"note": "此諺語強調對局勢的敏銳判斷；IELTS中可用sense the prevailing trends或read the situation accurately作為更正式的替換表達。"},{"word": "not have the foggiest idea","ipa": "/nɒt hæv ðə ˈfɒɡiɪst aɪˈdɪə/","pos": "phrase","zh": "毫無頭緒","part": "D","examples": ["When first-year students are asked about career planning, many not only do not have the foggiest idea what they want, but are not even sure how to find out.","I had not the foggiest idea that the experiment would yield such remarkable and unexpected results."],"col": ["not have the foggiest idea","absolutely no idea","not the foggiest","not have a clue","haven't the foggiest","not the foggiest notion","completely in the dark","without the foggiest idea"],"syn": [{"w": "have no idea","n": "最直接的口語表達，比此短語更簡潔"},{"w": "be completely unaware","n": "更正式，強調對某事毫不知情"},{"w": "be clueless about","n": "口語，強調對某主題的完全無知"}],"note": "not have the foggiest idea是英式口語，強調完全不知道；IELTS正式寫作中應替換為have no knowledge of或be entirely unaware of。"},{"word": "the calm before the storm","ipa": "/ðə kɑːm bɪˈfɔː ðə stɔːm/","pos": "phrase","zh": "暴風雨前的寧靜","part": "D","examples": ["The apparent economic stability of the late 1990s proved to be the calm before the storm of the dot-com bubble collapse.","Historians now recognise the relative political stability of the 1930s in certain European nations as the calm before the storm of the Second World War."],"col": ["the calm before the storm","experience the calm before the storm","what appeared to be calm before storm","recognise as calm before storm","period of calm before storm","an eerie calm before storm","seemingly peaceful calm before storm","this was the calm before storm"],"syn": [{"w": "temporary lull","n": "強調暫時的平靜，暗示之後的困難即將到來"},{"w": "deceptive tranquility","n": "強調表面平靜具有欺騙性"},{"w": "false sense of security","n": "強調在危機前錯誤地感到安全"}],"note": "the calm before the storm是IELTS常用比喻；可替換為a period of deceptive stability（一段具有欺騙性的穩定時期）以提升學術性。"},{"word": "not a cloud in the sky","ipa": "/nɒt ə klaʊd ɪn ðə skaɪ/","pos": "phrase","zh": "萬里無雲","part": "D","examples": ["At the height of the economic boom in 2006, there appeared to be not a cloud in the sky for the property market, yet the crash came just two years later.","Travel writers often describe the appeal of Mediterranean destinations as offering not a cloud in the sky for weeks at a time."],"col": ["not a cloud in the sky","clear blue skies","completely clear sky","totally cloudless","not a cloud to be seen","perfectly clear sky","cloudless horizon","clear skies ahead"],"syn": [{"w": "perfectly clear","n": "最直接，描述天空無雲"},{"w": "ideal conditions","n": "廣義，指各方面都順利的最佳情況"},{"w": "smooth sailing","n": "比喻義：指一切順利，沒有障礙"}],"note": "not a cloud in the sky字面指晴空萬里，比喻指前景一片光明；IELTS中常作為後接轉折語義的鋪墊（but/however），描述表面繁榮後的崩潰。"},{"word": "vicious circle","ipa": "/ˌvɪʃəs ˈsɜːkəl/","pos": "phrase","zh": "惡性循環","part": "D","examples": ["Poverty can create a vicious circle in which lack of education leads to unemployment, which in turn perpetuates poverty across generations.","Deforestation and climate change create a vicious circle: forests that regulate rainfall are destroyed, reducing rainfall, which prevents forest regrowth."],"col": ["vicious circle of poverty","break the vicious circle","trapped in a vicious circle","create a vicious circle","enter a vicious circle","perpetuate a vicious circle","a vicious circle of debt","escape the vicious circle"],"syn": [{"w": "downward spiral","n": "強調持續惡化的下降趨勢，比vicious circle更強調方向性"},{"w": "negative feedback loop","n": "最學術，強調系統性的自我強化的負面循環"},{"w": "self-perpetuating cycle","n": "強調循環本身具有自我維持和強化的特性"}],"note": "vicious circle是IELTS最重要的慣用語之一；negative feedback loop是學術替換詞；break the vicious circle是論述政策效果的高分表達。"},{"word": "weather the storm","ipa": "/ˈweðə ðə stɔːm/","pos": "phrase","zh": "渡過難關","part": "D","examples": ["Many businesses that managed to weather the storm of the pandemic emerged leaner and more digitally capable than before.","Small island nations threatened by rising sea levels must find ways to weather the storm of climate change with limited financial resources."],"col": ["weather the storm of crisis","successfully weather the storm","able to weather the storm","weather economic storm","weather the financial storm","help weather the storm","barely weather the storm","weather this storm together"],"syn": [{"w": "survive the crisis","n": "最直接，強調存活渡過危機"},{"w": "endure adversity","n": "更正式，強調忍耐承受逆境"},{"w": "overcome challenges","n": "最廣義，強調克服困難後的成功"}],"note": "weather the storm是IELTS商業、政治和社會類寫作中形容「渡過難關」的高分慣用語；在Task 2中描述企業或政府應對危機的韌性時，此短語效果極好。"},{"word": "breed","ipa": "/briːd/","pos": "verb","zh": "繁殖；培育","part": "C","examples": ["Overcrowded and unsanitary conditions in some urban slums breed disease and social discontent in equal measure.","Conservation programmes that breed endangered animals in captivity have helped stabilise the populations of several critically threatened species."],"col": ["breed animals","breed contempt","breed discontent","breed in captivity","captive breeding","breed mistrust","breed disease","successfully breed"],"syn": [{"w": "reproduce","n": "最廣義的生物繁殖動詞，比breed更中性"},{"w": "propagate","n": "強調繁衍和傳播，比breed更正式，常用於植物"},{"w": "cultivate","n": "比喻義：強調培育和發展，如cultivate trust"}],"note": "breed有生物義（繁殖）和比喻義（滋生）；breed contempt（滋生輕蔑）和breed discontent（製造不滿）是IELTS分析社會問題的高分比喻用法。"},{"word": "flow","ipa": "/fləʊ/","pos": "verb","zh": "流動","part": "C","examples": ["Capital flows freely across national borders in today's globalised financial system, creating both opportunities and vulnerabilities.","Information flows through digital networks at unprecedented speed, fundamentally altering the way societies form opinions and make decisions."],"col": ["flow freely","flow into","flow through","cash flow","flow of information","flow of traffic","steady flow","flow of capital"],"syn": [{"w": "circulate","n": "強調循環流通，比flow更強調周而復始的運動"},{"w": "stream","n": "強調連續流動，比flow更形象化，帶有河流意象"},{"w": "move","n": "最廣義，泛指任何形式的移動"}],"note": "flow是IELTS多主題核心詞彙：traffic flow（交通流量）、cash flow（現金流）、information flow（資訊流）；free flow of information是媒體全球化的重要概念。"},{"word": "sow","ipa": "/səʊ/","pos": "verb","zh": "播種","part": "C","examples": ["The government's economic policies have sown the seeds of a financial crisis that economists predict will materialise within the next decade.","Farmers in arid regions must sow drought-resistant crop varieties to maintain viable yields as rainfall patterns become increasingly unpredictable."],"col": ["sow seeds","sow crops","sow discord","sow doubt","sow the seeds of","sow division","sow confusion","sow wheat"],"syn": [{"w": "plant","n": "最廣義，泛指種植任何植物，比sow更廣義"},{"w": "scatter","n": "強調撒播的動作，比sow更強調廣泛分撒"},{"w": "cultivate","n": "強調整個種植培育過程，比sow更廣義"}],"note": "sow有農業義（播種）和比喻義（埋下）；sow the seeds of是IELTS高分固定搭配，如sow the seeds of conflict/growth，是論述長期因果關係的有效表達。"},{"word": "cultivate","ipa": "/ˈkʌltɪveɪt/","pos": "verb","zh": "耕作；培養","part": "C","examples": ["Local authorities are working to cultivate a culture of environmental responsibility among younger generations through education programmes.","Traditional farming communities in mountainous regions cultivate terraced fields that have sustained food production for thousands of years."],"col": ["cultivate land","cultivate relationships","cultivate skills","cultivate a culture","cultivate respect","cultivate crops","cultivate trust","cultivate talent"],"syn": [{"w": "develop","n": "最廣義，強調使某事物成長或進步"},{"w": "nurture","n": "強調細心照料和促進成長，比cultivate更溫柔"},{"w": "foster","n": "強調積極培養，常用於關係、態度或技能"}],"note": "cultivate既有農業義（耕種）也有比喻義（培養關係/文化）；cultivate a culture of...是IELTS學術寫作中描述社會或機構目標的高分表達。"},{"word": "biofuel","ipa": "/ˈbaɪəʊˌfjuːəl/","pos": "noun","zh": "生物燃料","part": "A","examples": ["Biofuels derived from agricultural waste offer a promising alternative to petroleum-based fuels, though their large-scale production raises concerns about land use.","Critics argue that the rush to produce biofuels has contributed to rising food prices by diverting agricultural land away from food production."],"col": ["biofuel production","biofuel crop","produce biofuels","biofuel industry","aviation biofuel","biofuel technology","sustainable biofuel","biofuel from waste"],"syn": [{"w": "renewable fuel","n": "更廣義，包含biofuel在內的所有可再生燃料"},{"w": "green fuel","n": "強調環保性，比biofuel更口語"},{"w": "biomass energy","n": "比biofuel更廣義，涵蓋固態、液態和氣態的生物能源"}],"note": "biofuel是IELTS能源類核心詞彙；food vs. fuel debate（糧食與燃料之爭）是最重要的爭議點，涉及agricultural land use和food security。"},{"word": "carbon footprint","ipa": "/ˌkɑːbən ˈfʊtprɪnt/","pos": "noun","zh": "碳足跡","part": "A","examples": ["Airlines are under growing pressure to reduce their carbon footprint as air travel accounts for a significant proportion of global emissions.","Consumers are increasingly calculating their personal carbon footprint and making lifestyle changes to reduce their environmental impact."],"col": ["reduce carbon footprint","carbon footprint calculator","measure carbon footprint","minimise carbon footprint","large carbon footprint","carbon footprint offset","company's carbon footprint","carbon footprint of product"],"syn": [{"w": "environmental impact","n": "最廣義，包含碳排放在內的所有對環境的影響"},{"w": "carbon emissions","n": "特指排放的二氧化碳量，是carbon footprint的核心組成"},{"w": "ecological footprint","n": "比carbon footprint更廣義，涵蓋所有資源消耗和廢棄物"}],"note": "carbon footprint是IELTS環境類最核心的詞彙之一；個人、企業和國家的carbon footprint reduction是近年Task 2最高頻的議題。"},{"word": "consumption","ipa": "/kənˈsʌmpʃən/","pos": "noun","zh": "消耗；消費","part": "A","examples": ["The global consumption of fossil fuels must be drastically reduced if the international community is to meet its climate commitments.","Rising consumption in emerging economies has driven significant growth in demand for raw materials and manufactured goods."],"col": ["energy consumption","fuel consumption","domestic consumption","consumption pattern","reduce consumption","mass consumption","consumption of resources","per capita consumption"],"syn": [{"w": "use","n": "最廣義且口語，泛指任何使用行為"},{"w": "utilisation","n": "更正式，強調有效使用和利用"},{"w": "demand","n": "偏經濟學用語，強調市場需求面向，比consumption更廣義"}],"note": "consumption是IELTS最高頻名詞之一，幾乎在所有主題都會出現；per capita consumption（人均消費）是比較不同國家消費水平的標準學術指標。"},{"word": "emissions","ipa": "/ɪˈmɪʃənz/","pos": "noun","zh": "排放","part": "A","examples": ["Nations that signed the Paris Agreement committed to taking measurable steps to reduce their greenhouse gas emissions.","Vehicle emissions in major cities have been linked directly to elevated rates of asthma and other respiratory conditions."],"col": ["carbon emissions","greenhouse gas emissions","reduce emissions","emissions target","emissions standard","cut emissions","emissions trading","zero emissions"],"syn": [{"w": "pollution","n": "最廣義，指所有有害物質的排放，比emissions更廣義"},{"w": "exhaust","n": "特指車輛或機器產生的廢氣，是emissions的一種形式"},{"w": "discharge","n": "強調從容器或系統中排出，偏工業或醫療語境"}],"note": "emissions是IELTS環境類必考詞彙；emissions trading（排放交易）和carbon credits（碳積分）是高分討論氣候政策的重要概念。"},{"word": "fumes","ipa": "/fjuːmz/","pos": "noun","zh": "煙霧；廢氣","part": "A","examples": ["Workers in poorly ventilated factories are regularly exposed to toxic fumes that pose serious long-term health risks.","Residents living near the motorway complained of persistent exposure to diesel fumes from heavy goods vehicles."],"col": ["toxic fumes","exhaust fumes","petrol fumes","chemical fumes","inhale fumes","vehicle fumes","noxious fumes","exposure to fumes"],"syn": [{"w": "exhaust gases","n": "特指車輛或機器的排放廢氣"},{"w": "vapour","n": "較中性，強調氣化的蒸氣狀態，不一定有毒"},{"w": "pollutants","n": "最廣義，泛指所有污染物，比fumes更學術"}],"note": "fumes通常含有有毒或令人不快的意涵，比vapour更具有危害性；IELTS工業污染和城市空氣質量類文章中，exposure to fumes是描述職業健康風險的標準搭配。"},{"word": "greenhouse gas","ipa": "/ˌɡriːnhaʊs ˈɡæs/","pos": "noun","zh": "溫室氣體","part": "A","examples": ["The primary greenhouse gases responsible for anthropogenic climate change include carbon dioxide, methane, and nitrous oxide.","Reducing greenhouse gas emissions requires a comprehensive approach that addresses energy production, transport, agriculture, and industrial processes simultaneously."],"col": ["greenhouse gas emissions","reduce greenhouse gases","greenhouse gas concentration","greenhouse gas effect","major greenhouse gas","greenhouse gas target","curb greenhouse gases","greenhouse gas levels"],"syn": [{"w": "carbon dioxide","n": "最主要的人為溫室氣體，常作為greenhouse gas的代表"},{"w": "climate pollutant","n": "強調對氣候的污染性，比greenhouse gas更帶有批評意涵"},{"w": "atmospheric pollutant","n": "最廣義，泛指所有在大氣中累積的有害物質"}],"note": "greenhouse gas是IELTS環境類核心詞彙；greenhouse effect的機制（trapping heat）是常見考點；熟悉主要溫室氣體（CO₂、CH₄、N₂O）的來源對高分有助。"},{"word": "mining","ipa": "/ˈmaɪnɪŋ/","pos": "noun","zh": "採礦","part": "A","examples": ["Deep-sea mining poses significant risks to marine ecosystems that are only beginning to be understood by scientists.","The historical legacy of coal mining communities in Northern England has shaped the cultural and political identity of entire regions."],"col": ["coal mining","gold mining","deep-sea mining","mining industry","data mining","mining operation","mining waste","sustainable mining"],"syn": [{"w": "extraction","n": "最廣義，強調從地下提取資源的行為，比mining更學術"},{"w": "quarrying","n": "特指從地表採取石材的露天作業，是mining的一種"},{"w": "drilling","n": "特指為提取石油或天然氣的鑽探行為"}],"note": "mining在IELTS中有多種語境：資源開採（coal/gold mining）與科技應用（data mining）；deep-sea mining對生態的影響是近年新興考點。"},{"word": "precious metal","ipa": "/ˌpreʃəs ˈmetəl/","pos": "noun","zh": "貴金屬","part": "A","examples": ["Electronic devices contain a range of precious metals, including gold and platinum, that can be recovered through responsible recycling.","The global demand for precious metals used in battery technology is driving a new wave of mining activity in developing countries."],"col": ["precious metal recycling","gold as precious metal","precious metal market","extract precious metals","precious metal reserves","precious metal trade","precious metal price","precious metal mining"],"syn": [{"w": "rare earth","n": "特指稀土元素，比precious metal更技術性，強調科技用途"},{"w": "noble metal","n": "最學術，強調化學惰性的金屬，如金、銀、鉑"},{"w": "bullion","n": "特指金條或銀條，是precious metal作為投資形式的具體表現"}],"note": "precious metals在IELTS科技和環境類文章中日益重要；e-waste回收precious metals是綠色科技的重要議題，也是Task 2環保主題的好素材。"},{"word": "scale","ipa": "/skeɪl/","pos": "noun","zh": "規模；比例","part": "A","examples": ["The scale of deforestation in the Amazon basin has reached levels that pose a serious threat to global climate stability.","Governments are beginning to realise that adapting to climate change will require action on a scale not previously contemplated."],"col": ["global scale","large scale","scale of problem","on a massive scale","economic scale","scale of change","at scale","scale of impact"],"syn": [{"w": "extent","n": "強調範圍和程度，比scale更廣義"},{"w": "magnitude","n": "強調規模和重要性，比scale更正式學術"},{"w": "scope","n": "強調涵蓋的範圍和廣度，比scale更強調邊界"}],"note": "on a grand/global scale是IELTS量化影響的高分表達；scale of the problem是學術論述標準框架；scale也是動詞，如scale up production（擴大生產規模）。"},{"word": "wind farm","ipa": "/ˈwɪnd fɑːm/","pos": "noun","zh": "風力發電場","part": "A","examples": ["Offshore wind farms can generate electricity without consuming land and typically experience stronger, more consistent winds than onshore installations.","Critics of wind farms argue that they are aesthetically intrusive and can negatively impact the value of surrounding properties."],"col": ["offshore wind farm","onshore wind farm","build a wind farm","wind farm capacity","wind farm development","wind turbine farm","expand wind farms","wind farm opposition"],"syn": [{"w": "wind park","n": "另一種表達，在歐洲語境中更常見"},{"w": "wind energy installation","n": "更正式的技術說法"},{"w": "turbine array","n": "最技術性，強調多個渦輪機的排列組合"}],"note": "wind farm是IELTS可再生能源類核心詞彙；offshore vs. onshore wind farm的優缺點比較是常見的Task 2論點框架。"},{"word": "carbon neutral","ipa": "/ˌkɑːbən ˈnjuːtrəl/","pos": "adj","zh": "碳中和的","part": "B","examples": ["Several major airlines have committed to achieving carbon neutral operations by 2050 through a combination of efficiency improvements and carbon offsetting.","The university became carbon neutral by installing solar panels, improving building insulation, and offsetting its remaining emissions through reforestation projects."],"col": ["carbon neutral goal","become carbon neutral","carbon neutral commitment","carbon neutral operation","achieve carbon neutral","carbon neutral target","carbon neutral by 2050","certified carbon neutral"],"syn": [{"w": "net-zero","n": "最廣義，指排放量與吸收量相等，比carbon neutral更廣泛使用"},{"w": "climate-neutral","n": "比carbon neutral更廣義，考慮所有氣候影響因素"},{"w": "zero-emission","n": "更嚴格，指完全不產生排放，比carbon neutral更高的標準"}],"note": "carbon neutral是IELTS氣候政策類核心詞彙；carbon neutral vs. net-zero的細微差異是常見考點：前者僅考慮碳，後者涵蓋所有溫室氣體。"},{"word": "eco-friendly","ipa": "/ˌiːkəʊ ˈfrendli/","pos": "adj","zh": "環保的","part": "B","examples": ["Consumer demand for eco-friendly packaging has prompted many companies to redesign their products to minimise plastic waste.","Eco-friendly tourism initiatives are designed to generate economic benefits for local communities while minimising damage to natural environments."],"col": ["eco-friendly product","eco-friendly packaging","eco-friendly tourism","eco-friendly alternative","eco-friendly design","eco-friendly material","genuinely eco-friendly","eco-friendly solution"],"syn": [{"w": "sustainable","n": "強調長期可持續性，比eco-friendly更嚴謹的學術表達"},{"w": "environmentally friendly","n": "最完整的正式表達，比eco-friendly更書面"},{"w": "green","n": "最廣義且口語，泛指任何對環境友善的事物"}],"note": "eco-friendly是口語化表達；IELTS正式寫作中建議用environmentally friendly或sustainable；greenwashing（漂綠）是批評假借eco-friendly名義的重要相關概念。"},{"word": "rechargeable","ipa": "/ˌriːˈtʃɑːdʒəbəl/","pos": "adj","zh": "可充電的","part": "B","examples": ["The widespread adoption of rechargeable electric vehicles requires a substantial expansion of charging infrastructure, particularly in rural areas.","Rechargeable batteries have transformed portable consumer electronics by eliminating the need for frequent disposable battery replacement."],"col": ["rechargeable battery","rechargeable device","fully rechargeable","rechargeable vehicle","rechargeable power source","rechargeable technology","rechargeable energy storage","rechargeable cell"],"syn": [{"w": "reusable","n": "最廣義，強調可重複使用，不限於電力儲存"},{"w": "refillable","n": "特指可重新充填的容器，比rechargeable更廣義"},{"w": "renewable","n": "偏能源語境，強調可重新獲得的特性，比rechargeable更廣義"}],"note": "rechargeable batteries是IELTS科技和能源轉型類核心詞彙；lithium-ion rechargeable batteries的性能和原料供應是近年重要考點。"},{"word": "recyclable","ipa": "/ˌriːˈsaɪkləbəl/","pos": "adj","zh": "可回收的","part": "B","examples": ["Retailers are under increasing regulatory pressure to replace non-recyclable plastic packaging with biodegradable or recyclable alternatives.","The proportion of municipal waste that is recyclable has grown significantly in most developed countries over the past two decades."],"col": ["recyclable material","recyclable packaging","fully recyclable","recyclable plastic","recyclable container","recyclable waste","recyclable product","easily recyclable"],"syn": [{"w": "reusable","n": "強調可重複使用，比recyclable更廣義，不需再加工"},{"w": "biodegradable","n": "強調可自然分解，是不同於recyclable的環保方案"},{"w": "sustainable","n": "最廣義，包含recyclable在內的整體可持續性評估"}],"note": "recyclable vs. biodegradable是IELTS環保材料類的重要對比；可回收不等於一定被回收（recyclability vs. actual recycling率），是Task 2批判論述的好切入點。"},{"word": "renewable","ipa": "/rɪˈnjuːəbəl/","pos": "adj","zh": "可再生的","part": "B","examples": ["The transition from fossil fuels to renewable energy sources is one of the most urgent technological and policy challenges of the twenty-first century.","Renewable energy, including solar and wind power, now accounts for a growing proportion of electricity generation in many countries."],"col": ["renewable energy","renewable resource","renewable fuel","renewable electricity","renewable technology","renewable power","transition to renewable","renewable capacity"],"syn": [{"w": "sustainable","n": "比renewable更廣義，強調整體長期可持續的發展模式"},{"w": "clean energy","n": "強調無污染的特性，比renewable更口語"},{"w": "green energy","n": "最口語，泛指對環境友善的能源，與renewable幾乎同義"}],"note": "renewable energy是IELTS最核心詞彙之一，幾乎每次環境或科技主題都出現；renewable vs. non-renewable的對比是Task 2能源政策論述的基礎框架。"},{"word": "precious","ipa": "/ˈpreʃəs/","pos": "adj","zh": "珍貴的","part": "B","examples": ["Clean freshwater is one of the world's most precious and increasingly scarce natural resources.","Every hour spent learning a new language during childhood is precious and contributes to lifelong cognitive benefits."],"col": ["precious resource","precious time","precious metal","precious stone","precious commodity","increasingly precious","precious ecosystem","precious opportunity"],"syn": [{"w": "valuable","n": "最廣義，強調有價值，比precious更中性"},{"w": "rare","n": "強調稀有性，是使某物precious的常見原因"},{"w": "irreplaceable","n": "強調無法取代，比precious更強調獨特性"}],"note": "precious在IELTS中常修飾resource（資源）、habitat（棲息地）或time（時間）；precious vs. valuable：前者通常還帶有情感或稀有的意涵。"},{"word": "sustainable","ipa": "/səˈsteɪnəbəl/","pos": "adj","zh": "永續的","part": "B","examples": ["A sustainable approach to economic development must balance the needs of the present generation without compromising the ability of future generations to meet their own.","Sustainable agriculture practices aim to produce food without degrading the soil, water, and biodiversity on which future production depends."],"col": ["sustainable development","sustainable agriculture","sustainable energy","sustainable growth","environmentally sustainable","sustainable future","sustainable practice","sustainable tourism"],"syn": [{"w": "viable","n": "強調在實際條件下可行，比sustainable更強調可操作性"},{"w": "long-term","n": "強調時間上的持久性，比sustainable更廣義"},{"w": "ecological","n": "強調符合生態原則，比sustainable更偏生物科學語境"}],"note": "sustainable是IELTS最重要的詞彙之一，幾乎在所有主題都必須使用；sustainable development goals（SDGs）是IELTS高分論述的重要引用框架。"},{"word": "unleaded","ipa": "/ʌnˈledɪd/","pos": "adj","zh": "無鉛的","part": "B","examples": ["The global phase-out of leaded petrol in the late twentieth century led to measurable improvements in children's cognitive development.","Unleaded fuel became mandatory in most developed countries in the 1990s after research conclusively demonstrated the serious health hazards of leaded alternatives."],"col": ["unleaded petrol","unleaded fuel","unleaded gasoline","switch to unleaded","unleaded standard","lead-free unleaded","mandatory unleaded","unleaded requirement"],"syn": [{"w": "lead-free","n": "強調不含鉛的特性，與unleaded完全同義"},{"w": "clean fuel","n": "較廣義，強調對環境和健康的低危害性"},{"w": "low-emission fuel","n": "偏技術性，強調排放量低"}],"note": "unleaded petrol（無鉛汽油）是IELTS歷史類和公共衛生類文章的潛在詞彙；其全球推廣是20世紀最成功的環境和公衛政策之一，可作為Task 2論述政府干預有效性的實際例子。"},{"word": "capture","ipa": "/ˈkæptʃə/","pos": "verb","zh": "捕捉；捕獲","part": "C","examples": ["Carbon capture technology aims to remove carbon dioxide from industrial emissions before it enters the atmosphere.","The new documentary series attempts to capture the extraordinary diversity of life in the world's deep ocean environments."],"col": ["capture carbon","capture data","capture attention","capture image","capture market share","carbon capture","capture energy","capture the moment"],"syn": [{"w": "trap","n": "強調困住，比capture更強調阻止逃脫"},{"w": "absorb","n": "偏化學語境，強調吸入並含納，比capture更廣義"},{"w": "seize","n": "強調快速有力地抓取，比capture更強調速度和力量"}],"note": "capture在IELTS中最重要的搭配是carbon capture（碳捕獲），指從排放氣體中提取CO₂的技術；capture market share是商業類文章的常見表達。"},{"word": "conserve","ipa": "/kənˈsɜːv/","pos": "verb","zh": "節約；保護","part": "C","examples": ["National parks were established to conserve biodiversity and protect ecosystems from the pressures of commercial exploitation.","Households can conserve significant amounts of water through relatively simple behavioural changes and the installation of efficient appliances."],"col": ["conserve energy","conserve water","conserve resources","conserve wildlife","conserve biodiversity","conserve habitat","conserve natural areas","conserve soil"],"syn": [{"w": "protect","n": "最廣義，強調防止傷害，比conserve更強調防禦"},{"w": "preserve","n": "強調維持現有狀態，與conserve幾乎同義但更強調原貌保存"},{"w": "sustain","n": "強調長期維持，比conserve更強調持續供給的概念"}],"note": "conserve vs. preserve：前者強調明智使用資源，後者強調原貌保存；IELTS中conserve energy/resources是Task 2論述個人和政府責任的核心表達。"},{"word": "curb","ipa": "/kɜːb/","pos": "verb","zh": "抑制","part": "C","examples": ["Governments around the world are under pressure to introduce policies that will curb greenhouse gas emissions from the industrial sector.","Urban planners argue that pricing mechanisms are the most effective way to curb excessive private car use in densely populated cities."],"col": ["curb emissions","curb spending","curb pollution","curb crime","curb inflation","curb growth","effectively curb","curb consumption"],"syn": [{"w": "restrict","n": "強調限制範圍或數量，比curb更廣義"},{"w": "limit","n": "最廣義，強調設定上限，比curb更中性"},{"w": "reduce","n": "強調使數量降低，比curb更溫和，不含強制的意涵"}],"note": "curb是IELTS環境和政策類高頻動詞；curb emissions和curb spending是最重要的搭配，可替換restrict或limit以提升詞彙分數。"},{"word": "emit","ipa": "/ɪˈmɪt/","pos": "verb","zh": "排放；散發","part": "C","examples": ["Coal-fired power plants emit far more carbon dioxide per kilowatt-hour of electricity generated than any other energy source.","Some deep-sea creatures emit bioluminescent light to attract prey in the complete darkness of the ocean floor."],"col": ["emit carbon dioxide","emit greenhouse gases","emit light","emit sound","emit radiation","emit fumes","emit pollution","emit heat"],"syn": [{"w": "release","n": "最廣義，強調向外部環境排出，比emit更廣義"},{"w": "discharge","n": "強調從特定來源排出，比emit更強調特定渠道"},{"w": "produce","n": "強調生成或製造，比emit更廣義，不一定指向外排出"}],"note": "emit是IELTS環境類最重要的動詞之一；emit carbon dioxide/greenhouse gases是必掌握搭配；名詞emissions在閱讀和寫作中幾乎必出。"},{"word": "exhaust","ipa": "/ɪɡˈzɔːst/","pos": "verb","zh": "耗盡；廢氣","part": "C","examples": ["At the current rate of consumption, many known reserves of key minerals will be exhausted within a few decades.","Managing multiple priorities simultaneously can exhaust even the most capable and energetic professionals."],"col": ["exhaust resources","exhaust reserves","exhaust options","exhaust supply","completely exhaust","exhaust possibilities","exhaust patience","exhaust someone"],"syn": [{"w": "deplete","n": "強調逐漸耗盡，比exhaust更強調緩慢的消耗過程"},{"w": "drain","n": "強調抽乾或耗盡，可指資源或精力"},{"w": "use up","n": "最口語，泛指用完任何東西"}],"note": "exhaust既作動詞（耗盡）也作名詞（exhaust fumes，廢氣）；exhaustion of natural resources和resource depletion是IELTS環境類的核心議題。"},{"word": "harness","ipa": "/ˈhɑːnɪs/","pos": "verb","zh": "利用（能量、資源）","part": "C","examples": ["Countries with abundant coastlines and wind corridors are ideally positioned to harness renewable energy from both offshore and onshore sources.","The challenge for modern corporations is to harness the creativity and expertise of a diverse, globally distributed workforce."],"col": ["harness energy","harness technology","harness solar power","harness wind","harness potential","harness innovation","harness data","effectively harness"],"syn": [{"w": "utilise","n": "最廣義，強調使用，比harness少了駕馭自然力的意涵"},{"w": "exploit","n": "可指充分利用（中性）或剝削（貶義），比harness更複雜"},{"w": "leverage","n": "強調借助現有資源或優勢達到更大效果，偏商業語境"}],"note": "harness是IELTS能源類高分動詞，特指利用自然力量（harness solar/wind energy）；harness technology在商業和教育類文章中也頻繁出現，是比use更生動的替換詞。"}]

const PART_LABELS = {
  A:'Part A · Nouns', B:'Part B · Adjectives',
  C:'Part C · Verbs',  D:'Part D · Phrases'
};
const SK = 'ielts_u7';
let cur=0, mode='browse', flipped=false, known=[], onIntro=true;
function load(){ try{ known=JSON.parse(localStorage.getItem(SK)||'[]'); }catch(e){known=[];} }
function save(){ try{ localStorage.setItem(SK,JSON.stringify(known)); }catch(e){} }
function isKnown(i){ return known.includes(i); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function updateDots(){
  const n=UNIT.words.length, max=Math.min(n,30);
  let h='';
  for(let i=0;i<max;i++){
    const c=(!onIntro&&i===cur)?'dot cur':isKnown(i)?'dot known':'dot';
    h+='<div class="'+c+'"></div>';
  }
  if(n>max) h+='<span style="font-family:var(--fm);font-size:.5rem;color:var(--g400);margin-left:2px;">+'+(n-max)+'</span>';
  document.getElementById('dots').innerHTML=h;
}
function renderIntro(){
  document.getElementById('counter').textContent='Introduction';
  document.getElementById('known-badge').textContent='';
  document.getElementById('prog-fill').style.width='0%';
  document.getElementById('action-count').textContent='';
  document.getElementById('know-btn').style.display='none';
  document.getElementById('review-btn').style.display='none';
  const f=document.getElementById('front-face');
  f.className='face front intro-face';
  f.innerHTML=
    '<div class="ic-eyebrow">IELTS Core Thematic Vocabulary · Chapter 7 of 10</div>'+
    '<div class="ic-title">Environment, Weather & Energy</div>'+
    '<div class="ic-zh">環境保育、氣象與能源</div>'+
    '<div class="ic-rule"></div>'+
    '<div class="ic-body">'+
      '<div>'+
        '<div class="ic-sec-label">關於本章</div>'+
        '<div class="ic-about">本章收錄 55 個核心詞彙。每個詞條包含搭配詞與中文解釋。</div>'+
      '</div>'+
      '<div>'+
        '<div class="ic-sec-label">使用方式</div>'+
        '<div class="ic-steps">'+
          '<div class="ic-step"><span class="ic-tag">Browse</span>正面顯示英文單字，翻面查看中文與搭配詞。</div>'+
          '<div class="ic-step"><span class="ic-tag">Quiz</span>正面顯示中文，翻面前先回想英文，訓練主動回憶。</div>'+
          '<div class="ic-step"><span class="ic-tag">Know it ✓</span>標記已掌握。<span class="ic-tag">Review ↺</span>重新複習。</div>'+
          '<div class="ic-step"><span class="ic-tag">快捷鍵</span>← → 切換卡片 &nbsp;·&nbsp; F 翻轉 &nbsp;·&nbsp; K 標記</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="ic-hint">按 Next → 開始學習</div>';
  document.getElementById('back-face').innerHTML='';
  updateDots();
}
function render(){
  if(onIntro){ renderIntro(); return; }
  document.getElementById('front-face').className='face front';
  document.getElementById('know-btn').style.display='';
  document.getElementById('review-btn').style.display='';
  const w=UNIT.words[cur], n=UNIT.words.length, k=isKnown(cur);
  document.getElementById('counter').textContent=(cur+1)+' / '+n;
  document.getElementById('known-badge').textContent=known.length+' / '+n+' known';
  document.getElementById('prog-fill').style.width=((cur+1)/n*100)+'%';
  document.getElementById('action-count').textContent=known.length+'/'+n;
  const isQuiz=(mode==='quiz');
  document.getElementById('front-face').innerHTML=
    '<div class="f-top">'+
      '<div class="f-meta">'+
        '<div class="f-num">#'+String(cur+1).padStart(3,'0')+'</div>'+
        '<div class="f-part">'+(PART_LABELS[w.part]||'')+'</div>'+
      '</div>'+
      '<span class="f-known-mark'+(k?' vis':'')+'">✓ known</span>'+
    '</div>'+
    '<div class="f-body">'+
      '<div class="f-word">'+esc(isQuiz?w.zh:w.word)+'</div>'+
      (!isQuiz&&w.ipa?'<div class="f-ipa">'+esc(w.ipa)+'</div>':'')+
      (!isQuiz?'<div class="f-pos">'+esc(w.pos)+'</div>':'')+
    '</div>'+
    '<div class="f-hint">'+(isQuiz?'think → click to flip':'click to flip →')+'</div>';
  const exH=(w.examples||[]).map(e=>'<div class="b-ex">"'+esc(e)+'"</div>').join('');
  const colH=(w.col||[]).map(c=>'<div class="b-col">'+esc(c)+'</div>').join('');
  const synH=(w.syn||[]).map(s=>
    '<div class="b-syn-row"><div class="b-syn-w">'+esc(s.w)+'</div>'+
    '<div class="b-syn-n">（'+esc(s.n)+'）</div></div>'
  ).join('');
  const noteH=w.note?'<div class="b-sec"><div class="b-label">注意</div><div class="b-note">'+esc(w.note)+'</div></div>':'';
  let zhLine, metaLine='';
  if(isQuiz){
    zhLine='<div class="b-quiz-word">'+esc(w.word)+'</div>';
    metaLine='<div class="b-quiz-meta">'+esc(w.pos)+(w.ipa?' &nbsp;'+esc(w.ipa):'')+'</div>';
  } else {
    zhLine='<div class="b-zh">'+esc(w.zh)+'</div>';
  }
  document.getElementById('back-face').innerHTML=
    zhLine+metaLine+
    '<div class="b-rule"></div>'+
    '<div class="b-content">'+
      (exH?'<div class="b-sec"><div class="b-label">Examples</div>'+exH+'</div>':'')+
      (colH?'<div class="b-sec"><div class="b-label">搭配</div><div class="b-cols">'+colH+'</div></div>':'')+
      (synH?'<div class="b-sec"><div class="b-label">近義</div><div class="b-syns">'+synH+'</div></div>':'')+
      noteH+
    '</div>';
  updateDots();
}
function flip(){ if(onIntro) return; flipped=!flipped; document.getElementById('card').classList.toggle('flipped',flipped); }
function go(dir){
  if(onIntro&&dir>0){ onIntro=false;cur=0;flipped=false;document.getElementById('card').classList.remove('flipped');render();return; }
  if(!onIntro&&dir<0&&cur===0){ onIntro=true;flipped=false;document.getElementById('card').classList.remove('flipped');render();return; }
  if(onIntro) return;
  cur=Math.max(0,Math.min(UNIT.words.length-1,cur+dir));
  flipped=false;document.getElementById('card').classList.remove('flipped');render();
}
function markKnown(){ if(onIntro) return; if(!isKnown(cur)) known.push(cur); save();render(); setTimeout(function(){ if(cur<UNIT.words.length-1) go(1); },180); }
function markReview(){ if(onIntro) return; known=known.filter(function(x){return x!==cur;}); save();render(); }
function setMode(m){ mode=m;flipped=false;document.getElementById('card').classList.remove('flipped');document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.toggle('active',b.dataset.mode===m);});render(); }
let suppressClick=false;
(function(){
  const sc=document.getElementById('scene');
  sc.addEventListener('click',function(){
    if(suppressClick){suppressClick=false;return;}
    flip();
  });
  let x0=null,y0=null;
  sc.addEventListener('touchstart',function(e){
    const t=e.changedTouches[0];x0=t.clientX;y0=t.clientY;
  },{passive:true});
  sc.addEventListener('touchend',function(e){
    if(x0===null)return;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4){
      suppressClick=true;
      go(dx<0?1:-1);
      setTimeout(function(){suppressClick=false;},400);
    }
    x0=null;
  },{passive:true});
})();
document.getElementById('prev-btn').addEventListener('click',function(e){e.stopPropagation();go(-1);});
document.getElementById('next-btn').addEventListener('click',function(e){e.stopPropagation();go(1);});
document.getElementById('know-btn').addEventListener('click',function(e){e.stopPropagation();markKnown();});
document.getElementById('review-btn').addEventListener('click',function(e){e.stopPropagation();markReview();});
document.querySelectorAll('.mode-btn').forEach(function(b){ b.addEventListener('click',function(e){e.stopPropagation();setMode(b.dataset.mode);});});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='f'||e.key==='F') flip();
  else if(e.key==='k'||e.key==='K') markKnown();
});
load();render();
</script>
