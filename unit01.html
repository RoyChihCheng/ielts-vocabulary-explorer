#counter{font-family:var(--fm);font-size:.82rem;color:#fff;letter-spacing:.02em;}
#known-badge{font-family:var(--fm);font-size:.62rem;color:var(--gold2);opacity:.75;min-height:.85em;}
.hdr-nav{margin-left:auto;display:flex;align-items:center;gap:10px;}

.mode-btn{background:transparent;border:none;color:rgba(142,95,176,.6);font-family:var(--fm);

.mode-btn.active{background:var(--gold);color:#fff;}
#home-link{color:rgba(201,168,224,.5);font-size:1.15rem;text-decoration:none;

/* ── PROGRESS ── */
#prog-track{height:2px;background:rgba(142,95,176,.15);flex-shrink:0;}
#prog-fill{height:100%;background:var(--gold);transition:width .3s ease;width:0%;}

/* ── STAGE ── */
#stage{flex:1;display:flex;align-items:center;justify-content:center;
  padding:14px 16px;overflow:hidden;}
.scene{width:min(660px,100%);height:min(460px,calc(100vh - 130px));
  perspective:1400px;cursor:pointer;user-select:none;}
.card{width:100%;height:100%;position:relative;
  transform-style:preserve-3d;transition:transform .52s cubic-bezier(.4,0,.2,1);}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r);display:flex;flex-direction:column;padding:28px 36px;}

/* FRONT face */
.front{background:var(--paper);border:1px solid var(--g200);box-shadow:var(--shadow);}
.f-top{display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;}
.f-meta{display:flex;flex-direction:column;gap:2px;}
.f-num{font-family:var(--fm);font-size:.66rem;color:var(--gold);letter-spacing:.1em;}
.f-part{font-family:var(--fm);font-size:.58rem;color:var(--g400);letter-spacing:.05em;}
.f-known-mark{font-family:var(--fm);font-size:.62rem;color:var(--known);
  opacity:0;transition:opacity .2s;}
.f-known-mark.vis{opacity:1;}
.f-body{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;text-align:center;padding:4px 0;}
.f-word{font-family:var(--fd);font-size:clamp(2rem,6vw,3.4rem);
  color:var(--navy);font-weight:700;line-height:1.05;letter-spacing:-.01em;}
.f-ipa{font-family:var(--fm);font-size:.76rem;color:var(--g400);letter-spacing:.02em;}
.f-pos{font-family:var(--fb);font-size:.88rem;color:var(--g400);font-style:italic;}
.f-hint{font-family:var(--fm);font-size:.6rem;color:var(--g200);
  letter-spacing:.06em;flex-shrink:0;text-align:right;}

/* BACK face */
.back{background:var(--navy);transform:rotateY(180deg);overflow:hidden;}
.b-zh{font-family:var(--fd);font-size:clamp(1.5rem,4.2vw,2.3rem);
  color:var(--gold2);font-weight:700;line-height:1.2;flex-shrink:0;margin-bottom:10px;}
.b-quiz-word{font-family:var(--fd);font-size:clamp(1.6rem,4.5vw,2.5rem);
  color:var(--gold2);font-weight:700;line-height:1.1;flex-shrink:0;}
.b-quiz-meta{font-family:var(--fb);font-size:.82rem;color:rgba(201,168,224,.65);
  font-style:italic;flex-shrink:0;margin-bottom:10px;}
.b-rule{height:1px;background:rgba(255,255,255,.1);flex-shrink:0;margin-bottom:10px;}
.b-content{flex:1;overflow-y:auto;display:flex;flex-direction:column;
  gap:11px;scrollbar-width:none;-ms-overflow-style:none;}
.b-content::-webkit-scrollbar{display:none;}
.b-sec{display:flex;flex-direction:column;gap:5px;}
.b-label{font-family:var(--fm);font-size:.57rem;
  color:rgba(142,95,176,.75);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px;}

/* Examples */
.b-ex{font-family:var(--fb);font-size:.77rem;color:#ccc;font-style:italic;
  line-height:1.6;padding-left:10px;border-left:2px solid rgba(142,95,176,.3);}

/* Collocations */
.b-col{font-family:var(--fm);font-size:.67rem;color:#e8dff2;line-height:1.35;
  padding-left:10px;border-left:2px solid var(--gold);padding-top:1px;padding-bottom:1px;}
.b-cols{display:flex;flex-direction:column;gap:4px;}

/* Synonyms */
.b-syns{display:flex;flex-direction:column;gap:5px;}
.b-syn-row{display:flex;flex-direction:column;gap:1px;}
.b-syn-w{font-family:var(--fm);font-size:.7rem;color:var(--gold2);}
.b-syn-n{font-family:var(--fb);font-size:.71rem;color:#999;line-height:1.45;
  padding-left:6px;}

/* Note */
.b-note{font-family:var(--fb);font-size:.74rem;color:#cdb0e2;font-style:italic;
  line-height:1.6;padding:8px 10px;
  border:1px solid rgba(142,95,176,.2);border-radius:2px;
  background:rgba(142,95,176,.07);}

/* ── INTRO CARD ── */
.intro-face{cursor:default;}
.ic-eyebrow{font-family:var(--fm);font-size:.62rem;color:var(--gold);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;flex-shrink:0;}
.ic-title{font-family:var(--fd);font-size:clamp(1.3rem,3.2vw,1.9rem);

.ic-zh{font-family:var(--fb);font-size:.85rem;color:var(--g400);

.ic-rule{height:1px;background:var(--g200);margin:14px 0;flex-shrink:0;}
.ic-body{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:12px;}
.ic-sec-label{font-family:var(--fm);font-size:.57rem;color:var(--gold);

.ic-about{font-family:var(--fb);font-size:.81rem;color:var(--navy);line-height:1.65;}
.ic-steps{display:flex;flex-direction:column;gap:6px;}
.ic-step{font-family:var(--fb);font-size:.79rem;color:var(--navy);
  line-height:1.5;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.ic-tag{font-family:var(--fm);font-size:.62rem;background:var(--g100);
  border:1px solid var(--g200);color:var(--navy);padding:1px 7px;
  border-radius:var(--r);white-space:nowrap;flex-shrink:0;}
.ic-hint{font-family:var(--fm);font-size:.6rem;color:var(--g200);

/* ── NAV BAR ── */
#nav-bar{height:52px;background:var(--g100);border-top:1px solid var(--g200);

  padding:0 14px;flex-shrink:0;}
.nav-btn{background:transparent;border:1px solid var(--g200);color:var(--navy);
  font-family:var(--fb);font-size:.82rem;padding:6px 14px;cursor:pointer;

.nav-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.action-center{display:flex;align-items:center;gap:6px;}
#action-count{font-family:var(--fm);font-size:.65rem;color:#aaa;white-space:nowrap;}
#know-btn{background:var(--known);border:none;color:#fff;font-family:var(--fb);

#review-btn{background:var(--gold);border:none;color:#fff;font-family:var(--fb);
  font-size:.78rem;padding:7px 13px;cursor:pointer;border-radius:var(--r);

#review-btn:hover{opacity:.8;}
.nav-right{display:flex;align-items:center;gap:8px;}
#dots{display:flex;gap:3px;align-items:center;max-width:200px;overflow:hidden;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--g200);
  flex-shrink:0;transition:background .2s;}
.dot.cur{background:var(--gold);}
.dot.known{background:var(--known);}

  .b-ex{font-size:.8rem;}
  .b-col{font-size:.72rem;}
  .ic-body{overflow-y:auto;}
  .f-hint,.ic-hint{display:none;}
  #nav-bar{height:58px;padding:0 8px;}

  .action-center{gap:8px;}
  .nav-btn{padding:12px 16px;font-size:.92rem;}
  #know-btn,#review-btn{padding:12px 15px;font-size:.86rem;}
}
/* ===== END MOBILE ===== */

avy burden"}, {"w": "coercion", "n": "強調具強制性的外部壓力，較正式"}], "note": "'Under pressure' 是最常見的描述壓力狀態的片語。Pressure 在雅思健康、教育、社會題目中極為高頻。"}, {"word": "segment", "ipa": "/ˈseɡmənt/", "pos": "noun", "zh": "部分；區塊", "part": "A", "examples": ["The luxury goods segment has remained resilient even during periods of broader economic downturn.", "Different segments of society have responded to this public health policy in markedly different ways."], "col": ["market segment", "segment of society", "consumer segment", "age segment", "demographic segment", "niche segment", "income segment"], "syn": [{"w": "sector", "n": "多指行業或社會中可識別的一個大領域"}, {"w": "portion", "n": "較泛指，強調整體的一部分"}, {"w": "section", "n": "強調可分割的組成部分"}, {"w": "category", "n": "強調分類系統中的一個類別"}], "note": "作動詞使用時意為「將…分成若干部分」（to segment the market）。商業與社會科學寫作中的高頻詞。"}, {"word": "standard", "ipa": "/ˈstændəd/", "pos": "noun / adjective", "zh": "標準", "part": "A", "examples": ["Living standards have improved considerably over the past three decades in many developing nations.", "Ethical standards in journalism are under increasing scrutiny in the digital age."], "col": ["living standard", "ethical standard", "high standard", "academic standard", "double standard", "industry standard", "standard of living", "set a standard"], "syn": [{"w": "benchmark", "n": "特指作為評比基準的參考點"}, {"w": "criterion / criteria", "n": "指判斷或評估的標準，學術寫作常用複數"}, {"w": "yardstick", "n": "比喻性的「衡量尺度」"}, {"w": "measure", "n": "廣義的評估基準"}], "note": "'Double standard'（雙重標準）是討論社會公平議題的關鍵詞。作形容詞用時意為「標準的；普通的」（standard practice）。"}, {"word": "status", "ipa": "/ˈsteɪtəs/", "pos": "noun", "zh": "地位；身分", "part": "A", "examples": ["Social status in many cultures is still closely tied to educational achievement and occupation.", "The company's status as a market leader has been challenged by a new generation of agile start-ups."], "col": ["social status", "status symbol", "legal status", "professional status", "high / low status", "marital status", "status quo", "celebrity status"], " , "clumsy remark", "clumsy apology", "clumsy handling", "feel clumsy"], "syn": [{"w": "awkward", "n": "更廣義的笨拙，涵蓋社交尷尬和身體不協調"}, {"w": "ungainly", "n": "強調外表的笨拙，較文雅"}, {"w": "bumbling", "n": "含迷糊、手忙腳亂的意味，語氣偏滑稽"}, {"w": "inept", "n": "強調能力不足，語氣較強（inept handling"}], "note": "Clumsy 可描述身體的不協調，也可形容社交或言語上的笨拙（a clumsy remark）。在IELTS中比喻用法顯示詞彙的靈活運用。"}, {"word": "cynical", "ipa": "/ˈsɪnɪkl/", "pos": "adjective", "zh": "憤世嫉俗的", "part": "B", "examples": ["Years of political scandals have left many citizens deeply cynical about the integrity of elected officials.", "A cynical view of philanthropy suggests donors are driven by tax benefits rather than genuine altruism."], "col": ["cynical view", "cynical about", "deeply cynical", "growing cynicism", "cynical attitude", "cynical interpretation", "healthy cynicism"], "syn": [{"w": "sceptical", "n": "對某事理性懷疑，不一定對人性悲觀"}, {"w": "disillusioned", "n": "強調失去幻想後的幻滅感"}, {"w": "pessimistic", "n": "對結果或未來持悲觀看法"}, {"w": "jaded", "n": "因過多負面經驗而失去熱情或信任"}], "note": "Sceptical 是理性懷疑（科學態度），cynical 是對人性動機的根本不信任——兩者常被混淆。名詞 cynicism 在社論和IELTS議論文中頻繁出現。"}, {"word": "desirable", "ipa": "/dɪˈzaɪərəbl/", "pos": "adjective", "zh": "值得擁有的；合意的", "part": "B", "examples": ["The ability to work autonomously is a highly desirable quality in today's remote working landscape.", "A central urban location remains the most desirable feature for property buyers in major cities."], "col": ["highly desirable", "desirable outcome", "desirable quality", "desirable effect", "socially desirable", "financially desirable", "most desirable"], "syn": [{"w": "sought-after", "n": "強調受到廣泛追捧，常用於職位或商品"}, {"w": "appealing", "n": "側重吸引力，讓人感到有興趣"}, {"w": "attractive", "n": "廣義吸引人的，可指外觀、概念或機會"}, {"w": "preferable", "n": "比較性的「相對更好的選擇」"}], "note": "'Socially desirable behaviour'（社會期望行為）是心理學術語，指符合社會規範的行為。"}, {"word": "eccentric", "ipa": "/ɪkˈsentrɪk/", "pos": "adjective", "zh": "古怪的；特立獨行的", "part": "B", "examples": ["The eccentric billionaire was notorious for funding highly unconventional idealised", "ipa": "/aɪˈdiːəlaɪzd/", "pos": "adjective", "zh": "理想化的", "part": "B", "examples": ["Social media presents an idealised version of daily life that bears little resemblance to most people's reality.", "Adolescents with an overly idealised view of celebrity culture may develop unrealistic expectations."], "col": ["idealised version", "idealised view", "idealised image", "idealised notion", "overly idealised", "idealised portrayal"], "syn": [{"w": "romanticised", "n": "強調用浪漫、美化的眼光描繪，抹去現實複雜性"}, {"w": "sanitised", "n": "強調去除不愉快的部分，呈現過於乾淨的樣貌"}, {"w": "glorified", "n": "被美化至近乎崇高的地位"}, {"w": "unrealistic", "n": "最直接的同義詞，但缺乏 idealised 的文學感"}], "note": "Idealised 強調主動的美化扭曲，與 realistic（寫實的）形成直接對比。常出現在媒體批評、心理學和社會學語境。"}, {"word": "inconsiderate", "ipa": "/ˌɪnkənˈsɪdərɪt/", "pos": "adjective", "zh": "不顧及他人的", "part": "B", "examples": ["It is deeply inconsiderate to play loud music in a shared living space late at night.", "An inconsiderate approach to customer complaints can rapidly damage a brand's reputation."], "col": ["inconsiderate person", "inconsiderate of others", "inconsiderate behaviour", "inconsiderate driver", "downright inconsiderate"], "syn": [{"w": "thoughtless", "n": "強調行動前沒有考慮他人，缺乏周全思慮"}, {"w": "selfish", "n": "強調只為自身利益著想，主動將自己置於他人之上"}, {"w": "insensitive", "n": "對他人感受缺乏敏感度，不一定出於惡意"}, {"w": "tactless", "n": "言行粗率，缺乏圓滑，常造成不必要的冒犯"}], "note": "Inconsiderate 側重對他人造成的影響；selfish 強調以自身利益優先的動機——描述重點有所不同。"}, {"word": "indecisive", "ipa": "/ˌɪndɪˈsaɪsɪv/", "pos": "adjective", "zh": "優柔寡斷的", "part": "B", "examples": ["An indecisive leader can severely undermine team morale and stall organisational progress.", "Being indecisive under pressure is a challenge commonly reported by newly promoted managers."], "col": ["feel indecisive", "indecisive leader", "indecisive voter", "frustratingly indecisive", "chronically indecisive"], "syn": [{"w": "hesitant", "n": "指在特定時刻的猶豫，不一定是長期性格特質"}, {"w": "irresolute", "n": "較書面語，強調意志力薄弱，缺乏堅定立場"}, {"w": "vacillating", "n": "不斷在選項間 centred worldview"], "syn": [{"w": "selfish", "n": "更口語，語氣較強，常含道德批評"}, {"w": "egocentric", "n": "從認知角度描述，強調無法超越自身視角"}, {"w": "self-interested", "n": "較中性，指將自身利益置於首位"}, {"w": "inconsiderate", "n": "強調對他人感受的忽視，側重行為影響"}], "note": "Self-centred 比 selfish 稍具描述性；selfish 更是直接的道德批評。"}, {"word": "self-congratulatory", "ipa": "/ˌselfkənˈɡrætʃʊlətri/", "pos": "adjective", "zh": "自鳴得意的", "part": "B", "examples": ["The chairman's self-congratulatory speech overshadowed the genuine contributions of the entire team.", "A self-congratulatory tone in academic writing is generally considered unprofessional."], "col": ["self-congratulatory tone", "self-congratulatory speech", "self-congratulatory attitude", "deeply self-congratulatory"], "syn": [{"w": "smug", "n": "最常用的近義詞，指沾沾自喜、令人不快的滿足感"}, {"w": "complacent", "n": "強調因過度自滿而停止進步或保持警惕"}, {"w": "boastful", "n": "強調自誇行為，通常是口頭上的吹嘘"}, {"w": "pompous", "n": "強調浮誇做作的自大感，語氣嚴厲"}], "note": "Self-congratulatory 較正式，多用於書面批評某人的語氣或態度，比口語的 smug 更適合IELTS學術寫作。"}, {"word": "self-deprecating", "ipa": "/ˌselfdˈeprɪkeɪtɪŋ/", "pos": "adjective", "zh": "自謙的；自我嘲弄的", "part": "B", "examples": ["Her self-deprecating humour immediately put the nervous audience at ease.", "A well-timed self-deprecating remark can be effective for defusing tension in difficult conversations."], "col": ["self-deprecating humour", "self-deprecating remark", "self-deprecating joke", "refreshingly self-deprecating", "charmingly self-deprecating"], "syn": [{"w": "modest", "n": "中性詞，指謙虛，不一定有幽默成分"}, {"w": "self-effacing", "n": "強調刻意不突出自己、退居幕後"}, {"w": "humble", "n": "強調謙遜的態度和品格，常有美德含義"}, {"w": "understated", "n": "強調刻意低調，不張揚，不限於自我描述"}], "note": "Self-deprecating 通常含有幽默成分；modest 是單純的謙虛。'self-deprecating humour' 是文化評論中的常見搭配。"}, {"word": "self-important", "ipa": "/ˌselfɪmˈpɔːtnt/", "pos": "adjective", "zh": "自以為是的", "part": "B", "examples": ["The self-important tone of his presentation alienated the very audience he set out to persuade.", "Voters tend to respond negatively to politicians who come across as self-important and out of touch."], "col": ["arrogant and self-important", "self-important attitude", "self-important manner", "pompously self-important"], "syn": [{"w": "arrogant", "n": "強調高傲自大，自認優越的態度"}, {"w": "pompous", "n": "強調浮誇做作，愛擺架子"}, {"w": "pretentious", "n": "強調假裝比實際更重要、高尚或博學"}, {"w": "conceited", "n": "強調對自身才能的過度自信和自滿"}], "note": "Self-important 特別強調對自身重要性的誇大感；arrogant 更側重對他人的輕視。兩者均帶強烈負面含義。"}, {"word": "tactful", "ipa": "/ˈtæktfl/", "pos": "adjective", "zh": "圓滑的；得體的", "part": "B", "examples": ["A tactful response acknowledges the other person's feelings without directly challenging their perspective.", "She was tactful enough to raise the sensitive issue without creating unnecessary conflict."], "col": ["tactful way", "tactful approach", "tactful manner", "tactful response", "tactful handling", "be tactful", "diplomatically tactful"], "syn": [{"w": "diplomatic", "n": "強調在複雜關係中圓融處理，不得罪任何一方"}, {"w": "discreet", "n": "強調謹慎、不透露敏感信息"}, {"w": "considerate", "n": "強調對他人感受的周全關注"}, {"w": "judicious", "n": "強調在處理時明智而審慎（judicious choice of words"}], "note": "Tactful 專注於溝通時的得體不冒犯；diplomatic 含義更廣。名詞 tact 也很常用（with great tact）。"}, {"word": "well-adjusted", "ipa": "/ˌwelədˈdʒʌstɪd/", "pos": "adjective", "zh": "適應良好的", "part": "B", "examples": ["Well-adjusted children are far better equipped to handle interpersonal conflict and social pressures later in life.", "A well-adjusted employee adapts smoothly to organisational changes."], "col": ["well-adjusted child", "emotionally well-adjusted", "socially well-adjusted", "well-adjusted adult", "well-adjusted personality"], "syn": [{"w": "balanced", "n": "強調心理或生活各方面的均衡協調"}, {"w": "grounded", "n": "強調腳踏實地、有安全感，不受外界動搖"}, {"w": "stable", "n": "強調情緒的穩定持續性"}, {"w": "resilient", "n": "強調在逆境中的恢復力，比 well-adjusted 更側重抗壓能力"}], "note": "Well-adjusted 是心理學術語，意指成功適應社會規範和期望。反義詞 maladjusted（適應不良的）在描述行為問題時同樣有用。"}, {"word": "well-bred", "ipa": "/ˌwelˈbred/", "pos": "adjective", "zh": "有教養的", "part": "B", "examples": ["A well-bred individual knows intuitively when to speak and when to listen.", "The host was impeccably well-bred, making every guest feel equally welcome."], "col": ["well-bred person", "polite and well-bred", "impeccably well-bred", "well-bred manner"], "syn": [{"w": "refined", "n": "強調通過教育和文化陶冶而來的品味與禮儀"}, {"w": "courteous", "n": "強調有禮貌、彬彬有禮"}, {"w": "cultivated", "n": "強調通過學習和藝術薰陶的修養"}, {"w": "polished", "n": "強調社交技巧成熟、表現圓融得體"}], "note": "Well-bred 在英國文化中帶有一定的階級色彩。在現代語境中，它單純指有教養、知禮儀，可不帶階級意涵使用。"}, {"word": "well-brought-up", "ipa": "/ˌwelˌbrɔːtˈʌp/", "pos": "adjective", "zh": "家教良好的", "part": "B", "examples": ["A well-brought-up child naturally uses polite expressions and treats adults with respect.", "Being well-brought-up does not guarantee success, but it does make social interactions smoother."], "col": ["well-behaved and well-brought-up", "clearly well-brought-up", "well-brought-up child"], "syn": [{"w": "well-mannered", "n": "強調行為舉止符合禮儀規範"}, {"w": "well-behaved", "n": "強調遵守行為規範，不製造麻煩"}, {"w": "disciplined", "n": "強調有紀律、自我約束"}, {"w": "respectful", "n": "強調對他人（尤其長輩"}], "note": "Well-brought-up 與 well-bred 相近，但前者更強調父母教養的角色；後者偏向社會背景或階級。"}, {"word": "well-dressed", "ipa": "/ˌwelˈdrest/", "pos": "adjective", "zh": "衣著入時的", "part": "B", "examples": ["Arriving well-dressed to a job interview can significantly shape the interviewer's initial perception.", "The conference was attended by well-dressed professionals from across the financial sector."], "col": ["well-dressed man", "smart and well-dressed", "impeccably well-dressed", "well-dressed professional"], "syn": [{"w": "smartly dressed", "n": "強調整齊得體，適合正式場合"}, {"w": "stylish", "n": "強調時尚感和個人品味"}, {"w": "dapper", "n": "多形容男性打扮整齊帥氣（略帶文雅感"}, {"w": "chic", "n": "強調時髦優雅，常用於時尚語境"}], "note": "Well-dressed 強調的是適合性（appropriateness）而非昂貴或名牌，適用於描述正式場合的得體著裝。"}, {"word": "anti-social", "ipa": "/ˌæntiˈsoʊʃl/", "pos": "adjective", "zh": "反社會的", "part": "B", "examples": ["Anti-social behaviour in public spaces, such as vandalism, is a growing concern in many urban communities.", "Some adolescents withdraw into anti-social behaviour as a response to bullying or long-term exclusion."], "col": ["anti-social behaviour", "anti-social tendency", "anti-social acts", "anti-social personality", "tackle anti-social behaviour"], "syn": [{"w": "disruptive", "n": "強調破壞秩序或正常運作的行為"}, {"w": "hostile", "n": "強調敵對、充滿攻擊性的態度"}, {"w": "unsociable", "n": "指不喜社交、傾向獨處，比 anti-social 溫和得多"}, {"w": "deviant", "n": "偏離社會規範的行為，較學術正式"}], "note": "注意區分：anti-social（反社會的，具破壞性）與 unsociable（不喜社交的）含義截然不同。"}, {"word": "conservative", "ipa": "/kənˈsɜːvətɪv/", "pos": "adjective", "zh": "保守的", "part": "B", "examples": ["A conservative approach to investment prioritises capital security over the pursuit of high but risky returns.", "Some parents with socially conservative values find it difficult to reconcile their beliefs with rapid cultural shifts."], "col": ["conservative view", "conservative approach", "politically conservative", "socially conservative", "conservative estimate", "conservative values", "conservative thinking"], "syn": [{"w": "traditional", "n": "強調遵循傳統做法和信仰"}, {"w": "conventional", "n": "強調符合一般慣例和大眾預期"}, {"w": "cautious", "n": "強調謹慎、規避風險的態度"}, {"w": "orthodox", "n": "強調嚴格遵守傳統或正統觀念"}], "note": "首字母大寫 Conservative 指保守黨政治意識形態；小寫指一般性格特質。'A conservative estimate' 意為「保守估計」（最低估計）。"}, {"word": "conventional", "ipa": "/kənˈvenʃənl/", "pos": "adjective", "zh": "習俗的；傳統的", "part": "B", "examples": ["Many successful start-ups deliberately challenge conventional wisdom about how businesses should be structured.", "She chose a conventional career path in medicine despite having a passion for art and design."], "col": ["conventional wisdom", "conventional method", "conventional approach", "conventional thinking", "conventional lifestyle", "break with convention"], "syn": [{"w": "traditional", "n": "強調依循歷史傳統，帶有更深厚的文化根源"}, {"w": "orthodox", "n": "強調嚴格遵守公認規範，不容偏差"}, {"w": "mainstream", "n": "強調屬於大多數人認可的主流"}, {"w": "customary", "n": "強調習俗和慣例（customary practice"}], "note": "'Conventional wisdom'（普遍接受的觀點）不一定有充分論據支持——在IELTS議論文中，可作為需要挑戰的既有想法。"}, {"word": "harmonious", "ipa": "/hɑːˈmoʊniəs/", "pos": "adjective", "zh": "和諧的", "part": "B", "examples": ["Maintaining a harmonious working environment requires consistent communication and mutual respect.", "The documentary explores how distinct ethnic communities have built harmonious relationships in multicultural cities."], "col": ["harmonious relationship", "harmonious atmosphere", "harmonious society", "harmonious balance", "harmonious coexistence", "harmonious environment"], "syn": [{"w": "amicable", "n": "強調友好和睦的關係（amicable settlement"}, {"w": "peaceful", "n": "強調沒有衝突或紛爭"}, {"w": "cooperative", "n": "強調合作共事的精神"}, {"w": "cohesive", "n": "強調凝聚力強、緊密團結"}], "note": "Harmonious 常出現在雅思多元文化、職場關係和社會議題文章中。名詞 harmony 是高頻詞（racial harmony, social harmony）。"}, {"word": "influential", "ipa": "/ˌɪnfluˈenʃl/", "pos": "adjective", "zh": "有影響力的", "part": "B", "examples": ["Social media influencers have become among the most commercially influential figures in contemporary marketing.", "The philosopher's work proved profoundly influential in shaping twentieth-century political thought."], "col": ["highly influential", "influential figure", "influential leader", "profoundly influential", "politically influential", "influential role", "influential media"], "syn": [{"w": "powerful", "n": "廣義地位強大，包含影響力與控制力"}, {"w": "persuasive", "n": "側重說服他人的能力"}, {"w": "prominent", "n": "強調知名度和受矚目的地位"}, {"w": "significant", "n": "強調重要性，較廣泛"}], "note": "Influence 是透過說服或啟發塑造他人想法；power 通常指正式的權威或控制力——兩者有別。"}, {"word": "multicultural", "ipa": "/ˌmʌltiˈkʌltʃərəl/", "pos": "adjective", "zh": "多元文化的", "part": "B", "examples": ["Australia's multicultural identity is richly reflected in its diverse cuisine and eclectic public celebrations.", "A genuinely multicultural education system exposes students to a wide spectrum of worldviews."], "col": ["multicultural society", "multicultural education", "multicultural city", "multicultural environment", "multicultural community", "increasingly multicultural"], "syn": [{"w": "diverse", "n": "廣義多元，不限於文化（racial diversity, gender diversity"}, {"w": "cosmopolitan", "n": "強調國際化、包容不同文化的都市特性"}, {"w": "pluralistic", "n": "強調多元觀點或群體並存的社會體系"}, {"w": "inclusive", "n": "強調積極納入並尊重所有群體"}], "note": "Multicultural 特指文化多樣性；diverse 是更廣泛的詞。在移民政策、教育和社會討論中，multicultural 是IELTS高頻詞。"}, {"word": "suburban", "ipa": "/səˈbɜːbən/", "pos": "adjective", "zh": "郊區的", "part": "B", "examples": ["The suburban lifestyle offers more space and tranquillity than city living, but often at the cost of long commutes.", "Many families relocate to suburban areas in search of better schools and safer neighbourhoods."], "col": ["suburban area", "suburban life", "suburban neighbourhood", "suburban community", "suburban sprawl", "suburban housing", "suburban commute"], "syn": [{"w": "residential", "n": "強調以住宅為主的地區，較中性"}, {"w": "outlying", "n": "強調位於城市外圍地帶"}, {"w": "peripheral", "n": "強調在中心以外的周邊地帶，較學術"}, {"w": "out-of-town", "n": "強調在市區以外，常用於零售語境"}], "note": "Suburban 在文化批評中有時帶「安逸、單調」的隱含意義，但這是語境性的，並非字典定義。'Urban sprawl'（都市蔓延）是相關重要概念。"}, {"word": "unconventional", "ipa": "/ˌʌnkənˈvenʃənl/", "pos": "adjective", "zh": "非常規的", "part": "B", "examples": ["The architect's boldly unconventional designs attracted both fierce criticism and widespread admiration.", "Unconventional teaching methods can be highly effective with students who struggle in traditional settings."], "col": ["unconventional method", "unconventional lifestyle", "unconventional approach", "unconventional thinking", "refreshingly unconventional", "unconventional artist"], "syn": [{"w": "unorthodox", "n": "強調不符合公認正統規範，語氣偏批評"}, {"w": "non-conformist", "n": "強調拒絕遵從社會期望或慣例"}, {"w": "avant-garde", "n": "強調前衛創新，尤用於藝術和文化語境"}, {"w": "innovative", "n": "強調引入新事物，較正面的評價詞"}], "note": "Unconventional 通常是中性甚至正面的詞；unorthodox 則稍帶負面色彩（暗示違背正統）。"}, {"word": "conform", "ipa": "/kənˈfɔːm/", "pos": "verb", "zh": "遵守；符合", "part": "C", "examples": ["Individuals who refuse to conform to prevailing social norms are often marginalised by mainstream society.", "All products must conform to current safety regulations before they can be legally sold."], "col": ["conform to rules", "conform with standards", "conform to expectations", "pressure to conform", "refuse to conform", "conform to norms"], "syn": [{"w": "comply", "n": "強調遵守規則或命令（comply with regulations"}, {"w": "adhere", "n": "指嚴格遵守（adhere to guidelines / principles"}, {"w": "abide by", "n": "遵守某規則或決定（abide by the law"}, {"w": "follow", "n": "最廣義的遵從（follow instructions"}], "note": "Conform 往往帶輕微負面含義——暗示為了融入而犧牲個人性。名詞 conformity（從眾性）是雅思社會議題的高頻詞。"}, {"word": "exclude", "ipa": "/ɪkˈskluːd/", "pos": "verb", "zh": "排除；排斥", "part": "C", "examples": ["Marginalised communities have long been systematically excluded from mainstream economic opportunities.", "The research design excluded participants with prior knowledge of the procedure to ensure unbiased results."], "col": ["exclude from group", "exclude possibility", "deliberately exclude", "systematically exclude", "feel excluded", "socially exclude"], "syn": [{"w": "marginalise", "n": "強調將某人或群體推到社會邊緣地帶"}, {"w": "ostracise", "n": "強調社會性地排斥、孤立某人"}, {"w": "bar", "n": "強調正式禁止某人進入或參與（barred from entry"}, {"w": "omit", "n": "較中性，指省略（omit from the list"}], "note": "名詞 exclusion 在社會科學寫作中非常高頻（social exclusion, exclusion from education）。反義詞 include / inclusion 也是IELTS常見詞。"}, {"word": "flaunt", "ipa": "/flɔːnt/", "pos": "verb", "zh": "炫耀；誇示", "part": "C", "examples": ["The reality format gave contestants a platform to flaunt their wealth and extravagant lifestyles.", "Openly flaunting expensive possessions in a context of economic inequality can generate significant resentment."], "col": ["flaunt wealth", "flaunt success", "openly flaunt", "shamelessly flaunt", "flaunt privilege", "flaunt rules"], "syn": [{"w": "show off", "n": "最口語化的炫耀，帶有幼稚或輕浮的意味"}, {"w": "boast", "n": "強調口頭上的吹嘘和自誇"}, {"w": "parade", "n": "強調公開展示以引人注目（parade one's achievements"}, {"w": "display", "n": "中性詞，指展示（不一定是炫耀"}], "note": "Flaunt 永遠含有炫耀和吸引注意的意圖，絕非中性詞。常見錯誤：將 flaunt（炫耀）與 flout（無視規則）混淆——注意拼寫！"}, {"word": "obey", "ipa": "/əˈbeɪ/", "pos": "verb", "zh": "服從；遵守", "part": "C", "examples": ["Citizens are expected to obey the law even when they personally disagree with it.", "A dog that has been properly trained will obey commands reliably in a variety of environments."], "col": ["obey rules", "obey orders", "obey authority", "obey the law", "obey instructions", "blindly obey", "refuse to obey"], "syn": [{"w": "comply", "n": "較中性，強調遵守規則或要求"}, {"w": "follow", "n": "廣義遵從（follow orders / follow advice"}, {"w": "heed", "n": "正式語境，指聽從建議或警告（heed the warning"}, {"w": "submit", "n": "含有順服、屈從的意味，強調面對權威時的順從"}], "note": "Obey 通常隱含一種權力關係；comply 則更中性。'Blindly obey'（盲目服從）是描述無批判性順從的有力搭配。"}, {"word": "skew", "ipa": "/skjuː/", "pos": "verb", "zh": "扭曲；使偏斜", "part": "C", "examples": ["The survey results were significantly skewed because the sample group was not representative of the population.", "Selective media reporting can skew public perception by focusing disproportionately on the most divisive elements."], "col": ["skew results", "skew the truth", "skew data", "skew perception", "skew towards", "heavily skewed", "statistically skewed"], "syn": [{"w": "distort", "n": "廣義扭曲，可指事實、形狀或信息的變形"}, {"w": "bias", "n": "使帶有偏見或偏差（biased towards a particular view"}, {"w": "misrepresent", "n": "錯誤或不公平地呈現某事實"}, {"w": "manipulate", "n": "強調故意操縱信息或數據以達到特定目的"}], "note": "Skew 在統計學和學術語境中極為常見（skewed distribution）。在批判性媒體分析的IELTS題目中，這是一個高區分度的動詞。"}, {"word": "follow accepted behaviour", "ipa": "", "pos": "phrase", "zh": "遵循公認的行為", "part": "D", "examples": ["In professional settings, it is essential to follow accepted behaviour by respecting established workplace etiquette.", "The community places strong pressure on its members to follow accepted behaviour at all public events."], "col": ["strictly follow accepted behaviour", "expected to follow accepted behaviour", "pressure to follow accepted behaviour"], "syn": [{"w": "conform to social norms", "n": "遵循社會規範（最接近的正式同義詞"}, {"w": "comply with social expectations", "n": "符合社會期望"}, {"w": "observe etiquette", "n": "遵守禮節"}, {"w": "adhere to social conventions", "n": "恪守社會慣例"}], "note": "在討論從眾性（conformity）和個人主義（individualism）的IELTS題目中很有用，可與 deviate from expected behaviour 形成對比。"}, {"word": "shun mainstream values", "ipa": "", "pos": "phrase", "zh": "避開主流價值觀", "part": "D", "examples": ["A growing number of young people are choosing to shun mainstream values such as home ownership in favour of minimalist lifestyles.", "Artists who shun mainstream values often find themselves at the forefront of cultural innovation."], "col": ["decide to shun mainstream values", "actively shun mainstream values", "deliberately shun mainstream values"], "syn": [{"w": "reject social norms", "n": "拒絕社會規範，語氣最直接"}, {"w": "challenge conventional wisdom", "n": "挑戰傳統觀念"}, {"w": "go against the grain", "n": "逆流而行，反其道而行之"}, {"w": "deviate from the norm", "n": "偏離常規，較中性"}, {"w": "break with tradition", "n": "打破傳統，常用於正面革新語境"}], "note": "Shun 帶有刻意迴避和某種程度抗拒的含義，比 avoid 更強烈。常出現在討論反主流文化（counterculture）和社會變遷的IELTS題目中。"}]
};

const PART_LABELS = {
  A:'Part A · Nouns', B:'Part B · Adjectives',
  C:'Part C · Verbs',  D:'Part D · Phrases'
};

const SK = 'ielts_u1';
let cur=0, mode='browse', flipped=false, known=[], onIntro=true;

function load(){ try{ known=JSON.parse(localStorage.getItem(SK)||'[]'); }catch(e){known=[];} }
function save(){ try{ localStorage.setItem(SK,JSON.stringify(known)); }catch(e){} }
function isKnown(i){ return known.includes(i); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function updateDots(){
  const n=UNIT.words.length, max=Math.min(n,30);
  let h='';
  for(let i=0;i<max;i++){
    const c=(!onIntro&&i===cur)?'dot cur':isKnown(i)?'dot known':'dot';
    h+='<div class="'+c+'"></div>';
  }
  if(n>max) h+='<span style="font-family:var(--fm);font-size:.5rem;color:var(--g400);margin-left:2px;">+'+(n-max)+'</span>';
  document.getElementById('dots').innerHTML=h;
}

function renderIntro(){
  document.getElementById('counter').textContent='Introduction';
  document.getElementById('known-badge').textContent='';
  document.getElementById('prog-fill').style.width='0%';
  document.getElementById('action-count').textContent='';
  document.getElementById('know-btn').style.display='none';
  document.getElementById('review-btn').style.display='none';

  const f=document.getElementById('front-face');
  f.className='face front intro-face';
  f.innerHTML=
    '<div class="ic-eyebrow">IELTS Core Thematic Vocabulary · Chapter 1 of 10</div>'+
    '<div class="ic-title">Personality, Character & Human Behaviour</div>'+
    '<div class="ic-zh">人格特質與人類行為</div>'+
    '<div class="ic-rule"></div>'+
    '<div class="ic-body">'+
      '<div>'+
        '<div class="ic-sec-label">關於本章</div>'+
        '<div class="ic-about">本章收錄 51 個核心詞彙。每個詞條包含例句、搭配詞、近義辨析，部分附有學習注意事項。</div>'+
      '</div>'+
      '<div>'+
        '<div class="ic-sec-label">使用方式</div>'+
        '<div class="ic-steps">'+
          '<div class="ic-step"><span class="ic-tag">Browse</span>正面顯示英文單字，翻面查看中文、例句與搭配詞。</div>'+
          '<div class="ic-step"><span class="ic-tag">Quiz</span>正面顯示中文，翻面前先回想英文，訓練主動回憶。</div>'+
          '<div class="ic-step"><span class="ic-tag">Know it ✓</span>標記已掌握。<span class="ic-tag">Review ↺</span>重新複習。</div>'+
          '<div class="ic-step"><span class="ic-tag">快捷鍵</span>← → 切換卡片 &nbsp;·&nbsp; F 翻轉 &nbsp;·&nbsp; K 標記</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="ic-hint">按 Next → 開始學習</div>';

  document.getElementById('back-face').innerHTML='';
  updateDots();
}

function render(){
  if(onIntro){ renderIntro(); return; }
  document.getElementById('front-face').className='face front';
  document.getElementById('know-btn').style.display='';
  document.getElementById('review-btn').style.display='';

  const w=UNIT.words[cur], n=UNIT.words.length, k=isKnown(cur);
  document.getElementById('counter').textContent=(cur+1)+' / '+n;
  document.getElementById('known-badge').textContent=known.length+' / '+n+' known';
  document.getElementById('prog-fill').style.width=((cur+1)/n*100)+'%';
  document.getElementById('action-count').textContent=known.length+'/'+n;

  const isQuiz=(mode==='quiz');

  document.getElementById('front-face').innerHTML=
    '<div class="f-top">'+
      '<div class="f-meta">'+
        '<div class="f-num">#'+String(cur+1).padStart(3,'0')+'</div>'+
        '<div class="f-part">'+(PART_LABELS[w.part]||'')+'</div>'+
      '</div>'+
      '<span class="f-known-mark'+(k?' vis':'')+'">✓ known</span>'+
    '</div>'+
    '<div class="f-body">'+
      '<div class="f-word">'+esc(isQuiz?w.zh:w.word)+'</div>'+
      (!isQuiz&&w.ipa?'<div class="f-ipa">'+esc(w.ipa)+'</div>':'')+
      (!isQuiz?'<div class="f-pos">'+esc(w.pos)+'</div>':'')+
    '</div>'+
    '<div class="f-hint">'+(isQuiz?'think → click to flip':'click to flip →')+'</div>';

  const exH=(w.examples||[]).map(e=>'<div class="b-ex">“'+esc(e)+'”</div>').join('');
  const colH=(w.col||[]).map(c=>'<div class="b-col">'+esc(c)+'</div>').join('');
  const synH=(w.syn||[]).map(s=>
    '<div class="b-syn-row"><div class="b-syn-w">'+esc(s.w)+'</div>'+
    '<div class="b-syn-n">（'+esc(s.n)+'）</div></div>'
  ).join('');
  const noteH=w.note
    ?'<div class="b-sec"><div class="b-label">注意</div><div class="b-note">'+esc(w.note)+'</div></div>':'';

  let zhLine, metaLine='';
  if(isQuiz){
    zhLine='<div class="b-quiz-word">'+esc(w.word)+'</div>';
    metaLine='<div class="b-quiz-meta">'+esc(w.pos)+(w.ipa?' &nbsp;'+esc(w.ipa):'')+'</div>';
  } else {
    zhLine='<div class="b-zh">'+esc(w.zh)+'</div>';
  }

  document.getElementById('back-face').innerHTML=
    zhLine+metaLine+
    '<div class="b-rule"></div>'+
    '<div class="b-content">'+
      (exH?'<div class="b-sec"><div class="b-label">Examples</div>'+exH+'</div>':'')+
      (colH?'<div class="b-sec"><div class="b-label">搭配</div><div class="b-cols">'+colH+'</div></div>':'')+
      (synH?'<div class="b-sec"><div class="b-label">近義</div><div class="b-syns">'+synH+'</div></div>':'')+
      noteH+
    '</div>';

  updateDots();
}

function flip(){
  if(onIntro) return;
  flipped=!flipped;
  document.getElementById('card').classList.toggle('flipped',flipped);
}

function go(dir){
  if(onIntro&&dir>0){
    onIntro=false;cur=0;flipped=false;
    document.getElementById('card').classList.remove('flipped');
    render();return;
  }
  if(!onIntro&&dir<0&&cur===0){
    onIntro=true;flipped=false;
    document.getElementById('card').classList.remove('flipped');
    render();return;
  }
  if(onIntro) return;
  cur=Math.max(0,Math.min(UNIT.words.length-1,cur+dir));
  flipped=false;
  document.getElementById('card').classList.remove('flipped');
  render();
}

function markKnown(){
  if(onIntro) return;
  if(!isKnown(cur)) known.push(cur);
  save();render();
  setTimeout(function(){ if(cur<UNIT.words.length-1) go(1); },180);
}

function markReview(){
  if(onIntro) return;
  known=known.filter(function(x){return x!==cur;});
  save();render();
}

function setMode(m){
  mode=m;flipped=false;
  document.getElementById('card').classList.remove('flipped');
  document.querySelectorAll('.mode-btn').forEach(function(b){
    b.classList.toggle('active',b.dataset.mode===m);
  });
  render();
}

let suppressClick=false;
(function(){
  const sc=document.getElementById('scene');
  sc.addEventListener('click',function(){
    if(suppressClick){suppressClick=false;return;}
    flip();
  });
  let x0=null,y0=null;
  sc.addEventListener('touchstart',function(e){
    const t=e.changedTouches[0];x0=t.clientX;y0=t.clientY;
  },{passive:true});
  sc.addEventListener('touchend',function(e){
    if(x0===null)return;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4){
      suppressClick=true;
      go(dx<0?1:-1);
      setTimeout(function(){suppressClick=false;},400);
    }
    x0=null;
  },{passive:true});
})();
document.getElementById('prev-btn').addEventListener('click',function(e){e.stopPropagation();go(-1);});
document.getElementById('next-btn').addEventListener('click',function(e){e.stopPropagation();go(1);});
document.getElementById('know-btn').addEventListener('click',function(e){e.stopPropagation();markKnown();});
document.getElementById('review-btn').addEventListener('click',function(e){e.stopPropagation();markReview();});
document.querySelectorAll('.mode-btn').forEach(function(b){
  b.addEventListener('click',function(e){e.stopPropagation();setMode(b.dataset.mode);});
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='f'||e.key==='F') flip();
  else if(e.key==='k'||e.key==='K') markKnown();
});

load();render();
</script>
</body>
</html>
