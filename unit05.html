  src: "Units 10, 11 & 18",
  count: 54,
  words: [{"word": "capsule","ipa": "/ˈkæpsjuːl/","pos": "noun","zh": "膠囊；太空艙","part": "A","examples": ["The drug was reformulated into a slow-release capsule to reduce the frequency of daily dosing required.","Engineers celebrated as the space capsule successfully re-entered Earth's atmosphere after a six-month mission."],"col": ["time capsule","space capsule","capsule collection","capsule wardrobe","medicine capsule","release a capsule","capsule hotel","drug capsule"],"syn": [{"w": "tablet","n": "指固體壓制的藥片，比capsule更廣義"},{"w": "pod","n": "偏科技語境，指密封的容器或艙體"},{"w": "container","n": "最廣義，泛指任何容器，不強調醫藥或太空意涵"}],"note": "capsule在醫藥語境指膠囊，在時尚語境中capsule wardrobe（膠囊衣櫥）指少而精的必備服裝組合，在IELTS科技類文章中也常指太空艙。"},{"word": "carbon dioxide","ipa": "/ˌkɑːbən daɪˈɒksaɪd/","pos": "noun","zh": "二氧化碳","part": "A","examples": ["The combustion of fossil fuels releases enormous quantities of carbon dioxide into the atmosphere, accelerating climate change.","Scientists are exploring innovative methods to capture carbon dioxide directly from the air and convert it into useful materials."],"col": ["carbon dioxide emissions","reduce carbon dioxide","carbon dioxide levels","carbon dioxide concentration","atmospheric carbon dioxide","carbon dioxide capture","release carbon dioxide","carbon dioxide equivalent"],"syn": [{"w": "CO₂","n": "最常用的縮寫形式，在科學報告和圖表中普遍使用"},{"w": "greenhouse gas","n": "更廣義，包含二氧化碳在內的多種溫室氣體"},{"w": "carbon emission","n": "強調排放行為，比carbon dioxide更聚焦於環保議題"}],"note": "carbon dioxide是IELTS環境類文章的核心科學詞彙；CO₂ equivalent（二氧化碳當量）用於比較不同溫室氣體的暖化效應，是高分寫作的有用概念。"},{"word": "compound","ipa": "/ˈkɒmpaʊnd/","pos": "noun","zh": "化合物","part": "A","examples": ["Researchers discovered a naturally occurring compound in the plant that showed remarkable potential as an anti-cancer agent.","The chemical compound was found to be highly toxic in concentrated form but harmless at the levels present in treated drinking water."],"col": ["chemical compound","organic compound","natural compound","synthetic compound","toxic compound","compound found in","compound structure","compound analysis"],"syn": [{"w": "substance","n": "最廣義，泛指任何物質，不強調化學組成"},{"w": "mixture","n": "強調多種物質混合，與compound不同，混合物各成分保持獨立"},{"w": "element","n": "特指化學元素，是compound的組成單位"}],"note": "compound（化合物）是兩種以上元素化學結合的產物，與mixture（混合物）不同；IELTS科學類閱讀中，compound常出現在藥物研發或材料科學語境。"},{"word": "consequences","ipa": "/ˈkɒnsɪkwənsɪz/","pos": "noun","zh": "後果","part": "A","examples": ["The long-term consequences of widespread antibiotic overuse are beginning to manifest in the form of drug-resistant infections.","Governments must carefully weigh the potential consequences of new technology before committing to large-scale deployment."],"col": ["serious consequences","long-term consequences","face consequences","consequences of action","unintended consequences","grave consequences","far-reaching consequences","consequences for health"],"syn": [{"w": "repercussions","n": "強調反彈性影響，常指意外的負面結果"},{"w": "implications","n": "強調潛在的影響或意義，比consequences更廣義"},{"w": "outcomes","n": "最中性，泛指任何結果，不一定含有負面意涵"}],"note": "consequences在IELTS寫作中是高頻詞彙，几乎所有議題都能用到；unintended consequences（意外後果）是討論技術或政策副作用的標準學術表達。"},{"word": "dose","ipa": "/dəʊs/","pos": "noun","zh": "劑量","part": "A","examples": ["Patients are advised never to exceed the recommended dose of over-the-counter pain relief medication.","Research suggests that even a small daily dose of moderate-intensity exercise can substantially reduce the risk of cardiovascular disease."],"col": ["recommended dose","lethal dose","daily dose","high dose","low dose","overdose","dose of radiation","dose of medicine"],"syn": [{"w": "amount","n": "最廣義，泛指任何數量"},{"w": "quantity","n": "強調可測量的數量，比dose更廣義"},{"w": "measure","n": "偏正式，可指計量或份量"}],"note": "dose特指藥物或放射線的劑量，也可比喻性地指「適量的某事」（如a dose of reality）；IELTS醫學類閱讀中overdose（過量）是核心相關詞彙。"},{"word": "exposure","ipa": "/ɪkˈspəʊʒə/","pos": "noun","zh": "暴露；接觸","part": "A","examples": ["Prolonged exposure to UV radiation significantly increases the risk of developing skin cancer later in life.","Media exposure can be a double-edged sword for celebrities, offering fame while simultaneously eroding privacy."],"col": ["sun exposure","media exposure","exposure to chemicals","prolonged exposure","exposure to risk","repeated exposure","exposure therapy","limit exposure"],"syn": [{"w": "contact","n": "強調直接接觸，比exposure更廣義"},{"w": "vulnerability","n": "強調因暴露而產生的易受傷害狀態"},{"w": "publicity","n": "特指媒體或公眾的曝光，與媒體語境的exposure同義"}],"note": "exposure涵蓋醫療（exposure to pathogens）、環境（chemical exposure）、媒體（media exposure）三種語境，需靠上下文理解。"},{"word": "food chain","ipa": "/ˈfuːd tʃeɪn/","pos": "noun","zh": "食物鏈","part": "A","examples": ["The collapse of any single species can trigger a cascade of disruption throughout the entire food chain.","Pesticides that accumulate in the bodies of small organisms can become dangerously concentrated at higher levels of the food chain."],"col": ["top of the food chain","food chain disruption","the food chain","marine food chain","food chain collapse","food web","entire food chain","food chain contamination"],"syn": [{"w": "food web","n": "比food chain更複雜，描述生態系統中交錯的多條食物鏈"},{"w": "ecosystem","n": "更廣義，包含食物鏈在內的完整生態系統"},{"w": "trophic level","n": "更學術，指食物鏈中不同的能量層級"}],"note": "food chain強調線性的捕食關係，food web描述更複雜的網狀結構；IELTS生態類閱讀中bioaccumulation（生物累積）是與food chain緊密相關的重要概念。"},{"word": "infection","ipa": "/ɪnˈfekʃən/","pos": "noun","zh": "感染","part": "A","examples": ["The rapid spread of the infection across national borders highlighted the inadequacy of existing international health monitoring systems.","Antibiotic-resistant infections are projected to cause more deaths globally than cancer by the middle of the century."],"col": ["bacterial infection","viral infection","respiratory infection","prevent infection","spread of infection","treat infection","infection rate","infection control"],"syn": [{"w": "disease","n": "更廣義，指任何健康狀況的紊亂，不一定由病原體引起"},{"w": "contagion","n": "強調傳染性疾病的擴散過程，比infection更強調傳播"},{"w": "contamination","n": "強調被有害物質污染，偏環境語境而非醫療語境"}],"note": "infection特指病原體入侵導致的感染；IELTS醫療類文章中antibiotic-resistant infection（抗藥性感染）是近年最重要的相關議題。"},{"word": "pesticide","ipa": "/ˈpestɪsaɪd/","pos": "noun","zh": "殺蟲劑","part": "A","examples": ["The widespread use of pesticides in modern agriculture has been linked to the dramatic decline of bee populations globally.","Organic farming prohibits the use of synthetic pesticides, relying instead on natural pest control methods."],"col": ["chemical pesticide","pesticide residue","apply pesticide","pesticide use","pesticide contamination","ban on pesticides","pesticide exposure","synthetic pesticide"],"syn": [{"w": "insecticide","n": "特指殺滅昆蟲的農藥，是pesticide的下位詞"},{"w": "herbicide","n": "特指除草劑，也是pesticide的一種"},{"w": "agrochemical","n": "泛指農業化學品，包含pesticide、fertiliser等"}],"note": "pesticide是廣義的農藥總稱；IELTS農業和環境類文章中，pesticide residue（農藥殘留）和organic farming（有機農業）是常見討論主題。"},{"word": "protein","ipa": "/ˈprəʊtiːn/","pos": "noun","zh": "蛋白質","part": "A","examples": ["Plant-based protein sources such as legumes and nuts are gaining popularity as alternatives to meat in many developed countries.","Researchers are developing insect-based protein products as a more sustainable and resource-efficient food source for the future."],"col": ["protein source","plant protein","protein intake","protein deficiency","high-protein diet","animal protein","protein supplement","protein synthesis"],"syn": [{"w": "nutrient","n": "更廣義，包含蛋白質在內的所有必需營養素"},{"w": "macronutrient","n": "泛指蛋白質、碳水化合物、脂肪等大量營養素"},{"w": "amino acid","n": "蛋白質的組成單位，比protein更精確的生化術語"}],"note": "protein是IELTS健康和食品科學類核心詞彙；plant-based protein（植物性蛋白質）和alternative protein（替代蛋白質）是近年高頻主題。"},{"word": "reaction","ipa": "/riˈækʃən/","pos": "noun","zh": "反應","part": "A","examples": ["The chemical reaction between the two substances produced an unexpected by-product that required careful disposal.","The public's immediate reaction to the policy announcement was overwhelmingly negative, prompting the government to reconsider."],"col": ["chemical reaction","reaction time","initial reaction","public reaction","adverse reaction","nuclear reaction","trigger a reaction","reaction to change"],"syn": [{"w": "response","n": "最廣義，指對刺激或情況的回應，比reaction更中性"},{"w": "effect","n": "偏指結果或影響，比reaction更強調因果關係"},{"w": "feedback","n": "特指對行動或作品的回應意見，多用於人際或商業語境"}],"note": "reaction在化學語境指化學反應；在社會語境指對事件的反應；IELTS中兩種語境都常見，chemical reaction是科學類文章的核心詞彙。"},{"word": "side effects","ipa": "/ˈsaɪd ɪˌfekts/","pos": "noun","zh": "副作用","part": "A","examples": ["All medications carry some risk of side effects, and patients should be fully informed before beginning any new treatment.","The economic side effects of the lockdown were far more severe than policymakers had anticipated."],"col": ["cause side effects","potential side effects","harmful side effects","minimal side effects","side effects of treatment","serious side effects","unwanted side effects","manage side effects"],"syn": [{"w": "adverse effects","n": "更正式的醫學術語，強調有害的非預期影響"},{"w": "by-products","n": "偏化學或工業語境，指製程的附帶產物"},{"w": "repercussions","n": "偏社會或政治語境，指意外的連帶後果"}],"note": "side effects原是醫學術語，現也廣泛比喻政策或技術的意外後果；adverse effects是更正式的學術替換，在IELTS醫學類文章中兩者均常見。"},{"word": "bacterial","ipa": "/bækˈtɪərɪəl/","pos": "adj","zh": "細菌的","part": "B","examples": ["The overuse of antibiotics in farming has accelerated the evolution of bacterial strains that are resistant to conventional treatments.","Bacterial infections of the urinary tract are among the most common reasons for antibiotic prescriptions in general practice."],"col": ["bacterial infection","bacterial growth","bacterial strain","bacterial resistance","bacterial contamination","bacterial disease","drug-resistant bacterial","bacterial colony"],"syn": [{"w": "microbial","n": "更廣義，涵蓋細菌、病毒和真菌等所有微生物"},{"w": "pathogenic","n": "特指能引起疾病的，比bacterial更強調致病性"},{"w": "infectious","n": "強調可傳染的特性，比bacterial更聚焦於傳播"}],"note": "bacterial是形容詞，特指與細菌相關的；antibiotic resistance（抗生素抗藥性）是bacterial resistance最重要的IELTS相關概念。"},{"word": "contagious","ipa": "/kənˈteɪdʒəs/","pos": "adj","zh": "具傳染性的","part": "B","examples": ["Health authorities warned that the new strain of influenza was highly contagious, spreading rapidly through crowded workplaces and schools.","The speaker's enthusiasm was contagious, and by the end of the presentation the entire audience had been energised."],"col": ["highly contagious","contagious disease","contagious laughter","contagious spread","contagious illness","remain contagious","contagious period","contagious enthusiasm"],"syn": [{"w": "infectious","n": "廣義指可傳播的疾病，contagious特指通過接觸傳播"},{"w": "transmissible","n": "更科學的正式用語，強調可由一個宿主傳到另一個"},{"w": "communicable","n": "醫學術語，指可傳播的疾病類型"}],"note": "contagious特指通過直接或間接接觸傳播；infectious更廣義，包括空氣、水等媒介傳播的疾病。IELTS公衛類文章兩者均頻繁出現。"},{"word": "contaminated","ipa": "/kənˈtæmɪneɪtɪd/","pos": "adj","zh": "受汙染的","part": "B","examples": ["Thousands of residents were advised to boil their water after tests revealed that the local supply had been contaminated with harmful bacteria.","Contaminated soil in the former industrial zone poses serious long-term health risks to the surrounding community."],"col": ["contaminated water","contaminated soil","contaminated food","heavily contaminated","contaminated site","contaminated supply","contaminated area","contaminated sample"],"syn": [{"w": "polluted","n": "強調被有害物質污染，比contaminated更常用於空氣和水體"},{"w": "tainted","n": "偏非正式，可指食物或聲譽受損，比contaminated更廣義"},{"w": "impure","n": "強調不純淨，偏化學或道德語境"}],"note": "contaminated強調特定有害物質的污染；polluted偏環境整體污染。IELTS環境和公衛類文章中，contaminated groundwater（地下水污染）是重要議題。"},{"word": "controversial","ipa": "/ˌkɒntrəˈvɜːʃəl/","pos": "adj","zh": "具爭議性的","part": "B","examples": ["Genetically modified crops remain controversial despite decades of research showing no evidence of harm to human health.","The proposal to introduce a congestion charge in the city centre proved highly controversial among local businesses and commuters."],"col": ["highly controversial","controversial issue","controversial decision","controversial topic","controversial claim","controversial policy","prove controversial","controversial figure"],"syn": [{"w": "contentious","n": "強調引發爭議和分歧，比controversial更正式"},{"w": "disputed","n": "強調被多方爭議或質疑，比controversial更強調事實層面"},{"w": "debatable","n": "強調有討論空間，語氣比controversial更輕"}],"note": "controversial是IELTS寫作中必備的核心詞彙，幾乎可用於所有爭議性主題；contentious是其高分替換詞，能有效提升寫作詞彙分數。"},{"word": "crucial","ipa": "/ˈkruːʃəl/","pos": "adj","zh": "至關重要的","part": "B","examples": ["International cooperation is crucial if the global community is to achieve meaningful reductions in greenhouse gas emissions.","The role of parental involvement in early childhood education is crucial in shaping children's lifelong attitudes towards learning."],"col": ["crucial role","crucial factor","absolutely crucial","crucial importance","crucial step","crucial decision","prove crucial","crucial to success"],"syn": [{"w": "vital","n": "強調不可或缺的重要性，與crucial幾乎同義"},{"w": "essential","n": "強調必要性，比crucial更廣用，也常作名詞"},{"w": "pivotal","n": "強調作為轉捩點的關鍵作用，比crucial更強調時間節點"}],"note": "crucial是IELTS寫作中最常見的形容詞之一；為避免重複，可替換為pivotal、indispensable或fundamental，視語境而定。"},{"word": "essential","ipa": "/ɪˈsenʃəl/","pos": "adj","zh": "必要的","part": "B","examples": ["Access to clean water is an essential human right that billions of people around the world still lack.","Critical thinking skills are increasingly essential in an era when misinformation spreads rapidly through social media."],"col": ["essential service","essential role","essential skill","absolutely essential","essential nutrient","essential worker","essential element","essential component"],"syn": [{"w": "fundamental","n": "強調作為基礎和根本的重要性，比essential更強調原則層面"},{"w": "indispensable","n": "強調難以缺少，暗示若缺少將造成嚴重問題"},{"w": "necessary","n": "最廣義，僅指有需要，比essential的必要程度更低"}],"note": "essential在IELTS中使用頻率極高；essential workers（基本勞動者）在疫情後成為重要社會概念，常作為Task 2的例子使用。"},{"word": "natural","ipa": "/ˈnætʃərəl/","pos": "adj","zh": "天然的；自然的","part": "B","examples": ["Consumers are increasingly seeking out natural ingredients in food products, cosmetics, and cleaning products.","The natural environment provides a range of services to human society, including air and water purification, that are difficult to value economically."],"col": ["natural resource","natural environment","natural disaster","natural process","natural ingredient","natural habitat","natural remedy","natural world"],"syn": [{"w": "organic","n": "強調符合有機標準，不含人工合成物質，有認證意涵"},{"w": "native","n": "強調土生土長、原產於某地，比natural更具地理特指性"},{"w": "innate","n": "強調與生俱來的特質或能力，比natural更強調先天性"}],"note": "natural適用於幾乎所有IELTS主題；natural disaster和natural resources是必記搭配，不可誤說nature disaster。"},{"word": "organic","ipa": "/ɔːˈɡænɪk/","pos": "adj","zh": "有機的","part": "B","examples": ["The global market for organic food products has grown substantially as consumers become more conscious of the health and environmental implications of their choices.","Organic farming methods typically produce lower yields than conventional intensive agriculture but require far fewer synthetic inputs."],"col": ["organic food","organic farming","certified organic","organic produce","organic method","organic growth","organic chemistry","fully organic"],"syn": [{"w": "natural","n": "強調無人工添加，比organic更廣義，不需認證"},{"w": "eco-friendly","n": "強調對環境友善，比organic更廣，也包含非農業產品"},{"w": "sustainable","n": "強調長期可持續性，比organic更強調整體生產系統"}],"note": "organic在農業語境中特指符合有機認證標準的生產方式；在化學語境中指含碳的有機化合物；IELTS兩種語境均可出現，需靠主題判斷。"},{"word": "genetically modified","ipa": "/dʒəˌnetɪkli ˈmɒdɪfaɪd/","pos": "adj","zh": "基因改造","part": "B","examples": ["The cultivation of genetically modified crops remains banned in several European countries despite widespread use in the Americas.","Supporters argue that genetically modified organisms could help address global food shortages by producing higher yields with fewer resources."],"col": ["genetically modified crop","genetically modified organism","genetically modified food","ban on genetically modified","genetically modified seed","produce genetically modified","genetically modified technology","genetically modified strain"],"syn": [{"w": "GM","n": "最常用的縮寫，在新聞和非正式文章中廣泛使用"},{"w": "transgenic","n": "更精確的科學術語，指含有外源基因的生物"},{"w": "bioengineered","n": "強調通過生物工程技術改造，是genetically modified的同義詞"}],"note": "genetically modified（GM）是IELTS科技倫理類核心議題；GMO是必記縮寫，常與ethical concerns和food security並列討論。"},{"word": "petrochemicals","ipa": "/ˌpetrəʊˈkemɪkəlz/","pos": "noun","zh": "石化產品","part": "A","examples": ["Many everyday plastics and synthetic materials are derived from petrochemicals, making them heavily dependent on the oil industry.","The transition away from petrochemicals is seen as essential for achieving meaningful reductions in industrial carbon emissions."],"col": ["petrochemical industry","petrochemical plant","petrochemical products","derived from petrochemicals","petrochemical refinery","petrochemical sector","petrochemical emissions","transition from petrochemicals"],"syn": [{"w": "fossil fuel derivatives","n": "強調其來源於化石燃料，比petrochemicals更描述性"},{"w": "synthetic chemicals","n": "強調人工合成的化學物質，比petrochemicals更廣義"},{"w": "industrial chemicals","n": "泛指工業生產所用的化學品"}],"note": "petrochemicals是IELTS能源和環境類文章的核心詞彙；在討論從化石燃料轉型的議題中，petrochemical industry的重組是重要議題。"},{"word": "absorb","ipa": "/əbˈzɔːb/","pos": "verb","zh": "吸收","part": "C","examples": ["Plants absorb carbon dioxide during photosynthesis, making them a vital component of the Earth's carbon cycle.","New employees typically require several months to fully absorb the company culture and understand informal workplace norms."],"col": ["absorb energy","absorb carbon dioxide","absorb information","absorb shock","absorb costs","absorb moisture","fully absorb","absorb into"],"syn": [{"w": "soak up","n": "最口語，強調大量吸收液體或資訊"},{"w": "assimilate","n": "強調消化吸收並整合，多用於資訊或文化"},{"w": "incorporate","n": "強調將某物融入整體，比absorb更強調整合的結果"}],"note": "absorb在物理化學和比喻語境都常見；IELTS環境類文章中，forests absorbing CO₂是描述碳匯的核心表達。"},{"word": "contaminate","ipa": "/kənˈtæmɪneɪt/","pos": "verb","zh": "汙染","part": "C","examples": ["Industrial runoff has contaminated several river systems in the region, threatening both ecosystems and drinking water supplies.","A single infected batch of products can contaminate an entire supply chain, with severe commercial and public health consequences."],"col": ["contaminate water","contaminate food","contaminate soil","heavily contaminate","contaminate supply","contaminate environment","contaminate a sample","inadvertently contaminate"],"syn": [{"w": "pollute","n": "最廣義，適用於空氣、水、土壤等各類環境污染"},{"w": "taint","n": "較口語，可指食物或名譽的污染，比contaminate更廣義"},{"w": "infect","n": "特指生物性病原體的污染，偏醫療語境"}],"note": "contaminate強調使無害物質受到有害物質污染；pollute更廣義，不一定需要特定污染源。IELTS環境類文章中兩者都是核心詞彙。"},{"word": "release","ipa": "/rɪˈliːs/","pos": "verb","zh": "釋放","part": "C","examples": ["The combustion of coal releases significant quantities of sulphur dioxide, contributing to acid rain and respiratory illness.","The government released a comprehensive report detailing the findings of its two-year investigation into financial misconduct."],"col": ["release energy","release data","release a statement","release carbon","release a prisoner","officially release","release into environment","release information"],"syn": [{"w": "emit","n": "特指氣體或能量的排放，比release更精確的科學術語"},{"w": "discharge","n": "強調從容器或系統中排出，多用於工業或醫療語境"},{"w": "publish","n": "特指發布文件或資訊，是release在資訊語境中的替換詞"}],"note": "release是多義動詞：release gases（排放）、release a report（發布）、release a prisoner（釋放）；IELTS中需靠語境判斷含義。"},{"word": "harbour","ipa": "/ˈhɑːbə/","pos": "noun","zh": "港口；懷有（思想）","part": "A","examples": ["The ancient harbour once served as the gateway through which trade goods from across the Mediterranean would flow.","Tropical rainforests harbour an extraordinary diversity of species, many of which have yet to be scientifically documented."],"col": ["safe harbour","natural harbour","harbour town","harbour front","harbour master","harbour facilities","harbour wall","industrial harbour"],"syn": [{"w": "port","n": "強調商業和工業用途，比harbour更正式的航運術語"},{"w": "haven","n": "強調安全庇護所，可比喻性地指安全的地方"},{"w": "bay","n": "特指地理上的海灣，不一定是人造或商用的港口"}],"note": "harbour既作名詞（港灣）也作動詞（容納、藏匿），如harbour doubts（心存疑慮）；IELTS閱讀中兩種用法都可能出現，需注意詞性變化。"},{"word": "fascinating","ipa": "/ˈfæsɪneɪtɪŋ/","pos": "adj","zh": "迷人的","part": "B","examples": ["The deep-sea ecosystem remains one of the most fascinating and least explored environments on Earth.","It is fascinating to observe how rapidly languages evolve when communities become isolated from one another over generations."],"col": ["utterly fascinating","find it fascinating","fascinatingly complex","truly fascinating","fascinating discovery","fascinating research","fascinating phenomenon","fascinating insight"],"syn": [{"w": "captivating","n": "強調完全吸引注意力，使人無法移開視線"},{"w": "intriguing","n": "強調引發好奇心和探究欲，比fascinating更強調神秘感"},{"w": "compelling","n": "強調強烈吸引並難以抵抗，可用於論點或故事"}],"note": "fascinating在IELTS口語和寫作中都非常常用；在學術寫作中，intriguing或remarkable是更適合的替換詞，因為fascinating略顯口語化。"},{"word": "immeasurable","ipa": "/ɪˈmeʒərəbəl/","pos": "adj","zh": "無法衡量的","part": "B","examples": ["The immeasurable complexity of the human brain continues to challenge even the most sophisticated artificial intelligence systems.","The cultural loss caused by the destruction of the library was described as immeasurable by scholars worldwide."],"col": ["immeasurable value","immeasurable complexity","immeasurable benefit","of immeasurable importance","immeasurable harm","virtually immeasurable","immeasurable scale","immeasurable contribution"],"syn": [{"w": "incalculable","n": "強調無法計算的龐大程度，與immeasurable幾乎同義"},{"w": "boundless","n": "強調無邊界、無限制的廣大"},{"w": "enormous","n": "最廣義且口語，泛指非常大，比immeasurable的誇張程度低"}],"note": "immeasurable強調規模或影響大到無法測量；IELTS高分寫作中用此詞替換very large或huge，能有效展示詞彙廣度，提升Lexical Resource分數。"},{"word": "imperceptible","ipa": "/ˌɪmpəˈseptɪbəl/","pos": "adj","zh": "察覺不到的","part": "B","examples": ["The effects of climate change may seem imperceptible on a day-to-day basis, but accumulate to produce dramatic long-term consequences.","The difference in performance between the two processors was imperceptible to the average user under normal operating conditions."],"col": ["almost imperceptible","imperceptible change","imperceptible shift","virtually imperceptible","nearly imperceptible","imperceptible difference","imperceptible to the eye","imperceptible improvement"],"syn": [{"w": "subtle","n": "強調微妙難以察覺，但比imperceptible更廣義"},{"w": "negligible","n": "強調小到可以忽略不計，比imperceptible更強調無關重要"},{"w": "infinitesimal","n": "最正式，強調極小到近乎無限小"}],"note": "imperceptible強調無法被感知；描述氣候變化時，imperceptible short-term changes是IELTS環境類文章的有效表達方式。"},{"word": "minuscule","ipa": "/ˈmɪnəskjuːl/","pos": "adj","zh": "極微小的","part": "B","examples": ["The amount of active ingredient in the medication represents a minuscule fraction of the total tablet weight.","Even a minuscule reduction in the percentage of oxygen in the atmosphere would have catastrophic consequences for most forms of life."],"col": ["minuscule amount","minuscule fraction","minuscule proportion","seem minuscule","minuscule difference","minuscule change","minuscule scale","minuscule particle"],"syn": [{"w": "tiny","n": "最口語，泛指非常小"},{"w": "minute","n": "正式且精確，強調極其微小的程度"},{"w": "microscopic","n": "強調小到需要顯微鏡才能看見，比minuscule更科學"}],"note": "minuscule的常見拼寫錯誤是miniscule（錯誤）；在IELTS學術寫作中，可用minuscule替換tiny以提升詞彙分數，展示更廣泛的詞彙量。"},{"word": "vast","ipa": "/vɑːst/","pos": "adj","zh": "巨大的","part": "B","examples": ["The vast majority of scientists accept that human activity is the primary driver of contemporary climate change.","The Amazon rainforest covers a vast area of South America and plays a critical role in regulating the global climate."],"col": ["vast majority","vast area","vast amount","vast network","vast difference","vast improvement","vast resources","vast scale"],"syn": [{"w": "enormous","n": "強調體積或數量的龐大，比vast更強調尺寸"},{"w": "extensive","n": "強調範圍廣，比vast更強調覆蓋面積或涉及範圍"},{"w": "immense","n": "強調令人印象深刻的龐大規模，與vast幾乎同義"}],"note": "the vast majority（絕大多數）是IELTS學術寫作中比most更精確的高分替換；vast是非常實用的修飾詞，幾乎適用於所有需要強調規模的語境。"},{"word": "cyberspace","ipa": "/ˈsaɪbəspeɪs/","pos": "noun","zh": "網路空間","part": "A","examples": ["Governments are increasingly preoccupied with the challenge of regulating behaviour in cyberspace without undermining civil liberties.","Cybercriminals exploit vulnerabilities in cyberspace to steal data from corporations and individuals alike."],"col": ["cyberspace security","exist in cyberspace","cyberspace regulation","cyberspace threat","navigate cyberspace","virtual cyberspace","cyberspace crime","cyberspace governance"],"syn": [{"w": "online world","n": "最口語，泛指網路上的世界"},{"w": "digital realm","n": "較正式，強調數位化的空間或領域"},{"w": "internet","n": "最廣義，指連接全球的實體網路基礎設施"}],"note": "cyberspace強調網路作為一個虛擬空間的概念；IELTS科技類寫作中，cyberspace governance（網路空間治理）和cybersecurity是近年高頻議題。"},{"word": "expense","ipa": "/ɪkˈspens/","pos": "noun","zh": "花費；支出","part": "A","examples": ["The development of new renewable energy technologies involves significant upfront expense, though costs typically fall as production scales up.","Many environmental benefits were achieved at the expense of economic growth in the region."],"col": ["at the expense of","business expenses","travel expense","medical expense","expense account","considerable expense","operational expense","at great expense"],"syn": [{"w": "cost","n": "最廣義，泛指任何花費或代價"},{"w": "expenditure","n": "更正式，指特定的支出金額，常用於政府或商業財務"},{"w": "outlay","n": "強調初期的大筆投入，比expense更強調一次性支出"}],"note": "at the expense of（以…為代價）是IELTS論述trade-offs（取捨）時的核心表達；expense和cost幾乎可互換，但expenditure更偏財務報告用語。"},{"word": "fabric","ipa": "/ˈfæbrɪk/","pos": "noun","zh": "織物；結構","part": "A","examples": ["The fashion industry is exploring alternatives to conventional fabrics, including materials derived from recycled plastics and agricultural waste.","Social cohesion forms the very fabric of a functioning democratic society."],"col": ["synthetic fabric","natural fabric","fabric design","the fabric of society","fabric quality","woven fabric","sustainable fabric","fabric production"],"syn": [{"w": "material","n": "最廣義，泛指任何可用的物質或布料"},{"w": "textile","n": "特指紡織品，比fabric更偏工業和貿易語境"},{"w": "cloth","n": "最口語，泛指任何布料"}],"note": "fabric既指布料也可比喻性地指社會或制度的基礎結構（the fabric of society）；IELTS時尚和社會類文章中兩種用法都常出現。"},{"word": "fibre","ipa": "/ˈfaɪbə/","pos": "noun","zh": "纖維","part": "A","examples": ["A diet rich in dietary fibre has been consistently linked to reduced risk of colorectal cancer and improved digestive health.","Carbon fibre composites have revolutionised the aerospace industry due to their exceptional strength-to-weight ratio."],"col": ["optical fibre","carbon fibre","dietary fibre","natural fibre","synthetic fibre","glass fibre","fibre optic","fibre content"],"syn": [{"w": "thread","n": "強調細長的絲狀結構，比fibre更強調可紡織性"},{"w": "filament","n": "特指極細的線狀物，如燈泡燈絲或人造纖維"},{"w": "strand","n": "強調單根纖維或繩線，比fibre更具體"}],"note": "fibre在英式英語中同時指膳食纖維（dietary fibre）和工業纖維（carbon fibre）；IELTS兩種語境都常見，需靠主題判斷。"},{"word": "foam","ipa": "/fəʊm/","pos": "noun","zh": "泡沫","part": "A","examples": ["Memory foam, originally developed by NASA, is now widely used in mattresses, car seats, and prosthetics.","Researchers are developing biodegradable foam packaging as an alternative to the non-recyclable polystyrene variants currently in widespread use."],"col": ["memory foam","foam packaging","foam rubber","shaving foam","fire-fighting foam","foam insulation","foam material","sea foam"],"syn": [{"w": "froth","n": "特指液體表面的泡沫，比foam更強調液態氣泡"},{"w": "lather","n": "特指肥皂或洗髮乳產生的泡沫"},{"w": "bubbles","n": "最廣義，泛指任何氣泡，比foam更口語"}],"note": "foam作為材料時多指泡棉或泡沫材料；IELTS材料科學和環保類文章中，biodegradable foam（可生物降解泡棉）替代polystyrene（保麗龍）是常見討論主題。"},{"word": "log","ipa": "/lɒɡ/","pos": "noun","zh": "圓木；記錄","part": "A","examples": ["The illegal logging of old-growth forest for timber export remains a major driver of deforestation in several tropical regions.","Engineers maintain a detailed log of all maintenance activities performed on critical infrastructure components."],"col": ["log cabin","log record","activity log","illegal logging","timber log","system log","keep a log","log of events"],"syn": [{"w": "record","n": "最廣義，泛指任何記錄的文件或資料"},{"w": "timber","n": "作為原木義的同義詞，但timber更強調木材的商業用途"},{"w": "journal","n": "特指定期記錄的日誌或日記"}],"note": "log有雙重含義：原木與記錄；IELTS環境類文章中，illegal logging（非法伐木）是deforestation的核心相關詞彙。"},{"word": "marble","ipa": "/ˈmɑːbəl/","pos": "noun","zh": "大理石","part": "A","examples": ["The Pantheon in Rome features a magnificent interior decorated with Italian marble that has retained its lustre for nearly two thousand years.","Marble is increasingly being replaced by synthetic alternatives in construction projects due to its high cost and environmental impact."],"col": ["Italian marble","marble floor","marble statue","white marble","polished marble","marble quarry","marble tile","carved in marble"],"syn": [{"w": "stone","n": "最廣義，泛指任何岩石材料"},{"w": "granite","n": "另一種常用的硬質建築石材，比marble更耐用"},{"w": "limestone","n": "大理石的前身，是較軟質的碳酸鈣岩石"}],"note": "marble在IELTS建築和文化遺產類閱讀中常作為珍貴材料出現；Carrara marble（卡拉拉大理石）是最著名的品種，被文藝復興藝術家廣泛使用。"},{"word": "patent","ipa": "/ˈpeɪtənt/","pos": "noun","zh": "專利","part": "A","examples": ["Pharmaceutical companies invest heavily in research, knowing that patents will protect their exclusive right to produce a drug for up to twenty years.","The technology giant was found to have infringed several patents held by a smaller competitor, resulting in a substantial damages award."],"col": ["file a patent","patent application","patent law","patent holder","patent infringement","hold a patent","patent protection","intellectual property patent"],"syn": [{"w": "intellectual property","n": "更廣義，包含專利、版權、商標等所有知識產權"},{"w": "copyright","n": "特指對文學、藝術或音樂作品的版權保護"},{"w": "trademark","n": "特指品牌名稱或標誌的法律保護"}],"note": "patent是IELTS科技商業類核心詞彙；patent protection（專利保護）和patent infringement（侵犯專利）是常見考點。"},{"word": "pillar","ipa": "/ˈpɪlə/","pos": "noun","zh": "柱子；支柱","part": "A","examples": ["Education, healthcare, and social security are often described as the three pillars of a modern welfare state.","The ancient temple's marble pillars have withstood earthquakes and centuries of weathering with remarkably little deterioration."],"col": ["stone pillar","pillar of society","support pillar","main pillar","structural pillar","pillar of democracy","central pillar","key pillar"],"syn": [{"w": "column","n": "特指圓柱形的建築支撐，與pillar幾乎同義"},{"w": "cornerstone","n": "比喻義：指某系統或社會的基石，強調奠基作用"},{"w": "foundation","n": "強調基礎和根本，比pillar更強調底部的支撐"}],"note": "pillar常用於比喻義，如pillars of democracy（民主的支柱）；IELTS社會類寫作中，描述社會制度的核心組成時，pillar是高分詞彙。"},{"word": "plank","ipa": "/plæŋk/","pos": "noun","zh": "厚木板","part": "A","examples": ["Traditional wooden houses in the region are constructed from thick planks of locally sourced timber.","Environmental protection is a key plank of the party's election platform, appealing to younger, climate-conscious voters."],"col": ["thick plank","wooden plank","policy plank","plank of wood","floor plank","main plank","plank of a platform","structural plank"],"syn": [{"w": "board","n": "泛指板材，比plank更廣義，不一定是木質"},{"w": "policy platform","n": "比喻義：指政治主張或政策方針的整體架構"},{"w": "timber","n": "作為木材義的上位詞，涵蓋plank在內的各種木材"}],"note": "plank有雙重含義：木板（建材）和政策要點（political plank）；IELTS政治類閱讀中偶見policy plank的比喻義，需注意語境判斷。"},{"word": "polyester","ipa": "/ˌpɒliˈestə/","pos": "noun","zh": "聚酯纖維","part": "A","examples": ["Polyester is one of the world's most widely produced synthetic fabrics, used in everything from clothing to industrial filtration.","Environmental campaigners have raised concerns about microplastic pollution caused by the washing of polyester garments."],"col": ["polyester fabric","polyester fibre","recycled polyester","polyester blend","polyester clothing","polyester production","polyester waste","pure polyester"],"syn": [{"w": "synthetic fabric","n": "廣義，泛指所有人工合成的紡織材料"},{"w": "nylon","n": "另一種常見合成纖維，與polyester同屬合成材料"},{"w": "artificial fibre","n": "泛指人工製造的纖維材料，與natural fibre相對"}],"note": "polyester是IELTS環境和時尚類文章的常見詞彙；microplastics（微塑膠）污染與polyester衣物清洗的關聯是近年重要考點。"},{"word": "prop","ipa": "/prɒp/","pos": "noun","zh": "道具；支撐物","part": "A","examples": ["Stage props in the theatrical production were sourced entirely from recycled materials as part of the company's environmental commitment.","Foreign investment has long served as a vital economic prop for countries with limited domestic capital."],"col": ["stage prop","film prop","prop up economy","prop and support","theatrical prop","visual prop","prop design","economy prop"],"syn": [{"w": "support","n": "最廣義，泛指任何形式的支撐或支持"},{"w": "brace","n": "強調結構性的支撐或加固裝置，偏建築語境"},{"w": "bolster","n": "比喻義：強調加強或支撐某事物，偏政策語境"}],"note": "prop既可指物理支撐物也可作動詞「支撐」；IELTS財經類文章中prop up是描述政府干預的常用表達。"},{"word": "technique","ipa": "/tekˈniːk/","pos": "noun","zh": "技巧；技術","part": "A","examples": ["Modern diagnostic imaging techniques enable doctors to detect diseases at a much earlier stage than was previously possible.","The chef spent years perfecting his technique for creating delicate pastry with consistent texture and flavour."],"col": ["imaging technique","surgical technique","research technique","advanced technique","innovative technique","standard technique","technique development","mathematical technique"],"syn": [{"w": "method","n": "最廣義，指達成目標的方式，比technique更強調程序"},{"w": "approach","n": "強調解決問題的整體策略，比technique更宏觀"},{"w": "procedure","n": "偏正式，強調按步驟執行的標準化操作"}],"note": "technique強調執行某任務所需的具體技能和方式；method偏強調系統化的程序。IELTS科學和教育類文章中technique非常高頻，幾乎出現在每個單元。"},{"word": "thread","ipa": "/θred/","pos": "noun","zh": "線；思緒","part": "A","examples": ["The documentary follows a common thread running through the lives of three generations of women in the same family.","Developments in nano-scale thread technology are enabling the creation of fabrics with extraordinary strength and electrical conductivity."],"col": ["common thread","thread of argument","sewing thread","lose the thread","thread count","cotton thread","golden thread","connecting thread"],"syn": [{"w": "strand","n": "可指單根細線，也可比喻思路或議題的一條線索"},{"w": "theme","n": "比喻義：指貫穿始終的主題或主旨"},{"w": "yarn","n": "特指紡紗用的較粗纖維紗，比thread更強調紡織"}],"note": "thread既是物理的線，也可作比喻（a common thread）指貫穿各事物的共同主題；IELTS閱讀中identifying the common thread是重要技能。"},{"word": "timber","ipa": "/ˈtɪmbə/","pos": "noun","zh": "木材","part": "A","examples": ["The construction industry's growing reliance on engineered timber as a sustainable alternative to steel and concrete is transforming urban architecture.","Illegal trade in tropical timber continues to drive deforestation despite international agreements designed to prevent it."],"col": ["timber industry","tropical timber","timber production","engineered timber","timber frame","timber resources","sustainable timber","certified timber"],"syn": [{"w": "wood","n": "最廣義，泛指任何木質材料"},{"w": "lumber","n": "美式英語，特指鋸割好的木材，與timber幾乎同義"},{"w": "logs","n": "特指未加工的原木，是timber的原材料"}],"note": "timber指可商業利用的木材；IELTS環境類文章中，sustainable timber（永續木材）和deforestation（砍伐森林）是緊密相連的核心議題。"},{"word": "cutting-edge","ipa": "/ˌkʌtɪŋ ˈedʒ/","pos": "adj","zh": "最尖端的","part": "B","examples": ["The university's cutting-edge research facilities have attracted leading scientists from around the world.","Investing in cutting-edge manufacturing technology is essential for companies that wish to remain competitive in global markets."],"col": ["cutting-edge technology","cutting-edge research","cutting-edge facility","cutting-edge design","cutting-edge innovation","develop cutting-edge","cutting-edge solution","cutting-edge equipment"],"syn": [{"w": "state-of-the-art","n": "強調採用最先進技術，與cutting-edge幾乎同義"},{"w": "pioneering","n": "強調開創性和先驅性，比cutting-edge更強調歷史意義"},{"w": "groundbreaking","n": "強調突破性的創新，比cutting-edge更強調對現有局面的顛覆"}],"note": "cutting-edge和state-of-the-art幾乎可互換；IELTS科技類寫作中，這兩個詞替換simple advanced可顯著提升Lexical Resource分數。"},{"word": "futuristic","ipa": "/ˌfjuːtʃəˈrɪstɪk/","pos": "adj","zh": "未來派的","part": "B","examples": ["The architect's futuristic designs, featuring curved glass facades and integrated green spaces, have polarised opinion in the city.","What once seemed like futuristic fantasy, such as self-driving vehicles and AI medical diagnostics, is rapidly becoming everyday reality."],"col": ["futuristic design","futuristic technology","futuristic vision","futuristic city","futuristic concept","appear futuristic","futuristic-looking","futuristic architecture"],"syn": [{"w": "avant-garde","n": "強調前衛和先鋒，帶有藝術語境的意涵，源自法語"},{"w": "visionary","n": "強調具有遠見卓識，比futuristic更聚焦於思想而非外觀"},{"w": "innovative","n": "最廣義，強調創新，比futuristic少了未來科幻的色彩"}],"note": "futuristic帶有科幻感，常用於形容外觀或概念遠超當前時代；IELTS科技類文章中，once futuristic, now commonplace是描述技術演進的有效句型。"},{"word": "demolish","ipa": "/dɪˈmɒlɪʃ/","pos": "verb","zh": "拆除；推翻","part": "C","examples": ["Several Victorian-era buildings were demolished to make way for the new transport hub, sparking protests from heritage conservation groups.","The historian demolished the widely held assumption that the industrial revolution was an unambiguous driver of social progress."],"col": ["demolish a building","demolish an argument","completely demolish","demolish old structures","plan to demolish","demolish walls","demolish the opposition","demolish theories"],"syn": [{"w": "tear down","n": "最口語，強調拆毀建築物"},{"w": "dismantle","n": "強調有計畫地拆解，比demolish更有條理"},{"w": "destroy","n": "最廣義，泛指任何形式的摧毀"}],"note": "demolish既可指物理上拆除建築（demolish a building），也可比喻駁倒論點（demolish an argument）；後者在IELTS學術寫作中是高分表達。"},{"word": "dye","ipa": "/daɪ/","pos": "verb","zh": "染色","part": "C","examples": ["The textile industry is one of the world's most significant polluters, with large quantities of synthetic dyes contaminating waterways near production facilities.","Archaeologists discovered ancient fabrics dyed with natural pigments that had retained their colour remarkably well after thousands of years."],"col": ["dye fabric","dye hair","natural dye","synthetic dye","dye with colour","dye industry","textile dye","dye process"],"syn": [{"w": "colour","n": "最廣義，泛指為某物添加顏色，不強調化學過程"},{"w": "tint","n": "強調添加淡淡的色調，比dye更輕微"},{"w": "stain","n": "強調用液體為材料上色，有時含有永久污漬的意涵"}],"note": "dye在IELTS環境和紡織類文章中常出現；synthetic dyes（合成染料）對水體的污染是fast fashion環境影響的重要議題。"},{"word": "innovate","ipa": "/ˈɪnəveɪt/","pos": "verb","zh": "創新","part": "C","examples": ["Companies that fail to innovate risk being overtaken by more agile competitors who are quicker to adapt to changing market conditions.","The public sector can innovate effectively when given the freedom and resources to experiment with new approaches to service delivery."],"col": ["innovate rapidly","continuously innovate","innovate to survive","innovate in technology","innovate within constraints","drive to innovate","innovate process","innovate solutions"],"syn": [{"w": "pioneer","n": "強調開創新領域，比innovate更強調第一個做某事的歷史意義"},{"w": "revolutionise","n": "強調徹底改變現有局面，比innovate影響更深遠"},{"w": "modernise","n": "強調以新方法取代舊方法，比innovate更強調更新換代"}],"note": "innovate是IELTS商業和科技類文章的核心動詞；innovation（名詞）比動詞形式更常見，是Task 2討論科技和經濟的必備詞彙。"},{"word": "amalgamate","ipa": "/əˈmælɡəmeɪt/","pos": "verb","zh": "合併；整合","part": "C","examples": ["The two regional health authorities were amalgamated into a single body to improve coordination and eliminate duplication of services.","The composer's work successfully amalgamates Western classical traditions with Japanese musical elements to create a unique hybrid style."],"col": ["amalgamate companies","amalgamate ideas","amalgamate into one","amalgamate with another","completely amalgamate","amalgamate departments","amalgamate cultures","amalgamate systems"],"syn": [{"w": "merge","n": "最廣義，指兩個或以上實體合而為一，比amalgamate更口語"},{"w": "consolidate","n": "強調整合以增強實力，比amalgamate更強調效率提升"},{"w": "integrate","n": "強調將不同部分融合成有機整體，比amalgamate更強調和諧融合"}],"note": "amalgamate比merge更書面正式；IELTS商業類文章中，company mergers and amalgamations是常見考點，與consolidation並列使用。"},{"word": "cloning","ipa": "/ˈkləʊnɪŋ/","pos": "noun","zh": "複製；克隆","part": "A","examples": ["The successful cloning of Dolly the sheep in 1996 sparked intense global debate about the ethical boundaries of genetic science.","Therapeutic cloning, which aims to produce stem cells for medical treatment, remains highly controversial despite its potential benefits."],"col": ["human cloning","animal cloning","therapeutic cloning","cloning technology","genetic cloning","cloning debate","cloning process","DNA cloning"],"syn": [{"w": "replication","n": "強調精確複製，可用於生物或數位語境，比cloning更廣義"},{"w": "duplication","n": "強調製造副本的行為，語境更廣泛"},{"w": "reproduction","n": "最廣義，指任何形式的複製或繁殖"}],"note": "cloning是IELTS科技倫理類文章的核心詞彙；human cloning（人類克隆）的倫理爭議（ethical implications）是Task 2的常見高分議題。"},{"word": "ongoing","ipa": "/ˈɒnɡəʊɪŋ/","pos": "adj","zh": "進行中的","part": "B","examples": ["The ongoing debate about the ethics of artificial intelligence reflects deeper societal anxieties about the pace of technological change.","Researchers are monitoring the ongoing effects of climate change on Arctic ice coverage through satellite imagery."],"col": ["ongoing research","ongoing debate","ongoing process","ongoing challenge","ongoing conflict","ongoing investigation","ongoing development","ongoing effort"],"syn": [{"w": "continuous","n": "強調不間斷地持續，比ongoing更強調連續性"},{"w": "sustained","n": "強調在一段時間內維持的努力或狀態"},{"w": "persistent","n": "強調頑強持續，有時含有令人惱火的意涵"}],"note": "ongoing是IELTS學術寫作中非常實用的詞彙，可修飾research、debate、challenge等多種名詞；與current類似但更強調動態持續的過程。"}]
};
const PART_LABELS = {
  A:'Part A · Nouns', B:'Part B · Adjectives',
  C:'Part C · Verbs',  D:'Part D · Phrases'
};
const SK = 'ielts_u5';
let cur=0, mode='browse', flipped=false, known=[], onIntro=true;
function load(){ try{ known=JSON.parse(localStorage.getItem(SK)||'[]'); }catch(e){known=[];} }
function save(){ try{ localStorage.setItem(SK,JSON.stringify(known)); }catch(e){} }
function isKnown(i){ return known.includes(i); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function updateDots(){
  const n=UNIT.words.length, max=Math.min(n,30);
  let h='';
  for(let i=0;i<max;i++){
    const c=(!onIntro&&i===cur)?'dot cur':isKnown(i)?'dot known':'dot';
    h+='<div class="'+c+'"></div>';
  }
  if(n>max) h+='<span style="font-family:var(--fm);font-size:.5rem;color:var(--g400);margin-left:2px;">+'+(n-max)+'</span>';
  document.getElementById('dots').innerHTML=h;
}
function renderIntro(){
  document.getElementById('counter').textContent='Introduction';
  document.getElementById('known-badge').textContent='';
  document.getElementById('prog-fill').style.width='0%';
  document.getElementById('action-count').textContent='';
  document.getElementById('know-btn').style.display='none';
  document.getElementById('review-btn').style.display='none';
  const f=document.getElementById('front-face');
  f.className='face front intro-face';
  f.innerHTML=
    '<div class="ic-eyebrow">IELTS Core Thematic Vocabulary · Chapter 5 of 10</div>'+
    '<div class="ic-title">Science, Technology & Materials</div>'+
    '<div class="ic-zh">科學研究、科技與材料</div>'+
    '<div class="ic-rule"></div>'+
    '<div class="ic-body">'+
      '<div>'+
        '<div class="ic-sec-label">關於本章</div>'+
        '<div class="ic-about">本章收錄 54 個核心詞彙。每個詞條包含搭配詞與中文解釋。</div>'+
      '</div>'+
      '<div>'+
        '<div class="ic-sec-label">使用方式</div>'+
        '<div class="ic-steps">'+
          '<div class="ic-step"><span class="ic-tag">Browse</span>正面顯示英文單字，翻面查看中文與搭配詞。</div>'+
          '<div class="ic-step"><span class="ic-tag">Quiz</span>正面顯示中文，翻面前先回想英文，訓練主動回憶。</div>'+
          '<div class="ic-step"><span class="ic-tag">Know it ✓</span>標記已掌握。<span class="ic-tag">Review ↺</span>重新複習。</div>'+
          '<div class="ic-step"><span class="ic-tag">快捷鍵</span>← → 切換卡片 &nbsp;·&nbsp; F 翻轉 &nbsp;·&nbsp; K 標記</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="ic-hint">按 Next → 開始學習</div>';
  document.getElementById('back-face').innerHTML='';
  updateDots();
}
function render(){
  if(onIntro){ renderIntro(); return; }
  document.getElementById('front-face').className='face front';
  document.getElementById('know-btn').style.display='';
  document.getElementById('review-btn').style.display='';
  const w=UNIT.words[cur], n=UNIT.words.length, k=isKnown(cur);
  document.getElementById('counter').textContent=(cur+1)+' / '+n;
  document.getElementById('known-badge').textContent=known.length+' / '+n+' known';
  document.getElementById('prog-fill').style.width=((cur+1)/n*100)+'%';
  document.getElementById('action-count').textContent=known.length+'/'+n;
  const isQuiz=(mode==='quiz');
  document.getElementById('front-face').innerHTML=
    '<div class="f-top">'+
      '<div class="f-meta">'+
        '<div class="f-num">#'+String(cur+1).padStart(3,'0')+'</div>'+
        '<div class="f-part">'+(PART_LABELS[w.part]||'')+'</div>'+
      '</div>'+
      '<span class="f-known-mark'+(k?' vis':'')+'">✓ known</span>'+
    '</div>'+
    '<div class="f-body">'+
      '<div class="f-word">'+esc(isQuiz?w.zh:w.word)+'</div>'+
      (!isQuiz&&w.ipa?'<div class="f-ipa">'+esc(w.ipa)+'</div>':'')+
      (!isQuiz?'<div class="f-pos">'+esc(w.pos)+'</div>':'')+
    '</div>'+
    '<div class="f-hint">'+(isQuiz?'think → click to flip':'click to flip →')+'</div>';
  const exH=(w.examples||[]).map(e=>'<div class="b-ex">"'+esc(e)+'"</div>').join('');
  const colH=(w.col||[]).map(c=>'<div class="b-col">'+esc(c)+'</div>').join('');
  const synH=(w.syn||[]).map(s=>
    '<div class="b-syn-row"><div class="b-syn-w">'+esc(s.w)+'</div>'+
    '<div class="b-syn-n">（'+esc(s.n)+'）</div></div>'
  ).join('');
  const noteH=w.note?'<div class="b-sec"><div class="b-label">注意</div><div class="b-note">'+esc(w.note)+'</div></div>':'';
  let zhLine, metaLine='';
  if(isQuiz){
    zhLine='<div class="b-quiz-word">'+esc(w.word)+'</div>';
    metaLine='<div class="b-quiz-meta">'+esc(w.pos)+(w.ipa?' &nbsp;'+esc(w.ipa):'')+'</div>';
  } else {
    zhLine='<div class="b-zh">'+esc(w.zh)+'</div>';
  }
  document.getElementById('back-face').innerHTML=
    zhLine+metaLine+
    '<div class="b-rule"></div>'+
    '<div class="b-content">'+
      (exH?'<div class="b-sec"><div class="b-label">Examples</div>'+exH+'</div>':'')+
      (colH?'<div class="b-sec"><div class="b-label">搭配</div><div class="b-cols">'+colH+'</div></div>':'')+
      (synH?'<div class="b-sec"><div class="b-label">近義</div><div class="b-syns">'+synH+'</div></div>':'')+
      noteH+
    '</div>';
  updateDots();
}
function flip(){ if(onIntro) return; flipped=!flipped; document.getElementById('card').classList.toggle('flipped',flipped); }
function go(dir){
  if(onIntro&&dir>0){ onIntro=false;cur=0;flipped=false;document.getElementById('card').classList.remove('flipped');render();return; }
  if(!onIntro&&dir<0&&cur===0){ onIntro=true;flipped=false;document.getElementById('card').classList.remove('flipped');render();return; }
  if(onIntro) return;
  cur=Math.max(0,Math.min(UNIT.words.length-1,cur+dir));
  flipped=false;document.getElementById('card').classList.remove('flipped');render();
}
function markKnown(){ if(onIntro) return; if(!isKnown(cur)) known.push(cur); save();render(); setTimeout(function(){ if(cur<UNIT.words.length-1) go(1); },180); }
function markReview(){ if(onIntro) return; known=known.filter(function(x){return x!==cur;}); save();render(); }
function setMode(m){ mode=m;flipped=false;document.getElementById('card').classList.remove('flipped');document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.toggle('active',b.dataset.mode===m);});render(); }
document.getElementById('scene').addEventListener('click',flip);
document.getElementById('prev-btn').addEventListener('click',function(e){e.stopPropagation();go(-1);});
document.getElementById('next-btn').addEventListener('click',function(e){e.stopPropagation();go(1);});
document.getElementById('know-btn').addEventListener('click',function(e){e.stopPropagation();markKnown();});
document.getElementById('review-btn').addEventListener('click',function(e){e.stopPropagation();markReview();});
document.querySelectorAll('.mode-btn').forEach(function(b){ b.addEventListener('click',function(e){e.stopPropagation();setMode(b.dataset.mode);});});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='f'||e.key==='F') flip();
  else if(e.key==='k'||e.key==='K') markKnown();
});
load();render();
</script>
</body>
</html>
