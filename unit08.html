  src: "Units 8, 13 & 15",
  count: 55,
  words: [{"word": "bureaucrat","ipa": "/ˈbjʊərəkræt/","pos": "noun","zh": "官僚","part": "A","examples": ["Critics of the welfare system argue that too many bureaucrats are employed administering the paperwork rather than delivering direct support to those in need.","The reform package aimed to streamline government operations by reducing the number of layers of bureaucrats involved in routine decision-making."],"col": ["government bureaucrat","faceless bureaucrat","senior bureaucrat","dealing with bureaucrats","bureaucrat mindset","career bureaucrat","unelected bureaucrat","bureaucrat mentality"],"syn": [{"w": "official","n": "最廣義，泛指任何政府或機構的官員，比bureaucrat更中性"},{"w": "administrator","n": "強調行政事務的管理，比bureaucrat更正面"},{"w": "civil servant","n": "特指正式的政府公務員，比bureaucrat更精確"}],"note": "bureaucrat通常帶有貶義，暗示官員過於迷戀程序而缺乏效率；IELTS中bureaucracy和its red tape（繁文縟節）是批評政府效能的核心概念。"},{"word": "civil servant","ipa": "/ˌsɪvəl ˈsɜːvənt/","pos": "noun","zh": "公務員","part": "A","examples": ["A well-trained and impartial civil service is widely regarded as essential for the effective functioning of a democratic government.","Many civil servants have expressed concern that proposed budget cuts will make it impossible to maintain existing levels of public service delivery."],"col": ["senior civil servant","civil servant pay","career civil servant","civil service reform","permanent civil servant","train civil servants","civil servant recruitment","junior civil servant"],"syn": [{"w": "public servant","n": "強調服務公眾的職責，與civil servant幾乎同義但更偏重使命感"},{"w": "government employee","n": "最廣義，泛指任何政府雇員"},{"w": "state official","n": "強調代表國家的官方身分"}],"note": "civil servant是IELTS政府和公共行政類核心詞彙；civil service impartiality（公務員的中立性）是討論良好治理的重要原則，也是閱讀理解的常見考點。"},{"word": "community","ipa": "/kəˈmjuːnɪti/","pos": "noun","zh": "社區","part": "A","examples": ["Strong community ties have been shown to improve mental health outcomes and increase individuals' sense of belonging and purpose.","The development project was approved only after extensive consultation with the local community to address concerns about traffic and noise."],"col": ["local community","community centre","community service","sense of community","community engagement","rural community","online community","community spirit"],"syn": [{"w": "society","n": "最廣義，指整個社會群體，比community更大範圍"},{"w": "neighbourhood","n": "強調地理上臨近的居住區域，比community更具體"},{"w": "group","n": "最廣義，泛指任何有共同特徵的集合，比community更鬆散"}],"note": "community是IELTS最核心的社會類詞彙之一；community engagement（社區參與）和sense of community（社區歸屬感）是Task 2社會問題論述的必備搭配。"},{"word": "healthcare","ipa": "/ˈhelθkeə/","pos": "noun","zh": "醫療保健","part": "A","examples": ["Equitable access to healthcare is a fundamental right, yet millions of people globally are denied basic medical treatment due to cost or geographic barriers.","The ageing population in developed nations is placing unprecedented pressure on healthcare systems that were not designed to serve such large numbers of elderly patients."],"col": ["healthcare system","healthcare provision","healthcare workers","access to healthcare","healthcare costs","private healthcare","public healthcare","healthcare reform"],"syn": [{"w": "medical care","n": "強調具體的醫療護理行為，比healthcare更具體"},{"w": "health services","n": "強調提供的服務項目，是healthcare的組成部分"},{"w": "medical provision","n": "更正式，強調醫療資源的供給，多用於政策語境"}],"note": "healthcare是IELTS最高頻名詞之一；healthcare system、healthcare reform和access to healthcare是Task 2社會政策類的核心搭配。"},{"word": "mayor","ipa": "/meə/","pos": "noun","zh": "市長","part": "A","examples": ["The mayor announced an ambitious plan to make the city carbon neutral by 2040 through investment in public transport and green infrastructure.","In many countries, the office of mayor carries significant executive power over urban planning, policing, and local taxation."],"col": ["city mayor","elected mayor","deputy mayor","mayor's office","mayor of London","former mayor","mayor's decision","mayor-elect"],"syn": [{"w": "city leader","n": "最廣義，泛指城市的領導人"},{"w": "municipal head","n": "最正式，強調市政管理職位"},{"w": "local authority leader","n": "強調地方行政管理的職責"}],"note": "mayor在IELTS城市治理類文章中常與urban planning和local governance相關；不同國家mayor的角色和選舉方式差異很大，是比較政治類閱讀的潛在考點。"},{"word": "member of parliament","ipa": "/ˌmembər əv ˈpɑːləmənt/","pos": "noun","zh": "國會議員","part": "A","examples": ["Members of parliament are expected to represent the interests of their constituents while also contributing to national legislative debates.","The newly elected member of parliament pledged to prioritise housing affordability and environmental legislation during her first term."],"col": ["elected member of parliament","local member of parliament","senior member of parliament","member of parliament vote","member of parliament speak","constituency member of parliament","member of parliament resign","become a member of parliament"],"syn": [{"w": "MP","n": "最常用縮寫，在英式英語中廣泛使用"},{"w": "legislator","n": "最廣義，指任何立法機構的成員，不限於英國議會"},{"w": "representative","n": "強調代表選民的角色，比member of parliament更廣義"}],"note": "member of parliament（MP）是英國議會制度的核心角色；IELTS政治類文章中parliamentary democracy和the role of MPs in legislation是常見考點。"},{"word": "military service","ipa": "/ˌmɪlɪtri ˈsɜːvɪs/","pos": "noun","zh": "兵役","part": "A","examples": ["Several countries have reintroduced compulsory military service in response to perceived security threats from neighbouring states.","Advocates of compulsory military service argue that it fosters national unity and disciplines young people, though critics question its effectiveness."],"col": ["compulsory military service","national military service","complete military service","mandatory military service","military service requirement","exempt from military service","military service record","voluntary military service"],"syn": [{"w": "conscription","n": "強調強制性的徵兵制度，是military service的強制形式"},{"w": "national service","n": "較廣義，可包含軍事或非軍事形式的國家義務服務"},{"w": "armed forces duty","n": "強調對武裝力量的服務義務"}],"note": "military service是IELTS公民義務類核心詞彙；compulsory vs. voluntary military service的利弊比較是Task 2潛在議題，可從國家安全、個人自由和社會凝聚力論述。"},{"word": "notion","ipa": "/ˈnəʊʃən/","pos": "noun","zh": "觀念；概念","part": "A","examples": ["The notion that economic growth and environmental sustainability are mutually exclusive has been challenged by evidence from several rapidly developing economies.","Traditional notions of family structure have evolved significantly over the past half-century in response to social and legal changes."],"col": ["popular notion","widely held notion","challenge a notion","notion of fairness","notion of identity","dismiss a notion","romanticised notion","vague notion"],"syn": [{"w": "concept","n": "強調較為正式和系統化的思想構想，比notion更學術"},{"w": "idea","n": "最廣義，泛指任何想法，比notion更口語"},{"w": "perception","n": "強調基於感知和印象形成的看法，比notion更強調主觀性"}],"note": "notion在IELTS學術寫作中很有用；challenge the notion that...是高分句型，比idea更正式，是Task 2論述的好選擇。"},{"word": "old-age pension","ipa": "/ˌəʊld eɪdʒ ˈpenʃən/","pos": "noun","zh": "老人年金","part": "A","examples": ["The adequacy of old-age pensions is becoming a pressing political issue as populations age and the ratio of workers to retirees declines.","Many workers in the gig economy lack access to occupational pension schemes and must rely entirely on the state old-age pension."],"col": ["state old-age pension","old-age pension system","receive a pension","old-age pension reform","pension entitlement","pension age","private pension","pension funding"],"syn": [{"w": "retirement pension","n": "強調退休後的養老金，與old-age pension幾乎同義"},{"w": "social security","n": "美式英語，指包含養老金在內的社會保障體系"},{"w": "superannuation","n": "澳洲和英國部分語境，指強制儲蓄型退休金"}],"note": "old-age pension是IELTS老齡化和社會福利類核心詞彙；pension system sustainability是Task 2中與aging population緊密相關的重要議題。"},{"word": "safety net","ipa": "/ˈseɪfti net/","pos": "noun","zh": "安全網","part": "A","examples": ["The welfare state was designed to provide a safety net that prevents citizens from falling into destitution during periods of unemployment or illness.","Critics of means-tested benefits argue that they create a stigma that discourages eligible individuals from claiming the safety net they need."],"col": ["social safety net","financial safety net","safety net programme","provide a safety net","strengthen the safety net","remove the safety net","weaken safety net","basic safety net"],"syn": [{"w": "welfare system","n": "強調整體福利制度，是safety net的正式制度性表達"},{"w": "social protection","n": "最廣義，指所有形式的社會保障措施"},{"w": "support system","n": "比safety net更廣義，不一定指政府主導的系統"}],"note": "safety net是IELTS社會福利類文章的核心隱喻；means-tested vs. universal benefits（依財力審查 vs. 全民福利）是Task 2政策分析的重要維度。"},{"word": "social services","ipa": "/ˌsəʊʃəl ˈsɜːvɪsɪz/","pos": "noun","zh": "社會福利服務","part": "A","examples": ["Cuts to social services have left many of the most vulnerable members of society without adequate support.","Well-funded social services play a critical preventive role, intervening before family crises escalate into more serious and costly problems."],"col": ["cut social services","social services budget","access social services","social services department","underfunded social services","social services worker","provide social services","reformed social services"],"syn": [{"w": "welfare services","n": "強調以福利為核心的公共服務，與social services幾乎同義"},{"w": "public services","n": "最廣義，包含所有由政府提供的公共服務"},{"w": "community support","n": "強調社區層面的支持，比social services更廣義"}],"note": "social services是IELTS政府和社會類高頻詞彙；cuts to social services和its impact on vulnerable populations是Task 2社會政策論述的核心框架。"},{"word": "state","ipa": "/steɪt/","pos": "noun","zh": "國家；狀態","part": "A","examples": ["The appropriate role of the state in regulating the economy remains one of the most contested questions in political economy.","In federal systems, individual states retain considerable autonomy over areas such as education, healthcare, and criminal justice."],"col": ["welfare state","state control","role of state","state intervention","nation state","failed state","state funding","city state"],"syn": [{"w": "government","n": "強調執政機構，比state更偏指具體的行政體系"},{"w": "nation","n": "強調文化和身分認同的共同體，比state更廣義"},{"w": "country","n": "最廣義且口語，泛指一個國家的政治實體"}],"note": "state作名詞有三個含義：國家（the state）、政府（state funding）、地區（US states）；welfare state是IELTS社會類最重要的搭配。"},{"word": "unemployment benefit","ipa": "/ˌʌnɪmˈplɔɪmənt ˈbenɪfɪt/","pos": "noun","zh": "失業救濟金","part": "A","examples": ["Long-term recipients of unemployment benefit are often required to participate in job training programmes as a condition of continued eligibility.","The duration and generosity of unemployment benefits vary considerably between countries, reflecting different philosophical approaches to social welfare."],"col": ["receive unemployment benefit","claim unemployment benefit","unemployment benefit system","unemployment benefit period","unemployment benefit cuts","means-tested unemployment benefit","unemployment benefit eligibility","unemployment benefit reform"],"syn": [{"w": "jobseeker's allowance","n": "英國特定名稱，是unemployment benefit的具體政策名稱"},{"w": "welfare payment","n": "最廣義，泛指所有形式的政府救濟款項"},{"w": "dole","n": "非正式，特指英國的失業救濟金，有時帶有輕微貶義"}],"note": "unemployment benefit是IELTS社會政策類核心詞彙；benefits vs. incentives to work的矛盾是Task 2常見角度，涉及moral hazard（道德風險）概念。"},{"word": "leader of the opposition","ipa": "/ˈliːdə əv ðɪ ˌɒpəˈzɪʃn/","pos": "phrase","zh": "反對黨領袖","part": "D","examples": ["The leader of the opposition described the government's budget as deeply irresponsible and likely to worsen inequality over the long term.","In parliamentary democracies, the leader of the opposition plays a crucial role in holding the government accountable through debate and scrutiny."],"col": ["role of leader of opposition","leader of the opposition criticise","elected leader of opposition","leader of the opposition respond","shadow cabinet of opposition leader","official leader of opposition","leader of opposition speech","leader of the main opposition"],"syn": [{"w": "opposition leader","n": "縮短版，在日常新聞和寫作中最常用"},{"w": "shadow prime minister","n": "強調其作為潛在總理候選人的角色，英國語境最常用"},{"w": "chief critic","n": "非正式，強調批評和監督政府的功能"}],"note": "leader of the opposition是英國議會制度的核心角色；IELTS政治類閱讀中，parliamentary democracy的對抗性辯論機制是理解此角色的關鍵框架。"},{"word": "lose control of","ipa": "/luːz kənˈtrəʊl əv/","pos": "phrase","zh": "失去控制","part": "D","examples": ["The government was accused of having lost control of public spending during the economic boom years.","As misinformation spreads rapidly online, authorities are struggling not to lose control of the public health narrative."],"col": ["lose control of spending","lose control of situation","lose control of borders","lose control of narrative","lose control of process","rapidly lose control","completely lose control","risk losing control of"],"syn": [{"w": "relinquish authority over","n": "更正式，強調主動放棄控制，比lose control of更強調主動性"},{"w": "fail to manage","n": "強調管理失敗，比lose control of更強調無能"},{"w": "lose grip on","n": "強調控制力鬆動，是lose control of的口語替換"}],"note": "lose control of是IELTS政府治理類文章的常見表達；Task 2中可替換為fail to regulate effectively或be unable to contain以提升學術性。"},{"word": "means tested","ipa": "/ˌmiːnz ˈtestɪd/","pos": "phrase","zh": "資產審查的","part": "D","examples": ["Means tested benefits ensure that limited government resources are directed towards those most in need rather than distributed universally.","Critics argue that means testing creates stigma and administrative burden that deter eligible individuals from claiming the support they are entitled to."],"col": ["means tested benefit","means tested system","means tested approach","apply means testing","means tested welfare","means tested payment","means tested programme","undergo means testing"],"syn": [{"w": "income-dependent","n": "強調依據收入水平決定資格，比means tested更廣義"},{"w": "targeted benefit","n": "強調資源精準投放給特定群體，比means tested更正面"},{"w": "needs-based","n": "強調基於需求而非普遍性原則分配資源"}],"note": "means tested vs. universal benefits是IELTS社會政策類最重要的辯論議題之一；各有優缺點，是Task 2討論福利制度設計的核心框架。"},{"word": "social welfare","ipa": "/ˌsəʊʃəl ˈwelfeə/","pos": "phrase","zh": "社會福利","part": "D","examples": ["Investment in social welfare programmes has been shown to generate significant economic returns by reducing poverty and improving workforce participation.","The debate over the appropriate level of social welfare provision reflects deeper disagreements about the responsibilities of the state towards its citizens."],"col": ["social welfare system","provide social welfare","social welfare reform","adequate social welfare","social welfare spending","access social welfare","social welfare policy","social welfare state"],"syn": [{"w": "social security","n": "強調對社會成員安全保障的制度，比social welfare更廣泛使用"},{"w": "public assistance","n": "美式英語，強調政府提供的援助計畫"},{"w": "state support","n": "強調政府作為支援提供者的角色"}],"note": "social welfare是IELTS最核心的政府和社會詞彙之一；social welfare spending的效益與成本分析是Task 2論述政府責任的重要框架。"},{"word": "social well-being","ipa": "/ˌsəʊʃəl ˈwel biːɪŋ/","pos": "phrase","zh": "社會福祉","part": "D","examples": ["Economic indicators alone are insufficient to measure social well-being; quality of life, community connections, and environmental health must also be considered.","Research consistently demonstrates that green spaces in urban environments make a significant contribution to the social well-being of city residents."],"col": ["social well-being measure","promote social well-being","contribute to social well-being","social well-being index","overall social well-being","improve social well-being","affect social well-being","social well-being outcomes"],"syn": [{"w": "quality of life","n": "最廣義，強調生活的整體品質，比social well-being更口語"},{"w": "collective welfare","n": "強調群體整體的福祉，比social well-being更強調集體性"},{"w": "social cohesion","n": "強調社會各群體之間的凝聚和聯繫"}],"note": "social well-being比happiness更學術；IELTS中measuring social well-being beyond GDP（超越GDP衡量社會福祉）是近年Task 2的重要議題，涉及幸福指數等概念。"},{"word": "miscalculate","ipa": "/ˌmɪsˈkælkjʊleɪt/","pos": "verb","zh": "誤算","part": "C","examples": ["The government miscalculated public reaction to the austerity measures, triggering protests on a scale that had not been anticipated.","Companies that miscalculate the timing of market entry can find themselves competing against already established rivals with a significant disadvantage."],"col": ["seriously miscalculate","miscalculate reaction","miscalculate costs","miscalculate risk","miscalculate timing","miscalculate demand","grossly miscalculate","miscalculate public opinion"],"syn": [{"w": "misjudge","n": "強調判斷失誤，比miscalculate更廣義，不限於數值計算"},{"w": "underestimate","n": "強調低估，是miscalculate的常見具體形式"},{"w": "err","n": "最廣義，指犯錯，比miscalculate更廣義且正式"}],"note": "mis-前綴表示「錯誤地」；miscalculate, misjudge, mislead等在IELTS政府失誤類文章中頻繁出現，使用mis-前綴詞可展示豐富的詞彙構詞能力。"},{"word": "misinform","ipa": "/ˌmɪsɪnˈfɔːm/","pos": "verb","zh": "誤導；提供錯誤資訊","part": "C","examples": ["Social media platforms have been criticised for failing to prevent the spread of content that systematically misinforms users about health and science.","During the pandemic, many governments were accused of misinforming the public about the efficacy of preventive measures."],"col": ["misinform the public","deliberately misinform","misinform voters","misinform consumers","inadvertently misinform","misinform through media","misinform about health","misinform regarding policy"],"syn": [{"w": "mislead","n": "強調導致錯誤判斷，比misinform更廣義，可包含行動或省略"},{"w": "deceive","n": "強調有意欺騙，比misinform更強調惡意"},{"w": "distort","n": "強調扭曲事實，比misinform更強調對真相的篡改"}],"note": "misinformation（錯誤資訊）vs. disinformation（蓄意假訊息）是IELTS媒體類核心議題；前者不一定有惡意，後者是刻意散布，這一區別是IELTS閱讀的常見考點。"},{"word": "misdiagnose","ipa": "/ˌmɪsdaɪəɡˈnəʊz/","pos": "verb","zh": "誤診","part": "C","examples": ["Rare diseases are often misdiagnosed for years before patients receive appropriate treatment and support.","Critics argue that mental health conditions continue to be misdiagnosed or overlooked in many healthcare settings due to inadequate training."],"col": ["misdiagnose a condition","frequently misdiagnosed","wrongly misdiagnosed","misdiagnose symptoms","misdiagnose a patient","risk being misdiagnosed","misdiagnose initially","misdiagnose due to error"],"syn": [{"w": "give a wrong diagnosis","n": "最描述性，清楚說明誤診的含義"},{"w": "incorrectly identify","n": "強調識別錯誤，比misdiagnose更廣義"},{"w": "overlook","n": "強調忽視或遺漏，是誤診的常見原因"}],"note": "misdiagnose是IELTS醫療類閱讀的核心詞彙；AI-assisted diagnosis能否減少misdiagnosis rate（誤診率）是近年科技與醫療議題的重要討論方向。"},{"word": "mismanage","ipa": "/ˌmɪsˈmænɪdʒ/","pos": "verb","zh": "管理不當","part": "C","examples": ["The collapse of the company was attributed largely to the way senior executives had mismanaged its finances over the preceding decade.","Public funds are mismanaged when there is insufficient oversight, transparency, or accountability in government spending decisions."],"col": ["mismanage finances","mismanage resources","grossly mismanage","mismanage a project","mismanage public funds","mismanage company","mismanage crisis","mismanage economy"],"syn": [{"w": "bungle","n": "強調因無能而搞砸，比mismanage更口語且帶有輕蔑"},{"w": "handle poorly","n": "最廣義，比mismanage更輕描述管理不當"},{"w": "squander","n": "特指浪費資源，是mismanage的常見具體形式"}],"note": "mismanage在IELTS政府和企業管理類文章中是批評不良管理的核心詞彙；mismanagement of public resources常與corruption和accountability（問責制）一同討論。"},{"word": "misunderstand","ipa": "/ˌmɪsʌndəˈstænd/","pos": "verb","zh": "誤解","part": "C","examples": ["Policymakers sometimes misunderstand the complex motivations behind immigration, leading to policies that address symptoms rather than root causes.","Cultural differences can lead individuals to misunderstand the intentions behind communication styles that vary across social contexts."],"col": ["completely misunderstand","misunderstand the situation","misunderstand intention","misunderstand policy","easily misunderstood","misunderstand culture","misunderstand message","misunderstand consequences"],"syn": [{"w": "misconstrue","n": "更正式，強調對意圖或含義的錯誤解讀"},{"w": "misinterpret","n": "強調對資訊或訊號的錯誤詮釋，與misunderstand幾乎同義"},{"w": "confuse","n": "強調混淆，比misunderstand更廣義"}],"note": "misunderstand是IELTS跨文化交流類文章的核心詞彙；cultural misunderstanding是全球化時代最常討論的社會挑戰之一，是Task 2的好論點素材。"},{"word": "misinterpret","ipa": "/ˌmɪsɪnˈtɜːprɪt/","pos": "verb","zh": "誤傳；曲解","part": "C","examples": ["Research findings are sometimes misinterpreted by the media, leading the public to draw incorrect conclusions about scientific evidence.","Statistical data can easily be misinterpreted if presented without adequate context or if the methodology is not clearly explained."],"col": ["misinterpret data","misinterpret results","misinterpret evidence","commonly misinterpreted","misinterpret signals","deliberately misinterpret","misinterpret cultural cues","misinterpret findings"],"syn": [{"w": "misconstrue","n": "強調錯誤地理解意義或意圖，比misinterpret更正式"},{"w": "distort","n": "強調扭曲，暗示有意識的錯誤解讀"},{"w": "misunderstand","n": "最廣義，強調理解錯誤，比misinterpret更口語"}],"note": "misinterpret偏指對資訊或資料的詮釋錯誤；IELTS中misinterpretation of scientific data是批評科普傳播不準確的重要切入點。"},{"word": "mislead","ipa": "/ˌmɪsˈliːd/","pos": "verb","zh": "誤導","part": "C","examples": ["Advertisers are prohibited from using claims that are designed to mislead consumers about the efficacy or safety of their products.","Politicians who mislead voters about the costs of proposed policies ultimately undermine public trust in democratic institutions."],"col": ["deliberately mislead","mislead the public","mislead consumers","mislead voters","mislead investors","be misled by","unintentionally mislead","mislead about consequences"],"syn": [{"w": "deceive","n": "強調有意欺騙，比mislead更強調惡意"},{"w": "misinform","n": "強調提供錯誤資訊，不一定有惡意"},{"w": "manipulate","n": "強調操縱，比mislead更強調對人的控制意圖"}],"note": "mislead是IELTS廣告倫理和政治類文章的核心詞彙；misleading advertising（誤導性廣告）是消費者保護法的重要規範對象，是Task 2討論廣告監管的核心例子。"},{"word": "misjudge","ipa": "/ˌmɪsˈdʒʌdʒ/","pos": "verb","zh": "誤判","part": "C","examples": ["Security agencies misjudged the scale of public discontent, failing to anticipate the speed and spread of the protests.","Businesses that misjudge consumer preferences can lose significant market share to competitors who are more attuned to changing tastes."],"col": ["misjudge situation","misjudge reaction","seriously misjudge","misjudge the timing","misjudge public mood","misjudge demand","misjudge impact","badly misjudge"],"syn": [{"w": "miscalculate","n": "強調計算或估算失誤，比misjudge更強調數量評估"},{"w": "underestimate","n": "強調低估，是misjudge的常見具體形式"},{"w": "overestimate","n": "強調高估，是misjudge的另一具體形式"}],"note": "misjudge在IELTS政策和商業類文章中常描述決策失誤；misjudge public opinion（誤判民意）是民主政府常見的政治錯誤，是Task 2的好論點素材。"},{"word": "mistrust","ipa": "/ˌmɪsˈtrʌst/","pos": "verb","zh": "不信任","part": "C","examples": ["A history of colonial exploitation has led many developing nations to mistrust the economic advice proffered by international financial institutions.","When authorities withhold information or act inconsistently, the public naturally begins to mistrust official communications."],"col": ["mistrust government","deeply mistrust","mistrust institutions","mistrust authority","mistrust media","mistrust others","instinctively mistrust","mistrust the system"],"syn": [{"w": "distrust","n": "與mistrust幾乎同義，強調缺乏信任，比mistrust更口語"},{"w": "doubt","n": "最廣義，強調對真實性或可靠性的懷疑"},{"w": "be sceptical of","n": "強調帶有懷疑態度，比mistrust更學術"}],"note": "mistrust和distrust幾乎可互換；IELTS政治和媒體類文章中，public mistrust of institutions（公眾對機構的不信任）是描述社會信任危機的核心表達。"},{"word": "subsidise","ipa": "/ˈsʌbsɪdaɪz/","pos": "verb","zh": "補助","part": "C","examples": ["Many governments continue to subsidise fossil fuel industries despite their stated commitments to reducing carbon emissions.","There is a strong economic case for subsidising public transport to reduce car dependence and lower urban pollution levels."],"col": ["subsidise industry","government subsidise","heavily subsidised","subsidise farming","subsidise housing","subsidise renewable energy","subsidise public transport","unfairly subsidise"],"syn": [{"w": "fund","n": "最廣義，強調提供資金，比subsidise更廣義"},{"w": "support financially","n": "最描述性，強調提供財務支援"},{"w": "underwrite","n": "更正式，強調為某項活動提供財務保障"}],"note": "subsidise是IELTS政策類高頻動詞；government subsidies的利弊是Task 2常考議題，涉及market distortion（市場扭曲）vs. social benefit的辯論。"},{"word": "concrete jungle","ipa": "/ˌkɒŋkriːt ˈdʒʌŋɡəl/","pos": "noun","zh": "水泥叢林","part": "A","examples": ["Urban planners are attempting to transform the concrete jungle of city centres by integrating green spaces and sustainable architecture.","Many young professionals who grew up in concrete jungles are now choosing to relocate to smaller towns in search of a better quality of life."],"col": ["urban concrete jungle","transform concrete jungle","escape the concrete jungle","concrete jungle life","navigate concrete jungle","green spaces in concrete jungle","concrete jungle of the city","modern concrete jungle"],"syn": [{"w": "urban sprawl","n": "強調城市無序擴張，比concrete jungle更學術"},{"w": "metropolitan area","n": "最中性，指大都市及其周邊區域"},{"w": "cityscape","n": "強調城市的視覺景觀，比concrete jungle更中性"}],"note": "concrete jungle是描述過度都市化的著名比喻；IELTS中greening the concrete jungle是近年熱點議題，涉及urban biodiversity和residents' well-being。"},{"word": "employment opportunities","ipa": "/ɪmˈplɔɪmənt ˌɒpəˈtjuːnɪtɪz/","pos": "noun","zh": "就業機會","part": "A","examples": ["Rural-to-urban migration is primarily driven by the perception that cities offer greater employment opportunities and higher wages.","Creating sustainable employment opportunities for young people is essential for addressing the root causes of social unrest in many regions."],"col": ["create employment opportunities","limited employment opportunities","employment opportunities for youth","equal employment opportunities","employment opportunities in tech","seek employment opportunities","generate employment opportunities","expand employment opportunities"],"syn": [{"w": "job prospects","n": "強調個人找到工作的可能性，比employment opportunities更口語"},{"w": "career openings","n": "偏正式，強調職業發展的具體機會"},{"w": "work opportunities","n": "與employment opportunities幾乎同義，比較口語"}],"note": "employment opportunities是IELTS城市化和移民類核心詞彙；lack of employment opportunities是解釋rural-to-urban migration的主要push-pull factor，是Task 2必備論點。"},{"word": "garbage collection","ipa": "/ˈɡɑːbɪdʒ kəˌlekʃən/","pos": "noun","zh": "垃圾清運","part": "A","examples": ["Reliable garbage collection services are a basic indicator of effective municipal governance and urban quality of life.","Disruptions to regular garbage collection during strikes led to public health concerns in several major cities."],"col": ["weekly garbage collection","garbage collection schedule","garbage collection service","garbage collection system","municipal garbage collection","improve garbage collection","garbage collection efficiency","pay for garbage collection"],"syn": [{"w": "waste management","n": "更廣義，包含垃圾收集、處理和回收的整體體系"},{"w": "refuse collection","n": "英式正式用語，比garbage collection更書面"},{"w": "rubbish collection","n": "英式口語，與garbage collection同義"}],"note": "garbage collection在IELTS城市管理類文章中是基本公共服務的代表詞彙；waste management效率是衡量城市治理品質的重要指標，也是環保討論的切入點。"},{"word": "high-rise building","ipa": "/ˈhaɪ raɪz ˌbɪldɪŋ/","pos": "noun","zh": "高層建築","part": "A","examples": ["The proliferation of high-rise buildings in Asian cities has raised concerns about the loss of traditional urban character and community cohesion.","Modern high-rise buildings are increasingly designed with green features such as rooftop gardens and integrated solar panels."],"col": ["construct high-rise building","high-rise building complex","residential high-rise","downtown high-rise building","high-rise building development","prohibit high-rise buildings","iconic high-rise","high-rise building design"],"syn": [{"w": "skyscraper","n": "特指超高的摩天大樓，比high-rise building更強調高度"},{"w": "tower block","n": "英式英語，特指住宅型的高層建築群"},{"w": "multistorey building","n": "最正式，強調多樓層的建築物"}],"note": "high-rise building是IELTS城市化和建築類核心詞彙；high-rise vs. low-density development的社會影響比較是Task 2城市規劃的常見論點框架。"},{"word": "housing estate","ipa": "/ˈhaʊzɪŋ ɪˌsteɪt/","pos": "noun","zh": "住宅區","part": "A","examples": ["Many post-war housing estates were designed with utopian aspirations that did not survive contact with the complex realities of community life.","Local authorities are considering demolishing several ageing housing estates and replacing them with mixed-income developments."],"col": ["council housing estate","residential housing estate","large housing estate","public housing estate","deprived housing estate","housing estate development","run-down housing estate","housing estate regeneration"],"syn": [{"w": "residential area","n": "最廣義，指以住宅為主的區域，比housing estate更廣義"},{"w": "neighbourhood","n": "強調以地理為基礎的社區，比housing estate更口語"},{"w": "development","n": "強調新建的住宅群，比housing estate更廣義"}],"note": "housing estate在英式英語中特指有規劃的住宅區，常與council housing相關；IELTS城市社會類文章中，deprived housing estates的改造和再生是重要議題。"},{"word": "inner-city slum","ipa": "/ˌɪnə sɪti ˈslʌm/","pos": "noun","zh": "市中心貧民窟","part": "A","examples": ["Millions of people in rapidly urbanising countries are forced to live in inner-city slums without access to clean water or sanitation.","The transformation of inner-city slums through regeneration projects has displaced long-term residents, raising serious concerns about gentrification."],"col": ["inner-city slum conditions","clear inner-city slums","live in inner-city slum","inner-city slum redevelopment","inner-city slum poverty","address inner-city slums","inner-city slum housing","escape inner-city slum"],"syn": [{"w": "urban poverty area","n": "最廣義，強調貧困的城市地區"},{"w": "shanty town","n": "特指非正式的臨時棚屋聚落，比inner-city slum更強調非正式性"},{"w": "deprived neighbourhood","n": "更中性，強調資源匱乏，比slum少了貶義"}],"note": "inner-city slum是IELTS城市化類重要詞彙；slum多在城市核心，shanty town（棚屋區）多在城市邊緣；gentrification（高檔化）導致居民驅逐是近年新興主題。"},{"word": "noise pollution","ipa": "/ˈnɔɪz pəˌluːʃən/","pos": "noun","zh": "噪音汙染","part": "A","examples": ["Research has consistently shown that chronic noise pollution from traffic and aircraft has measurable negative effects on mental health and cognitive performance.","Urban planners are increasingly incorporating sound barriers and green buffers to mitigate noise pollution from motorways."],"col": ["noise pollution levels","reduce noise pollution","combat noise pollution","noise pollution regulations","traffic noise pollution","industrial noise pollution","impact of noise pollution","limit noise pollution"],"syn": [{"w": "sound pollution","n": "與noise pollution完全同義，但較少使用"},{"w": "acoustic disturbance","n": "最學術，偏用於環境科學研究語境"},{"w": "urban noise","n": "較廣義，強調城市環境中的各種噪音來源"}],"note": "noise pollution是IELTS城市和環境類核心詞彙；其對公共健康的影響（sleep disruption、stress、hearing loss）是閱讀考點，也是Task 2城市問題的重要例子。"},{"word": "outer suburbs","ipa": "/ˌaʊtə ˈsʌbɜːbz/","pos": "noun","zh": "外郊","part": "A","examples": ["As property prices in city centres have soared, many middle-class families have been pushed out to the outer suburbs, extending commuting times significantly.","Investment in public transport linking the outer suburbs to city centres is essential for reducing car dependence and traffic congestion."],"col": ["commute from outer suburbs","outer suburbs development","outer suburb residents","housing in outer suburbs","outer suburban growth","outer suburb infrastructure","transport to outer suburbs","live in outer suburbs"],"syn": [{"w": "outlying districts","n": "更正式，指城市外圍的區域"},{"w": "suburban fringe","n": "強調城郊交界地帶，比outer suburbs更具地理意涵"},{"w": "commuter belt","n": "強調大量通勤族居住的城市外圍地帶"}],"note": "outer suburbs是IELTS城市化類文章的常見詞彙；urban sprawl（城市蔓延）導致outer suburbs不斷擴張是描述現代城市發展問題的重要概念。"},{"word": "sewage system","ipa": "/ˈsuːɪdʒ ˌsɪstəm/","pos": "noun","zh": "污水處理系統","part": "A","examples": ["Many developing cities lack adequate sewage systems, leading to widespread contamination of waterways and serious public health risks.","The upgrade of the city's ageing sewage system is projected to require an investment of hundreds of millions of dollars over the next decade."],"col": ["underground sewage system","sewage system failure","upgrade sewage system","inadequate sewage system","sewage system treatment","modern sewage system","sewage system overflow","sewage treatment plant"],"syn": [{"w": "sanitation system","n": "更廣義，包含污水處理在內的所有衛生設施"},{"w": "drainage system","n": "強調排水功能，比sewage system更廣義"},{"w": "wastewater infrastructure","n": "最正式的技術用語，偏工程和政策語境"}],"note": "sewage system是IELTS城市發展和公共衛生類核心詞彙；缺乏adequate sewage system是發展中國家城市化帶來的主要公共健康挑戰，是Task 2的好例子。"},{"word": "traffic congestion","ipa": "/ˈtræfɪk kənˌdʒestʃən/","pos": "noun","zh": "交通擁塞","part": "A","examples": ["Traffic congestion in major cities costs billions of pounds annually in lost productivity and increased fuel consumption.","Congestion charging has proven effective in reducing traffic congestion in several city centres, though critics argue it is regressive in its impact on lower-income drivers."],"col": ["reduce traffic congestion","traffic congestion problem","traffic congestion charge","severe traffic congestion","ease traffic congestion","traffic congestion solution","traffic congestion costs","traffic congestion pricing"],"syn": [{"w": "gridlock","n": "特指嚴重到完全停滯的交通堵塞，比congestion更嚴重"},{"w": "traffic jam","n": "最口語，泛指任何交通堵塞狀況"},{"w": "urban traffic problems","n": "最廣義，包含congestion在內的所有城市交通問題"}],"note": "traffic congestion是IELTS城市類核心詞彙；congestion charging的有效性是Task 2常考議題，涉及environmental benefit vs. social equity的辯論。"},{"word": "urban sprawl","ipa": "/ˌɜːbən ˈsprɔːl/","pos": "noun","zh": "都市擴張","part": "A","examples": ["Uncontrolled urban sprawl has consumed vast areas of agricultural land and natural habitat on the periphery of rapidly growing cities.","Policies aimed at controlling urban sprawl include green belt legislation, infill development incentives, and investment in urban public transport."],"col": ["control urban sprawl","limit urban sprawl","urban sprawl problem","urban sprawl development","unchecked urban sprawl","urban sprawl and farmland","urban sprawl effects","urban sprawl management"],"syn": [{"w": "suburban expansion","n": "強調郊區的擴張，是urban sprawl的主要形式"},{"w": "urban spread","n": "比urban sprawl更中性，不強調無序性"},{"w": "metropolitan growth","n": "最廣義，泛指城市地區的增長，不一定含貶義"}],"note": "urban sprawl是IELTS城市規劃類最核心的詞彙之一，含批評無序擴張的意涵；Task 2中urban sprawl vs. compact city的發展模式比較是高頻論點框架。"},{"word": "frantic","ipa": "/ˈfræntɪk/","pos": "adj","zh": "瘋狂的；繁忙的","part": "B","examples": ["The frantic pace of life in major global cities has been linked to high levels of stress-related illness and burnout.","Emergency services made frantic efforts to evacuate residents before the floodwaters reached dangerous levels."],"col": ["frantic pace","frantic activity","frantic effort","utterly frantic","frantic search","frantic lifestyle","frantic rush","frantic attempt"],"syn": [{"w": "hectic","n": "強調非常忙碌且混亂，與frantic幾乎同義但稍輕"},{"w": "frenetic","n": "強調令人精疲力竭的瘋狂節奏，語氣比frantic稍正式"},{"w": "chaotic","n": "強調混亂無序，比frantic更強調缺乏組織"}],"note": "frantic強調因情急或忙碌而失去秩序；IELTS城市生活類文章中，frantic pace of urban life（城市生活的緊張節奏）是批評都市壓力文化的常見表達。"},{"word": "high-rise","ipa": "/ˈhaɪ raɪz/","pos": "adj","zh": "高樓層的","part": "B","examples": ["High-rise residential towers may offer affordable housing for large numbers of people, but critics argue they often undermine community cohesion.","The city's high-rise skyline has transformed dramatically over the past two decades as foreign investment poured into the property market."],"col": ["high-rise apartment","high-rise tower","high-rise development","high-rise living","high-rise block","high-rise construction","high-rise district","dense high-rise"],"syn": [{"w": "multistorey","n": "最廣義，指有多個樓層的建築，比high-rise更中性"},{"w": "tall building","n": "最描述性，無特定樓層要求"},{"w": "skyscraper","n": "特指超高的建築，比high-rise更強調極端高度"}],"note": "high-rise作形容詞修飾建築類型；IELTS中high-rise vs. low-density development的社區影響比較是Task 2常見論點，social isolation常被視為高層居住的負面後果。"},{"word": "isolated","ipa": "/ˈaɪsəleɪtɪd/","pos": "adj","zh": "孤立的","part": "B","examples": ["Elderly people living in urban high-rises are often among the most socially isolated members of the community.","Remote indigenous communities remain isolated from mainstream healthcare and education services due to geographical barriers."],"col": ["socially isolated","geographically isolated","feel isolated","isolated community","isolated region","increasingly isolated","isolated individual","remain isolated"],"syn": [{"w": "remote","n": "強調地理上偏遠，比isolated更強調距離"},{"w": "secluded","n": "強調刻意與外界隔離，帶有有意為之的意涵"},{"w": "marginalised","n": "強調被排除在主流社會之外，比isolated更強調社會排斥"}],"note": "isolated可指地理隔絕（isolated community）也可指社交孤立（socially isolated）；IELTS中social isolation是影響老年人心理健康的重要議題。"},{"word": "overpopulated","ipa": "/ˌəʊvəˈpɒpjʊleɪtɪd/","pos": "adj","zh": "人口過剩的","part": "B","examples": ["Overpopulated cities struggle to provide adequate infrastructure, housing, and services for their rapidly growing populations.","Some ecologists argue that the Earth as a whole is becoming overpopulated beyond the carrying capacity of its natural systems."],"col": ["severely overpopulated","overpopulated city","overpopulated region","become overpopulated","overpopulated planet","overpopulated area","overpopulated slum","dangerously overpopulated"],"syn": [{"w": "overcrowded","n": "強調在特定空間中人數過多，比overpopulated更口語"},{"w": "densely populated","n": "強調人口密度高，比overpopulated更中性，不含貶義"},{"w": "congested","n": "強調因過多人或車輛而造成的堵塞，比overpopulated更具體"}],"note": "overpopulated帶有批評意涵，暗示人口超過環境承載能力；IELTS中overpopulation作為爭議性概念（問題在distribution而非總量）是Task 2的重要論點。"},{"word": "migrate","ipa": "/maɪˈɡreɪt/","pos": "verb","zh": "遷徙；移民","part": "C","examples": ["Millions of people have migrated from rural areas to cities in search of better economic opportunities over the past century.","As sea levels rise, entire island populations may be forced to migrate permanently to higher ground or neighbouring countries."],"col": ["migrate to city","migrate for work","migrate seasonally","forced to migrate","migrate legally","migrate permanently","migrate from rural areas","migrate across borders"],"syn": [{"w": "relocate","n": "強調搬遷到新地點，比migrate更強調個人選擇"},{"w": "emigrate","n": "特指離開本國移居他國，是migrate在國際層面的具體形式"},{"w": "move","n": "最廣義，泛指任何形式的移動，比migrate更口語"}],"note": "migrate可指國際移民也可指國內遷移（migrate to cities）；IELTS中migration幾乎是必考主題，與urbanisation、economic development和climate change密切相關。"},{"word": "settle","ipa": "/ˈsetəl/","pos": "verb","zh": "定居；解決","part": "C","examples": ["Immigrants who settle in a new country often face the dual challenge of adapting to a new culture while maintaining their original identity.","Efforts to settle the land dispute peacefully have been complicated by longstanding historical grievances on both sides."],"col": ["settle in a country","settle a dispute","settle down","settle permanently","settle a debt","settle differences","settle land","newly settled"],"syn": [{"w": "establish","n": "強調建立穩定的存在，比settle更強調主動性"},{"w": "reside","n": "最廣義，強調在某地生活，比settle更靜態"},{"w": "resolve","n": "偏指解決問題，是settle在「解決」義上的同義詞"}],"note": "settle有「定居」和「解決」兩個主要含義；IELTS移民類文章中，conditions for immigrants to settle successfully是Task 2整合論述的核心主題。"},{"word": "tranquil","ipa": "/ˈtræŋkwɪl/","pos": "adj","zh": "寧靜的","part": "B","examples": ["Many city residents seek out tranquil rural environments at weekends to escape the noise and pace of urban life.","The documentary portrayed a tranquil coastal village that had managed to preserve its traditional character despite increasing tourism pressures."],"col": ["tranquil setting","tranquil environment","deeply tranquil","tranquil countryside","tranquil atmosphere","tranquil beach","relatively tranquil","tranquil life"],"syn": [{"w": "peaceful","n": "最廣義，強調寧靜和諧，與tranquil幾乎同義"},{"w": "serene","n": "強調一種使人平靜的氛圍，帶有更多的情感美感"},{"w": "calm","n": "最廣義，強調缺乏騷動，比tranquil更口語"}],"note": "tranquil強調令人放鬆的寧靜；IELTS中tranquil rural life vs. hectic urban life是描述城鄉對比的標準框架，是描述鄉村吸引力的高分形容詞。"},{"word": "agriculture","ipa": "/ˈæɡrɪkʌltʃə/","pos": "noun","zh": "農業","part": "A","examples": ["Modern intensive agriculture has dramatically increased food production but at a significant cost to biodiversity and soil quality.","Climate change threatens to undermine agricultural productivity in many regions, particularly in areas already suffering from water scarcity."],"col": ["intensive agriculture","sustainable agriculture","modern agriculture","commercial agriculture","agriculture sector","subsistence agriculture","industrial agriculture","urban agriculture"],"syn": [{"w": "farming","n": "最廣義且口語，泛指農業活動，比agriculture更日常"},{"w": "crop production","n": "特指作物種植，是agriculture的核心活動之一"},{"w": "food production","n": "強調食品的生產環節，比agriculture更廣義"}],"note": "agriculture是IELTS幾乎每次必考的詞彙；sustainable agriculture、intensive farming和food security是三個與agriculture緊密相關的核心概念，需一起掌握。"},{"word": "cattle","ipa": "/ˈkætəl/","pos": "noun","zh": "牛群","part": "A","examples": ["Cattle farming is one of the leading contributors to greenhouse gas emissions, primarily through the production of methane.","Large areas of the Amazon rainforest have been cleared to create pasture land for cattle ranching."],"col": ["cattle farming","cattle ranching","raise cattle","cattle herd","cattle industry","beef cattle","dairy cattle","cattle grazing"],"syn": [{"w": "livestock","n": "最廣義，包含牛、豬、羊等所有農場動物"},{"w": "bovine","n": "最學術，特指牛科動物，是cattle的科學術語"},{"w": "cows","n": "最口語，特指母牛，是cattle的口語替換"}],"note": "cattle是IELTS環境和農業類文章重要詞彙；cattle farming的甲烷排放、土地使用和水資源消耗是討論food sustainability的核心例子。"},{"word": "deforestation","ipa": "/ˌdiːˌfɒrɪˈsteɪʃən/","pos": "noun","zh": "森林砍伐","part": "A","examples": ["Deforestation in the Amazon has reached alarming rates, driven primarily by agricultural expansion and illegal logging.","Halting deforestation is considered essential for meeting global climate targets, as forests play a critical role in absorbing carbon dioxide."],"col": ["tropical deforestation","halt deforestation","deforestation rate","illegal deforestation","combat deforestation","deforestation and climate change","deforestation of Amazon","mass deforestation"],"syn": [{"w": "forest clearance","n": "強調清除樹木的行為，比deforestation更描述性"},{"w": "logging","n": "特指商業性的伐木作業，是deforestation的主要原因之一"},{"w": "woodland destruction","n": "比deforestation更廣義，包含非熱帶森林的破壞"}],"note": "deforestation是IELTS環境類幾乎必考的詞彙；其對biodiversity、climate change和water cycles的連鎖影響是Task 2必須掌握的完整論點鏈。"},{"word": "desalination","ipa": "/ˌdiːˌsælɪˈneɪʃən/","pos": "noun","zh": "海水淡化","part": "A","examples": ["Desalination plants are providing an increasingly vital source of drinking water for arid regions that lack sufficient freshwater reserves.","The high energy cost of desalination is a significant barrier to its widespread adoption as a solution to global water scarcity."],"col": ["desalination plant","water desalination","desalination technology","desalination process","invest in desalination","desalination energy cost","reverse osmosis desalination","seawater desalination"],"syn": [{"w": "water purification","n": "最廣義，包含desalination在內的所有淨水方法"},{"w": "salt removal","n": "最描述性，強調從水中去除鹽分的過程"},{"w": "water treatment","n": "比desalination更廣義，包含所有水質處理技術"}],"note": "desalination是IELTS水資源類核心技術詞彙；high energy consumption的特點使其在討論clean water vs. carbon footprint的矛盾時是重要的具體例子。"},{"word": "erosion","ipa": "/ɪˈrəʊʒən/","pos": "noun","zh": "侵蝕","part": "A","examples": ["Soil erosion caused by intensive agriculture and deforestation threatens the long-term productivity of farmland across many regions.","The erosion of traditional cultural values in the face of globalisation is a concern frequently raised in debates about cultural identity."],"col": ["soil erosion","coastal erosion","erosion control","prevent erosion","erosion of values","erosion by wind","erosion and flooding","gradual erosion"],"syn": [{"w": "degradation","n": "比erosion更廣義，強調品質和功能的整體退化"},{"w": "weathering","n": "特指自然力對地表的物理和化學侵蝕，比erosion更學術"},{"w": "deterioration","n": "最廣義，泛指任何品質的下降，可用於物理和社會語境"}],"note": "erosion有物理義（soil/coastal erosion）和比喻義（erosion of trust/values）；IELTS兩種語境都常見，erosion of public trust是Task 2的高分比喻表達。"},{"word": "fungus","ipa": "/ˈfʌŋɡəs/","pos": "noun","zh": "真菌","part": "A","examples": ["Certain fungi play an essential role in forest ecosystems by breaking down dead organic matter and returning nutrients to the soil.","A previously unknown fungus was identified as the cause of the dramatic decline in amphibian populations across Central America."],"col": ["soil fungus","parasitic fungus","fungal infection","fungus growth","beneficial fungus","toxic fungus","fungus spore","plant fungus"],"syn": [{"w": "mould","n": "特指在有機物上生長的黴菌，是fungus的口語化說法"},{"w": "microorganism","n": "最廣義，泛指所有微生物，包含細菌、病毒和真菌"},{"w": "pathogen","n": "特指能引起疾病的微生物，是pathogenic fungus的上位詞"}],"note": "fungus（複數fungi）在IELTS生態類文章中扮演分解者角色；mycorrhizal fungi與植物的symbiotic relationship是近年IELTS閱讀的新興主題。"},{"word": "productivity","ipa": "/ˌprɒdʌkˈtɪvɪti/","pos": "noun","zh": "生產力","part": "A","examples": ["Investment in education and training is widely regarded as the most reliable way to raise long-term productivity growth.","Noise pollution and poor workplace design have been shown to significantly reduce employee productivity in office environments."],"col": ["increase productivity","agricultural productivity","labour productivity","productivity growth","workplace productivity","productivity levels","boost productivity","decline in productivity"],"syn": [{"w": "efficiency","n": "強調以最少資源達到最大產出的能力，比productivity更強調比率"},{"w": "output","n": "強調總產出量，比productivity更具體且中性"},{"w": "performance","n": "最廣義，強調執行任務的能力和結果"}],"note": "productivity是IELTS商業、教育和環境類核心詞彙；productivity growth是經濟發展的關鍵指標；soil productivity在農業語境中也是重要概念。"},{"word": "herbivore","ipa": "/ˈhɜːbɪvɔː/","pos": "noun","zh": "草食動物","part": "A","examples": ["Herbivores play a vital role in controlling plant growth and shaping the structure of terrestrial ecosystems.","When herbivore populations are removed from an ecosystem, the unchecked growth of vegetation can alter the entire landscape."],"col": ["large herbivore","herbivore population","grazing herbivore","native herbivore","herbivore diet","herbivore habitat","herbivore behaviour","extinct herbivore"],"syn": [{"w": "plant-eater","n": "最口語，最廣義，強調以植物為食"},{"w": "grazer","n": "特指吃草的動物，如牛羊，是herbivore的口語化說法"},{"w": "primary consumer","n": "最學術，食物鏈術語，強調herbivore在能量流動中的角色"}],"note": "herbivore vs. carnivore vs. omnivore是IELTS生態類閱讀的基礎詞彙組；herbivores作為primary consumers在食物鏈中的位置是理解生態系統能量流動的關鍵。"},{"word": "natural resources","ipa": "/ˌnætʃərəl rɪˈzɔːsɪz/","pos": "noun","zh": "自然資源","part": "A","examples": ["Countries endowed with abundant natural resources do not always translate this wealth into broad-based economic development, a phenomenon economists call the resource curse.","The sustainable management of natural resources requires balancing immediate economic needs against the long-term imperative of environmental preservation."],"col": ["exploit natural resources","natural resources management","deplete natural resources","protect natural resources","natural resources extraction","renewable natural resources","non-renewable natural resources","natural resources curse"],"syn": [{"w": "raw materials","n": "強調工業生產的原始投入，比natural resources更偏工業語境"},{"w": "natural capital","n": "最學術，強調自然界的資源具有經濟和生態價值"},{"w": "earth's resources","n": "最廣義，強調地球提供給人類的所有資源"}],"note": "natural resources是IELTS環境和經濟類核心詞彙；resource curse（資源詛咒）指過度依賴資源出口而導致的經濟發展障礙，是Task 2高分引用的重要學術概念。"}]
};
const PART_LABELS = {
  A:'Part A · Nouns', B:'Part B · Adjectives',
  C:'Part C · Verbs',  D:'Part D · Phrases'
};
const SK = 'ielts_u8';
let cur=0, mode='browse', flipped=false, known=[], onIntro=true;
function load(){ try{ known=JSON.parse(localStorage.getItem(SK)||'[]'); }catch(e){known=[];} }
function save(){ try{ localStorage.setItem(SK,JSON.stringify(known)); }catch(e){} }
function isKnown(i){ return known.includes(i); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function updateDots(){
  const n=UNIT.words.length, max=Math.min(n,30);
  let h='';
  for(let i=0;i<max;i++){
    const c=(!onIntro&&i===cur)?'dot cur':isKnown(i)?'dot known':'dot';
    h+='<div class="'+c+'"></div>';
  }
  if(n>max) h+='<span style="font-family:var(--fm);font-size:.5rem;color:var(--g400);margin-left:2px;">+'+(n-max)+'</span>';
  document.getElementById('dots').innerHTML=h;
}
function renderIntro(){
  document.getElementById('counter').textContent='Introduction';
  document.getElementById('known-badge').textContent='';
  document.getElementById('prog-fill').style.width='0%';
  document.getElementById('action-count').textContent='';
  document.getElementById('know-btn').style.display='none';
  document.getElementById('review-btn').style.display='none';
  const f=document.getElementById('front-face');
  f.className='face front intro-face';
  f.innerHTML=
    '<div class="ic-eyebrow">IELTS Core Thematic Vocabulary · Chapter 8 of 10</div>'+
    '<div class="ic-title">Government, Society & Urban Life</div>'+
    '<div class="ic-zh">政府體制、都市生活與社會議題</div>'+
    '<div class="ic-rule"></div>'+
    '<div class="ic-body">'+
      '<div>'+
        '<div class="ic-sec-label">關於本章</div>'+
        '<div class="ic-about">本章收錄 55 個核心詞彙。每個詞條包含搭配詞與中文解釋。</div>'+
      '</div>'+
      '<div>'+
        '<div class="ic-sec-label">使用方式</div>'+
        '<div class="ic-steps">'+
          '<div class="ic-step"><span class="ic-tag">Browse</span>正面顯示英文單字，翻面查看中文與搭配詞。</div>'+
          '<div class="ic-step"><span class="ic-tag">Quiz</span>正面顯示中文，翻面前先回想英文，訓練主動回憶。</div>'+
          '<div class="ic-step"><span class="ic-tag">Know it ✓</span>標記已掌握。<span class="ic-tag">Review ↺</span>重新複習。</div>'+
          '<div class="ic-step"><span class="ic-tag">快捷鍵</span>← → 切換卡片 &nbsp;·&nbsp; F 翻轉 &nbsp;·&nbsp; K 標記</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="ic-hint">按 Next → 開始學習</div>';
  document.getElementById('back-face').innerHTML='';
  updateDots();
}
function render(){
  if(onIntro){ renderIntro(); return; }
  document.getElementById('front-face').className='face front';
  document.getElementById('know-btn').style.display='';
  document.getElementById('review-btn').style.display='';
  const w=UNIT.words[cur], n=UNIT.words.length, k=isKnown(cur);
  document.getElementById('counter').textContent=(cur+1)+' / '+n;
  document.getElementById('known-badge').textContent=known.length+' / '+n+' known';
  document.getElementById('prog-fill').style.width=((cur+1)/n*100)+'%';
  document.getElementById('action-count').textContent=known.length+'/'+n;
  const isQuiz=(mode==='quiz');
  document.getElementById('front-face').innerHTML=
    '<div class="f-top">'+
      '<div class="f-meta">'+
        '<div class="f-num">#'+String(cur+1).padStart(3,'0')+'</div>'+
        '<div class="f-part">'+(PART_LABELS[w.part]||'')+'</div>'+
      '</div>'+
      '<span class="f-known-mark'+(k?' vis':'')+'">✓ known</span>'+
    '</div>'+
    '<div class="f-body">'+
      '<div class="f-word">'+esc(isQuiz?w.zh:w.word)+'</div>'+
      (!isQuiz&&w.ipa?'<div class="f-ipa">'+esc(w.ipa)+'</div>':'')+
      (!isQuiz?'<div class="f-pos">'+esc(w.pos)+'</div>':'')+
    '</div>'+
    '<div class="f-hint">'+(isQuiz?'think → click to flip':'click to flip →')+'</div>';
  const exH=(w.examples||[]).map(e=>'<div class="b-ex">"'+esc(e)+'"</div>').join('');
  const colH=(w.col||[]).map(c=>'<div class="b-col">'+esc(c)+'</div>').join('');
  const synH=(w.syn||[]).map(s=>
    '<div class="b-syn-row"><div class="b-syn-w">'+esc(s.w)+'</div>'+
    '<div class="b-syn-n">（'+esc(s.n)+'）</div></div>'
  ).join('');
  const noteH=w.note?'<div class="b-sec"><div class="b-label">注意</div><div class="b-note">'+esc(w.note)+'</div></div>':'';
  let zhLine, metaLine='';
  if(isQuiz){
    zhLine='<div class="b-quiz-word">'+esc(w.word)+'</div>';
    metaLine='<div class="b-quiz-meta">'+esc(w.pos)+(w.ipa?' &nbsp;'+esc(w.ipa):'')+'</div>';
  } else {
    zhLine='<div class="b-zh">'+esc(w.zh)+'</div>';
  }
  document.getElementById('back-face').innerHTML=
    zhLine+metaLine+
    '<div class="b-rule"></div>'+
    '<div class="b-content">'+
      (exH?'<div class="b-sec"><div class="b-label">Examples</div>'+exH+'</div>':'')+
      (colH?'<div class="b-sec"><div class="b-label">搭配</div><div class="b-cols">'+colH+'</div></div>':'')+
      (synH?'<div class="b-sec"><div class="b-label">近義</div><div class="b-syns">'+synH+'</div></div>':'')+
      noteH+
    '</div>';
  updateDots();
}
function flip(){ if(onIntro) return; flipped=!flipped; document.getElementById('card').classList.toggle('flipped',flipped); }
function go(dir){
  if(onIntro&&dir>0){ onIntro=false;cur=0;flipped=false;document.getElementById('card').classList.remove('flipped');render();return; }
  if(!onIntro&&dir<0&&cur===0){ onIntro=true;flipped=false;document.getElementById('card').classList.remove('flipped');render();return; }
  if(onIntro) return;
  cur=Math.max(0,Math.min(UNIT.words.length-1,cur+dir));
  flipped=false;document.getElementById('card').classList.remove('flipped');render();
}
function markKnown(){ if(onIntro) return; if(!isKnown(cur)) known.push(cur); save();render(); setTimeout(function(){ if(cur<UNIT.words.length-1) go(1); },180); }
function markReview(){ if(onIntro) return; known=known.filter(function(x){return x!==cur;}); save();render(); }
function setMode(m){ mode=m;flipped=false;document.getElementById('card').classList.remove('flipped');document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.toggle('active',b.dataset.mode===m);});render(); }
document.getElementById('scene').addEventListener('click',flip);
document.getElementById('prev-btn').addEventListener('click',function(e){e.stopPropagation();go(-1);});
document.getElementById('next-btn').addEventListener('click',function(e){e.stopPropagation();go(1);});
document.getElementById('know-btn').addEventListener('click',function(e){e.stopPropagation();markKnown();});
document.getElementById('review-btn').addEventListener('click',function(e){e.stopPropagation();markReview();});
document.querySelectorAll('.mode-btn').forEach(function(b){ b.addEventListener('click',function(e){e.stopPropagation();setMode(b.dataset.mode);});});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='f'||e.key==='F') flip();
  else if(e.key==='k'||e.key==='K') markKnown();
});
load();render();
</script>
</body>
</html>
