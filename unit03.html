 conceptualisation","conceptualisation of a problem","conceptualisation framework","conceptualisation stage","creative conceptualisation"],"syn": [{"w": "formulation","n": "強調將想法整理成具體可操作的計畫或理論"},{"w": "theorisation","n": "偏學術，指建構理論框架的過程"},{"w": "framing","n": "較口語，指為問題或議題建立詮釋框架"}],"note": "conceptualisation多用於學術寫作，指將抽象概念系統化的過程；IELTS閱讀題中常出現於社會科學語境。"},{"word": "consistency","ipa": "/kənˈsɪstənsi/","pos": "noun","zh": "一致性","part": "A","examples": ["Consistency in policy implementation is essential if governments wish to build public trust.","The report praised the team's consistency of performance throughout the three-year project."],"col": ["maintain consistency","lack of consistency","internal consistency","consistency of quality","consistency in approach","remarkable consistency","consistency over time","ensure consistency"],"syn": [{"w": "coherence","n": "強調各部分邏輯上的連貫性，多用於論述或政策"},{"w": "uniformity","n": "強調形式或標準上的統一，較為機械化"},{"w": "reliability","n": "強調可信賴的穩定表現，側重結果的可預測性"}],"note": "consistency強調隨時間保持不變的品質或標準；coherence則強調內在邏輯的連貫，兩者不可混用。"},{"word": "establishment","ipa": "/ɪˈstæblɪʃmənt/","pos": "noun","zh": "機構；建立","part": "A","examples": ["The establishment of an independent regulatory body was seen as a crucial step toward financial transparency.","Many prominent intellectuals found themselves at odds with the cultural establishment of their time."],"col": ["medical establishment","establishment of business","political establishment","educational establishment","the establishment","establishment of rules","research establishment","military establishment"],"syn": [{"w": "institution","n": "泛指正式設立的組織或機構，比establishment更中性"},{"w": "foundation","n": "強調建立或成立的行為，也可指基金會"},{"w": "organisation","n": "最廣義的組織，不強調其社會影響力"}],"note": "the establishment（加定冠詞）特指掌握社會主流影響力的保守既得利益集團，是IELTS社會類文章的常見概念。"},{"word": "formulation","ipa": "/ˌfɔːmjʊˈleɪʃən/","pos": "noun","zh": "制定；構想","part": "A","examples": ["The formulation of a coherent national energy policy requires input from scientists, economists, and the public alike.","Researchers spent two years on the formulation of a vaccine that could withstand tropical temperatures."],"col": ["policy formulation","formulation of a plan","drug formulation","chemical formulation","careful formulation","formulation of strategy","formulation process","new formulation"],"syn": [{"w": "development","n": "最廣義，指任何事物從構思到成形的過程"},{"w": "drafting","n": "特指文件、法律或計畫的起草撰寫過程"},{"w": "conception","n": "強調最初的構想或創意發想階段"}],"note": "formulation兼指「制定過程」和「具體配方/藥劑」；在學術寫作中多指政策或論點的系統化構建。"},{"word": "hypothesis","ipa": "/haɪˈpɒθɪsɪs/","pos": "noun","zh": "假設","part": "A","examples": ["The scientist proposed a bold hypothesis suggesting that the extinction was caused by a series of volcanic eruptions rather than a meteor impact.","Before conducting the experiment, the team formulated a working hypothesis that could be tested empirically."],"col": ["test a hypothesis","working hypothesis","formulate a hypothesis","support a hypothesis","reject a hypothesis","initial hypothesis","scientific hypothesis","hypothesis testing"],"syn": [{"w": "theory","n": "已有一定證據支持的系統性解釋，比hypothesis更成熟"},{"w": "assumption","n": "未經驗證的前提，可能出於直覺而非科學推論"},{"w": "conjecture","n": "推測性猜想，強調缺乏確切證據，語氣較口語"}],"note": "hypothesis是科學方法的核心術語，指可被驗證的具體假說；theory是已獲廣泛支持的解釋框架，兩者不可互換。"},{"word": "inconsistency","ipa": "/ˌɪnkənˈsɪstənsi/","pos": "noun","zh": "不一致","part": "A","examples": ["Critics pointed out a fundamental inconsistency between the government's stated environmental goals and its continued subsidies to fossil fuel companies.","The inconsistency of the witness testimonies cast serious doubt on the prosecution's case."],"col": ["obvious inconsistency","internal inconsistency","glaring inconsistency","inconsistency in data","inconsistency of approach","highlight an inconsistency","resolve an inconsistency","apparent inconsistency"],"syn": [{"w": "contradiction","n": "強調兩種說法或立場直接相互矛盾"},{"w": "discrepancy","n": "指數據、陳述或事實之間的具體差異或落差"},{"w": "incoherence","n": "強調整體邏輯或論述的混亂缺乏條理"}],"note": "inconsistency指前後不一致，discrepancy則強調可測量的具體落差（如數字差異）；IELTS閱讀中兩者都很常見。"},{"word": "insignificance","ipa": "/ˌɪnsɪɡˈnɪfɪkəns/","pos": "noun","zh": "無足輕重","part": "A","examples": ["Standing before the ancient canyon, she was overwhelmed by a sense of her own insignificance in the face of geological time.","The committee dismissed his objections, reducing his concerns to utter insignificance."],"col": ["sense of insignificance","relative insignificance","utter insignificance","fade into insignificance","insignificance of the error","political insignificance","pale into insignificance","cultural insignificance"],"syn": [{"w": "irrelevance","n": "強調與討論主題無關，而非份量輕微"},{"w": "triviality","n": "強調瑣碎微不足道，帶有輕蔑意味"},{"w": "obscurity","n": "強調默默無聞、不為人知的狀態"}],"note": "pale/fade into insignificance是IELTS寫作常用固定搭配，意為「相比之下顯得微不足道」，是高分表達。"},{"word": "interpretation","ipa": "/ɪnˌtɜːprɪˈteɪʃən/","pos": "noun","zh": "解釋；詮釋","part": "A","examples": ["Different cultural backgrounds inevitably lead to different interpretations of the same historical event.","The legal interpretation of this clause has been contested in courts across three jurisdictions."],"col": ["data interpretation","creative interpretation","legal interpretation","strict interpretation","broad interpretation","subjective interpretation","interpretation of results","open to interpretation"],"syn": [{"w": "explanation","n": "著重提供清楚的說明，幫助他人理解某事"},{"w": "analysis","n": "強調系統性的分解與檢視，比interpretation更具結構性"},{"w": "reading","n": "指對文本或情境的個人理解方式，較非正式"}],"note": "interpretation強調帶有主觀判斷的詮釋；explanation側重客觀說明。「open to interpretation」表示存在多種合理解讀，是學術常用語。"},{"word": "technician","ipa": "/tɛkˈnɪʃən/","pos": "noun","zh": "技術人員","part": "A","examples": ["The laboratory technician carefully prepared the samples before the clinical trials could begin.","Demand for qualified IT technicians has surged dramatically in response to the digital transformation of industry."],"col": ["lab technician","skilled technician","dental technician","computer technician","senior technician","train a technician","medical technician","technician qualification"],"syn": [{"w": "specialist","n": "更廣義，指任何領域的專家，不一定是實作技術人員"},{"w": "engineer","n": "通常指受過更高等教育、負責設計或系統的專業人員"},{"w": "operative","n": "較口語，指執行具體操作工序的工人，技術含量較低"}],"note": "technician介於operative和engineer之間，強調具備專業技術的實作人員；IELTS中常出現在科技或醫療語境。"},{"word": "theorist","ipa": "/ˈθɪərɪst/","pos": "noun","zh": "理論家","part": "A","examples": ["Leading social theorists have long debated whether economic inequality is an inevitable feature of modern capitalism.","The linguist was regarded as a pioneering theorist whose ideas transformed the study of grammar."],"col": ["political theorist","social theorist","leading theorist","literary theorist","economic theorist","critical theorist","theorist of education","prominent theorist"],"syn": [{"w": "thinker","n": "最廣義，指在某領域深刻思考的人，不限於系統性理論建構"},{"w": "philosopher","n": "偏向哲學思辨，但也可泛指思想家"},{"w": "intellectual","n": "泛指從事學術思想工作的知識分子，範圍更廣"}],"note": "theorist強調建構或倡導特定理論，是academic writing中的精確用詞；intellectual則泛指知識界人士，不一定提出理論。"},{"word": "vocation","ipa": "/vəʊˈkeɪʃən/","pos": "noun","zh": "天職；職業","part": "A","examples": ["Many teachers describe their work not merely as a job but as a vocation that demands genuine commitment.","The concept of vocation implies that work should be a source of meaning rather than simply a means of income."],"col": ["true vocation","find your vocation","sense of vocation","vocational training","vocation for teaching","lose one's vocation","religious vocation","follow a vocation"],"syn": [{"w": "calling","n": "強調內心深處的使命感或神聖召喚，比vocation更感性"},{"w": "profession","n": "泛指任何專業職業，不強調使命感或精神層面"},{"w": "career","n": "著重職業發展路徑，偏世俗且注重晉升"}],"note": "vocation含有「天命使命」的精神意涵，不同於中性的profession或career；IELTS中常出現在教育或社會議題的論述中。"},{"word": "analytical","ipa": "/ˌænəˈlɪtɪkəl/","pos": "adj","zh": "分析的","part": "B","examples": ["Employers increasingly value analytical skills over mere factual knowledge in the modern workplace.","Her analytical approach to problem-solving set her apart from other candidates during the interview process."],"col": ["analytical mind","analytical skill","analytical approach","analytical framework","analytical thinking","highly analytical","analytical method","analytical tool"],"syn": [{"w": "logical","n": "強調依據邏輯推理，比analytical更口語"},{"w": "critical","n": "強調能夠質疑和評估，比analytical更帶有判斷性"},{"w": "systematic","n": "強調有條不紊的方法，偏重過程而非思維能力"}],"note": "analytical指善於分解問題並深入分析的思維特質；IELTS學術類文章中analytical skills、analytical framework是高頻搭配。"},{"word": "blue-collar","ipa": "/ˌbluː ˈkɒlə/","pos": "adj","zh": "藍領的","part": "B","examples": ["The automation of blue-collar jobs has displaced millions of workers in the manufacturing sector.","Politicians often invoke blue-collar values to appeal to working-class voters in industrial regions."],"col": ["blue-collar worker","blue-collar job","blue-collar industry","blue-collar community","blue-collar background","traditional blue-collar","blue-collar workforce","blue-collar town"],"syn": [{"w": "manual","n": "強調體力勞動的性質，比blue-collar更中性"},{"w": "working-class","n": "強調社會階層背景，比blue-collar更廣，包含非體力勞動者"},{"w": "trade-based","n": "強調依靠技術行業謀生，較正面"}],"note": "blue-collar與white-collar（白領）相對；前者指體力技術勞動，後者指辦公室專業工作。IELTS社會類議題中兩者常成對出現。"},{"word": "conceptual","ipa": "/kənˈseptʃuəl/","pos": "adj","zh": "概念的","part": "B","examples": ["The paper makes a useful conceptual distinction between correlation and causation that students often overlook.","Conceptual art challenges the traditional assumption that aesthetic beauty should be the primary goal of artistic creation."],"col": ["conceptual framework","conceptual art","conceptual model","conceptual understanding","conceptual approach","conceptual clarity","purely conceptual","conceptual distinction"],"syn": [{"w": "theoretical","n": "強調基於理論而非實際應用，比conceptual更偏學術"},{"w": "abstract","n": "強調脫離具體現實，較難觸及或應用"},{"w": "notional","n": "強調僅存在於概念層面，帶有不夠真實的意味"}],"note": "conceptual強調與概念或思想有關；在學術論文和IELTS閱讀中，conceptual framework（概念框架）是必記搭配。"},{"word": "hypothetical","ipa": "/ˌhaɪpəˈθetɪkəl/","pos": "adj","zh": "假設的","part": "B","examples": ["The lecturer posed a hypothetical scenario to encourage students to think critically about ethical dilemmas.","Much of the criticism levelled at the policy was based on hypothetical risks rather than documented evidence."],"col": ["hypothetical situation","purely hypothetical","hypothetical example","hypothetical scenario","hypothetical question","hypothetical case","hypothetical model","hypothetical argument"],"syn": [{"w": "theoretical","n": "強調存在於理論框架中，不一定是假想"},{"w": "speculative","n": "強調基於推測而非事實，帶有不確定性"},{"w": "conjectural","n": "較正式，指基於推斷而非確定知識"}],"note": "hypothetical常用於假設情境討論（If X were true...）；IELTS寫作中可用hypothetical examples支撐論點，但需與真實例子搭配使用。"},{"word": "indicative","ipa": "/ɪnˈdɪkətɪv/","pos": "adj","zh": "指示的；表明的","part": "B","examples": ["The survey results are indicative of a broader shift in public attitudes towards environmental responsibility.","Rising unemployment figures are indicative of deeper structural problems within the economy."],"col": ["indicative of a trend","indicative mood","indicative figure","broadly indicative","highly indicative","not necessarily indicative","indicative data","indicative of change"],"syn": [{"w": "suggestive","n": "強調暗示某種可能性，比indicative語氣更弱"},{"w": "representative","n": "強調具代表性，能反映整體情況"},{"w": "symptomatic","n": "強調是更大問題或現象的症狀表現"}],"note": "indicative of是IELTS學術閱讀常見句型，意為「表明、顯示」；symptomatic of語氣更強，暗示潛在問題需要關注。"},{"word": "a process of trial and error","ipa": "/ə ˈprəʊsɛs əv ˈtraɪəl ənd ˈerə/","pos": "phrase","zh": "嘗試錯誤的過程","part": "D","examples": ["Scientific progress is fundamentally a process of trial and error, with failed experiments providing as much insight as successful ones.","Developing effective classroom strategies often involves a lengthy process of trial and error for new teachers."],"col": ["learn through trial and error","a process of trial and error","through trial and error","by trial and error","painful trial and error","inevitable trial and error","trial-and-error approach","trial and error method"],"syn": [{"w": "experimentation","n": "更正式的學術用語，指系統性的實驗測試過程"},{"w": "iteration","n": "強調反覆修改和改進，帶有更系統化的意涵"},{"w": "tinkering","n": "較口語，強調非正式的反覆嘗試和調整"}],"note": "by/through trial and error是固定搭配；in IELTS寫作中可描述科學、教育或政策制定過程，是論點支撐的好素材。"},{"word": "give yourself something to aim for","ipa": "/ɡɪv jɔːˈself ˈsʌmθɪŋ tə eɪm fɔː/","pos": "phrase","zh": "給自己目標","part": "D","examples": ["Setting clear milestones gives you something to aim for and makes the overall goal feel more achievable.","Career advisors often stress the importance of giving yourself something to aim for, even when progress feels slow."],"col": ["give yourself something to aim for","always have something to aim for","set something to aim for","important to aim for a goal","keep something to aim for","provide yourself with a target","aim for a clear objective","set yourself a challenge"],"syn": [{"w": "set a target","n": "最直接的同義表達，強調確立可量化的目標"},{"w": "establish a goal","n": "更正式，強調明確設定和確立目標"},{"w": "create an objective","n": "偏商業或學術語境，強調設立具體的目標任務"}],"note": "此片語強調目標的激勵作用；IELTS論述時可用give oneself a clear objective作為更學術的替換表達。"},{"word": "make a concerted effort","ipa": "/meɪk ə kənˈsɜːtɪd ˈefət/","pos": "phrase","zh": "齊心協力","part": "D","examples": ["Governments must make a concerted effort to address climate change before the consequences become irreversible.","The team made a concerted effort to meet the deadline despite facing significant technical challenges."],"col": ["make a concerted effort","require a concerted effort","need a concerted effort","concerted effort by all parties","collective and concerted effort","make a joint effort","concerted international effort","concerted action"],"syn": [{"w": "collaborate","n": "強調合作的過程，適合作動詞"},{"w": "united approach","n": "強調統一戰線，適合作名詞片語"},{"w": "coordinated action","n": "強調有組織、有協調的集體行動，更正式"}],"note": "concerted強調協調一致、共同努力；make a concerted effort是IELTS寫作中呼籲集體行動的標準高分表達。"},{"word": "set yourself a goal","ipa": "/set jɔːˈself ə ɡəʊl/","pos": "phrase","zh": "為自己設定目標","part": "D","examples": ["Research suggests that people who set themselves clear goals are significantly more likely to achieve them.","One effective study strategy is to set yourself a goal for each revision session, such as mastering ten new vocabulary items."],"col": ["set yourself a goal","set a realistic goal","set achievable goals","set long-term goals","set short-term goals","set yourself a target","establish clear goals","define personal goals"],"syn": [{"w": "establish objectives","n": "更正式，適用於商業或學術語境"},{"w": "define targets","n": "強調具體可量化的目標數字"},{"w": "set a benchmark","n": "強調設立衡量標準，用於評估進度"}],"note": "set a goal是IELTS學習策略類題目的核心詞彙；可替換為establish objectives或set a target使論述更學術化。"},{"word": "persuasive","ipa": "/pəˈsweɪsɪv/","pos": "adj","zh": "有說服力的","part": "B","examples": ["The defence lawyer delivered a highly persuasive closing argument that swayed several jurors.","A persuasive essay must not only present strong evidence but also anticipate and address counter-arguments."],"col": ["persuasive argument","persuasive speaker","persuasive evidence","highly persuasive","persuasive writing","persuasive technique","persuasive power","persuasive case"],"syn": [{"w": "compelling","n": "強調論據或理由足以令人信服，帶有難以抗拒的意味"},{"w": "convincing","n": "強調最終成功使人相信，側重結果而非過程"},{"w": "influential","n": "強調對他人思想或行為的廣泛影響力，範圍比persuasive更廣"}],"note": "persuasive著重說服的過程和技巧；convincing強調成功令人信服的結果。IELTS寫作Task 2的優秀論述應兼具兩者特質。"},{"word": "promotional","ipa": "/prəˈməʊʃənəl/","pos": "adj","zh": "促銷的；宣傳的","part": "B","examples": ["The company invested heavily in promotional campaigns to boost brand awareness ahead of the product launch.","Many consumers have grown increasingly sceptical of promotional material that makes exaggerated claims."],"col": ["promotional material","promotional offer","promotional campaign","promotional video","promotional event","promotional strategy","promotional price","promotional activity"],"syn": [{"w": "advertising","n": "特指付費廣告宣傳，比promotional更具體指媒體廣告"},{"w": "marketing","n": "泛指所有推廣活動的統稱，比promotional更廣義"},{"w": "publicity","n": "強調媒體或公眾關注度的提升，不一定通過付費廣告"}],"note": "promotional偏指具體的促銷或宣傳行動；marketing是整體策略的上位詞。IELTS商業類文章中三者常交替出現。"},{"word": "repetitive","ipa": "/rɪˈpetɪtɪv/","pos": "adj","zh": "重複的","part": "B","examples": ["Automation has relieved many factory workers of repetitive and physically demanding tasks.","Critics of standardised testing argue that it encourages repetitive drilling rather than genuine understanding."],"col": ["repetitive task","repetitive motion","repetitive work","highly repetitive","repetitive strain injury","repetitive behaviour","repetitive process","tedious and repetitive"],"syn": [{"w": "monotonous","n": "強調單調乏味令人疲倦，偏主觀感受"},{"w": "routine","n": "強調按固定模式進行，不一定含有負面評價"},{"w": "mechanical","n": "強調像機器般缺乏創意或思考的操作方式"}],"note": "repetitive strain injury（重複性勞損，RSI）是IELTS職場健康類文章的常見術語；repetitive有時含貶義，暗示缺乏創意。"},{"word": "slick","ipa": "/slɪk/","pos": "adj","zh": "熟練的；圓滑的","part": "B","examples": ["The candidate's slick performance in the debate impressed many viewers but struck others as overly rehearsed.","The advertising agency produced a slick promotional video that showcased the product's key features effectively."],"col": ["slick presentation","slick marketing","slick performance","slick operation","slick design","too slick","slick salesman","slick campaign"],"syn": [{"w": "polished","n": "強調精心打磨、無懈可擊，比slick更正面"},{"w": "smooth","n": "強調流暢圓滑，可指技術或社交技巧"},{"w": "sophisticated","n": "強調複雜精緻，帶有高品味的意涵"}],"note": "slick帶有輕微貶義，暗示過度圓滑或刻意包裝；polished則較為正面。IELTS閱讀中slick常出現在批評廣告或政客形象的語境中。"},{"word": "ubiquitous","ipa": "/juːˈbɪkwɪtəs/","pos": "adj","zh": "無所不在的","part": "B","examples": ["Smartphones have become so ubiquitous that many people find it difficult to imagine life without them.","The ubiquitous presence of surveillance cameras in public spaces has sparked intense debate about privacy rights."],"col": ["ubiquitous brand","ubiquitous influence","ubiquitous presence","become ubiquitous","virtually ubiquitous","ubiquitous technology","ubiquitous advertising","seemingly ubiquitous"],"syn": [{"w": "omnipresent","n": "強調無處不在，語氣比ubiquitous更正式或誇張"},{"w": "pervasive","n": "強調廣泛滲透，偏指影響力的蔓延"},{"w": "widespread","n": "最常見，泛指廣泛分布，比ubiquitous更中性"}],"note": "ubiquitous是IELTS高分詞彙，表達某事物已普及到幾乎無處不見；常作為widespread的升級替換詞出現在Band 7+寫作中。"},{"word": "unavoidable","ipa": "/ˌʌnəˈvɔɪdəbəl/","pos": "adj","zh": "無法避免的","part": "B","examples": ["Climate change adaptation is unavoidable; the question is how societies can best prepare for its consequences.","Some degree of cultural homogenisation may be an unavoidable consequence of globalisation."],"col": ["unavoidable delay","unavoidable consequence","largely unavoidable","seems unavoidable","unavoidable risk","unavoidable conflict","practically unavoidable","unavoidable change"],"syn": [{"w": "inevitable","n": "強調必然發生，無可改變，比unavoidable更強烈"},{"w": "inescapable","n": "強調無法逃避，帶有令人不安的宿命感"},{"w": "certain","n": "最簡單，指確定會發生，語氣較中性"}],"note": "unavoidable強調無法主動防止；inevitable則暗示這是事物發展的必然結果。兩者在IELTS寫作中都是表達必然性的高分替換。"},{"word": "catchy","ipa": "/ˈkætʃi/","pos": "adj","zh": "朗朗上口的","part": "B","examples": ["The startup's catchy slogan helped it stand out in a crowded marketplace and build rapid brand recognition.","Writing a catchy headline is an art form that balances clarity with the ability to spark curiosity."],"col": ["catchy slogan","catchy tune","catchy phrase","catchy title","catchy jingle","surprisingly catchy","catchy campaign","catchy name"],"syn": [{"w": "memorable","n": "強調容易記住，比catchy更廣義，不限於聽覺"},{"w": "appealing","n": "強調有吸引力，適用於更廣泛的感官"},{"w": "snappy","n": "強調簡短有力、俐落，常用於廣告語或標題"}],"note": "catchy特指因節奏或聲音而容易記住的語句或旋律；IELTS廣告與媒體類文章中，catchy slogan是標準搭配。"},{"word": "compelling","ipa": "/kəmˈpelɪŋ/","pos": "adj","zh": "有說服力的；引人入勝的","part": "B","examples": ["The documentary presents a compelling case for radical reform of the criminal justice system.","Researchers must gather compelling evidence before their findings will be accepted by the academic community."],"col": ["compelling reason","compelling evidence","compelling argument","compelling case","highly compelling","compelling narrative","compelling story","find it compelling"],"syn": [{"w": "persuasive","n": "強調說服的技巧和能力，比compelling更側重過程"},{"w": "convincing","n": "強調成功令人信服的結果"},{"w": "gripping","n": "特指令人欲罷不能、極度吸引注意的，多用於故事或表演"}],"note": "compelling兼有「說服力強」和「吸引力強」兩義；在IELTS學術閱讀中，compelling evidence是評估論文品質的常用表達。"},{"word": "distracting","ipa": "/dɪˈstræktɪŋ/","pos": "adj","zh": "令人分心的","part": "B","examples": ["Open-plan offices have been criticised for creating a distracting environment that reduces individual productivity.","Some educators argue that mobile phones are the most distracting element in modern classrooms."],"col": ["distracting noise","distracting environment","highly distracting","distracting element","distracting influence","visually distracting","distracting presence","increasingly distracting"],"syn": [{"w": "disruptive","n": "強調造成干擾和破壞，比distracting更嚴重"},{"w": "intrusive","n": "強調侵入性的打擾，令人感到不適"},{"w": "unsettling","n": "強調令人不安或心神不寧，比distracting更有情緒色彩"}],"note": "distracting特指分散注意力；disruptive則強調造成混亂或破壞正常運作。IELTS教育類文章中兩者都很常見。"},{"word": "disturbing","ipa": "/dɪˈstɜːbɪŋ/","pos": "adj","zh": "令人不安的","part": "B","examples": ["The report revealed disturbing evidence of widespread human rights abuses in several conflict zones.","Parents have raised concerns about the disturbing content increasingly available to young children online."],"col": ["disturbing news","disturbing trend","deeply disturbing","disturbing finding","disturbing pattern","disturbing image","disturbing report","disturbing evidence"],"syn": [{"w": "troubling","n": "語氣稍輕，指令人擔憂或不安，比disturbing更口語"},{"w": "alarming","n": "強調令人警覺、引發恐慌，比disturbing更強烈"},{"w": "unsettling","n": "強調打亂內心平靜，使人感到不自在"}],"note": "disturbing含有道德或情感層面的衝擊；alarming強調需要立即關注的緊迫性。IELTS社會問題類文章中兩者是高頻詞彙。"},{"word": "infuriating","ipa": "/ɪnˈfjʊərɪeɪtɪŋ/","pos": "adj","zh": "令人大發雷霆的","part": "B","examples": ["It is infuriating when companies make it deliberately difficult for customers to cancel their subscriptions.","The endless bureaucratic delays proved infuriating for the hundreds of families awaiting visa decisions."],"col": ["infuriating delay","infuriating habit","deeply infuriating","infuriating situation","find it infuriating","utterly infuriating","infuriating bureaucracy","infuriating process"],"syn": [{"w": "maddening","n": "強調令人抓狂、極度惱怒，比infuriating更口語"},{"w": "exasperating","n": "強調因一再挫折或阻礙而感到的強烈沮喪"},{"w": "frustrating","n": "最常見，指令人感到受挫，語氣比infuriating更弱"}],"note": "infuriating程度最強（憤怒）；frustrating次之（沮喪）；強度：infuriating > exasperating > frustrating。"},{"word": "invasive","ipa": "/ɪnˈveɪsɪv/","pos": "adj","zh": "侵入性的","part": "B","examples": ["Patients often prefer non-invasive diagnostic techniques over surgical procedures whenever both options are available.","The spread of invasive plant species poses a serious threat to the biodiversity of native ecosystems."],"col": ["invasive procedure","invasive species","invasive surgery","invasive advertising","non-invasive","minimally invasive","invasive technology","invasive plant"],"syn": [{"w": "intrusive","n": "強調侵犯隱私或個人空間，比invasive更偏社會語境"},{"w": "aggressive","n": "強調主動進攻性的擴張，多用於物種或行銷"},{"w": "penetrating","n": "強調深入滲透，可用於醫療或比喻意涵"}],"note": "invasive在醫療語境指侵入性手術；在生態語境指入侵物種；在社會語境指侵犯隱私。IELTS三種語境均有可能出現。"},{"word": "irritating","ipa": "/ˈɪrɪteɪtɪŋ/","pos": "adj","zh": "令人惱火的","part": "B","examples": ["Many commuters find the constant delays and overcrowding on public transport deeply irritating.","Telemarketers often employ irritating tactics, such as calling at inconvenient hours, to pressure potential customers."],"col": ["irritating habit","irritating person","mildly irritating","irritating noise","irritating behaviour","find it irritating","irritating question","irritating delay"],"syn": [{"w": "annoying","n": "最口語，泛指令人感到厭煩，語氣比irritating輕"},{"w": "aggravating","n": "強調加重惱怒或使問題更嚴重，可作動詞用"},{"w": "grating","n": "特指刺耳或令人不舒服的聲音或態度，比irritating更生動"}],"note": "irritating和annoying幾乎可互換，但irritating稍更正式；在IELTS廣告和媒體類題目中常見，如irritating advertisements。"},{"word": "monetary","ipa": "/ˈmʌnɪtri/","pos": "adj","zh": "貨幣的；金錢的","part": "B","examples": ["The central bank announced a tightening of monetary policy in response to rising inflation rates.","Critics of fines as a deterrent argue that monetary penalties are insufficient to change behaviour in the long term."],"col": ["monetary policy","monetary value","monetary system","monetary reward","monetary incentive","monetary union","tight monetary policy","monetary gain"],"syn": [{"w": "financial","n": "最廣義，指所有與金錢和財務有關的事物"},{"w": "fiscal","n": "特指政府的稅收和支出政策，比monetary更具體"},{"w": "economic","n": "指與整體經濟活動相關，比monetary範圍更廣"}],"note": "monetary特指與貨幣政策或貨幣價值相關；fiscal指政府財政政策；兩者在IELTS經濟類文章中是核心詞彙，不可混用。"},{"word": "bankrupt","ipa": "/ˈbæŋkrʌpt/","pos": "adj","zh": "破產的","part": "B","examples": ["The once-thriving retail chain was declared bankrupt after years of declining sales and poor management decisions.","His business rivals attempted to portray him as morally bankrupt, despite his long record of charitable giving."],"col": ["go bankrupt","declared bankrupt","morally bankrupt","bankrupt company","virtually bankrupt","bankrupt state","technically bankrupt","bankrupt economy"],"syn": [{"w": "insolvent","n": "法律技術用語，指資不抵債的財務狀態"},{"w": "ruined","n": "較口語，指財務或聲譽上的全面崩潰"},{"w": "penniless","n": "強調身無分文，語氣誇張，多用於文學描述"}],"note": "bankrupt除字面義外，還有比喻義：morally bankrupt（道德破產）是IELTS批判性寫作中的常用高分表達。"},{"word": "hands-on","ipa": "/ˌhændz ˈɒn/","pos": "adj","zh": "實作的","part": "B","examples": ["Vocational training programmes provide students with hands-on experience that prepares them directly for the workplace.","Employers consistently rank hands-on skills as more valuable than purely theoretical qualifications."],"col": ["hands-on experience","hands-on training","hands-on approach","hands-on learning","hands-on project","very hands-on","practical and hands-on","hands-on involvement"],"syn": [{"w": "practical","n": "最廣義，強調實際應用，比hands-on更正式"},{"w": "experiential","n": "偏學術，指通過親身體驗學習，常用於教育理論"},{"w": "applied","n": "強調將理論知識應用於具體情境，偏學術語境"}],"note": "hands-on是IELTS教育類文章的高頻詞彙，常與theoretical（理論性的）形成對比；hands-on experience是必記搭配。"},{"word": "managerial","ipa": "/ˌmænɪˈdʒɪərɪəl/","pos": "adj","zh": "管理的","part": "B","examples": ["Candidates for the senior position must demonstrate strong managerial competence and leadership skills.","The restructuring plan involved a significant reduction in managerial layers to streamline decision-making."],"col": ["managerial skill","managerial role","managerial position","managerial responsibility","managerial style","senior managerial","managerial decision","managerial competence"],"syn": [{"w": "administrative","n": "強調行政事務的處理，比managerial更偏文書和程序"},{"w": "executive","n": "強調高層決策與執行，地位比managerial更高"},{"w": "supervisory","n": "強調監督和指導下屬的職責，層級比managerial稍低"}],"note": "managerial指管理層級的，executive指高階執行層；IELTS職場類文章中常以managerial skills作為求職和職涯發展的關鍵詞。"},{"word": "assets","ipa": "/ˈæsets/","pos": "noun","zh": "資產","part": "A","examples": ["The company's total assets were valued at over two billion dollars at the end of the fiscal year.","Her multilingual ability proved to be one of her greatest assets during the international negotiation."],"col": ["business assets","personal assets","financial assets","fixed assets","liquid assets","net assets","assets management","intellectual assets"],"syn": [{"w": "resources","n": "最廣義，包含人力、自然、財務等各類可用資源"},{"w": "holdings","n": "特指所持有的股份、房產或投資組合"},{"w": "capital","n": "偏財務，指可用於生產或投資的金融資本"}],"note": "assets可指財務資產，也可比喻個人優勢；IELTS商業類常見fixed assets（固定資產）與liquid assets（流動資產）。"},{"word": "bankruptcy","ipa": "/ˈbæŋkrʌptsi/","pos": "noun","zh": "破產 (名詞)","part": "A","examples": ["The airline filed for bankruptcy after years of mounting debt and declining passenger numbers.","The economic crisis of 2008 pushed thousands of small businesses to the brink of bankruptcy."],"col": ["file for bankruptcy","declare bankruptcy","personal bankruptcy","corporate bankruptcy","avoid bankruptcy","bankruptcy proceedings","on the verge of bankruptcy","bankruptcy protection"],"syn": [{"w": "insolvency","n": "技術性法律用語，指資產不足以償還債務的財務狀態"},{"w": "financial ruin","n": "較口語或文學性，強調全面性的財務崩潰"},{"w": "liquidation","n": "指資產清算變現的具體程序，是破產的一種結果"}],"note": "bankruptcy是法律術語，指正式宣告破產；insolvency則是財務狀態的描述，不一定已進入法律程序。"},{"word": "bottom line","ipa": "/ˈbɒtəm laɪn/","pos": "noun","zh": "盈虧底線","part": "A","examples": ["The merger was driven primarily by a desire to improve the company's bottom line rather than to expand its services.","The bottom line is that without significant investment in infrastructure, economic growth will remain stagnant."],"col": ["affect the bottom line","improve the bottom line","the bottom line is","focus on the bottom line","net bottom line","company's bottom line","bottom-line thinking","boost the bottom line"],"syn": [{"w": "profit margin","n": "具體指利潤率，比bottom line更精確的財務術語"},{"w": "net income","n": "正式會計術語，指扣除所有費用後的淨利潤"},{"w": "core issue","n": "比喻義：指最根本、最關鍵的問題所在"}],"note": "bottom line有兩義：財務上指淨利潤；慣用語義指「最終的關鍵事實」，如The bottom line is...是IELTS寫作結論的高分句型。"},{"word": "budget","ipa": "/ˈbʌdʒɪt/","pos": "noun","zh": "預算","part": "A","examples": ["The government unveiled an ambitious budget that prioritised healthcare and renewable energy investment.","Managing a tight budget is one of the greatest challenges faced by small business owners."],"col": ["tight budget","annual budget","government budget","budget deficit","budget cuts","allocate a budget","budget plan","exceed the budget"],"syn": [{"w": "allocation","n": "強調資源或資金的分配，比budget更強調分配行為"},{"w": "estimate","n": "偏指對成本或收入的預估，不一定是正式計畫"},{"w": "financial plan","n": "較廣義，指整體財務安排，budget是其組成部分"}],"note": "budget既是名詞也是動詞（budget for sth.）；IELTS寫作中budget cuts（預算削減）和budget deficit（預算赤字）是高頻搭配。"},{"word": "client","ipa": "/ˈklaɪənt/","pos": "noun","zh": "客戶","part": "A","examples": ["The law firm has represented some of the most high-profile clients in the country over its fifty-year history.","Building long-term relationships with clients is far more valuable than pursuing short-term contracts."],"col": ["regular client","potential client","client base","client relationship","corporate client","legal client","satisfy a client","retain a client"],"syn": [{"w": "customer","n": "最常見的泛稱，適用於任何購買商品或服務的人"},{"w": "patron","n": "偏指長期支持或贊助者，帶有一定文化或藝術語境"},{"w": "consumer","n": "偏指最終使用產品的人，經濟學和行銷學常用"}],"note": "client常用於專業服務（法律、顧問、廣告），customer則更廣泛；IELTS商業類文章兩者均常見，但語境有別。"},{"word": "credit rating","ipa": "/ˈkrɛdɪt ˌreɪtɪŋ/","pos": "noun","zh": "信用評等","part": "A","examples": ["A poor credit rating can make it extremely difficult for individuals to secure a mortgage or business loan.","The country's sovereign credit rating was downgraded following persistent fiscal deficits."],"col": ["good credit rating","credit rating agency","credit rating downgrade","improve credit rating","credit rating system","sovereign credit rating","poor credit rating","credit rating assessment"],"syn": [{"w": "credit score","n": "較口語，通常指個人信用的數字評分"},{"w": "creditworthiness","n": "指被評估的信用可靠程度，是credit rating所衡量的特質"},{"w": "financial standing","n": "廣義指財務狀況與信譽，不限於正式評等系統"}],"note": "credit rating由評級機構（如Moody's、S&P）發布，適用於個人、企業和國家；IELTS財經類閱讀中是高頻詞彙。"},{"word": "cutback","ipa": "/ˈkʌtbæk/","pos": "noun","zh": "削減；縮減","part": "A","examples": ["Severe cutbacks in public funding have left many cultural institutions struggling to survive.","The announcement of staff cutbacks led to widespread anxiety among employees at all levels of the organisation."],"col": ["spending cutback","staff cutback","budget cutback","drastic cutback","cutback in services","announce cutbacks","implement cutbacks","cutback measures"],"syn": [{"w": "reduction","n": "最廣義，指任何形式的縮減，不一定含有負面意涵"},{"w": "downsizing","n": "特指裁員或縮減企業規模的行動"},{"w": "austerity","n": "指政府或機構採取的嚴格緊縮措施，語氣更強"}],"note": "cutback強調主動削減預算或人力；IELTS社會類題目中常與public services、education、healthcare搭配，表達緊縮政策影響。"},{"word": "earnings","ipa": "/ˈɜːnɪŋz/","pos": "noun","zh": "收入；收益","part": "A","examples": ["Research consistently shows that workers with higher levels of education command significantly greater lifetime earnings.","The company reported record quarterly earnings despite challenging global economic conditions."],"col": ["annual earnings","average earnings","low earnings","earnings growth","corporate earnings","earnings per share","boost earnings","earnings gap"],"syn": [{"w": "income","n": "最廣義，指所有來源的收入，個人和機構均可用"},{"w": "revenue","n": "偏企業或政府，指總收入，未扣除成本"},{"w": "wages","n": "特指按時計酬的勞動報酬，偏向藍領工作"}],"note": "earnings可指個人薪資收入，也可指企業盈餘；wage強調時薪，salary強調月薪，三者語境各有不同。"},{"word": "equity","ipa": "/ˈekwɪti/","pos": "noun","zh": "股權；資產淨值","part": "A","examples": ["Many startups offer employees equity as part of their compensation package to attract top talent.","The principle of equity demands that individuals in equal circumstances be treated equally under the law."],"col": ["home equity","brand equity","equity market","equity stake","private equity","equity fund","racial equity","equity and diversity"],"syn": [{"w": "fairness","n": "強調公正對待的原則，是equity在社會正義語境中的同義詞"},{"w": "share","n": "特指公司股份，是equity在財務語境中的簡化說法"},{"w": "ownership","n": "強調所有權，是持有equity的具體狀態"}],"note": "equity有兩個截然不同的意涵：財務上指股權或淨值；法律/社會上指公平正義。IELTS兩種語境都會考，需靠上下文判斷。"},{"word": "household name","ipa": "/ˈhaʊshəʊld neɪm/","pos": "noun","zh": "家喻戶曉的名字","part": "A","examples": ["Within a decade of its founding, the brand had become a household name in over forty countries.","Her discovery made her a household name in the scientific community and beyond."],"col": ["become a household name","famous household name","global household name","overnight household name","turn into a household name","national household name","household name recognition","virtually a household name"],"syn": [{"w": "celebrity","n": "強調個人的知名度和社會關注，不一定是品牌"},{"w": "icon","n": "強調具有象徵意義或代表性的形象，比household name更有文化深度"},{"w": "brand","n": "偏商業，強調企業識別和市場知名度"}],"note": "household name強調廣為大眾所知，不限於特定領域；IELTS商業類文章中常以become/make a household name描述品牌成功。"},{"word": "luxury goods","ipa": "/ˈlʌkʃəri ɡʊdz/","pos": "noun","zh": "奢侈品","part": "A","examples": ["Demand for luxury goods has proven remarkably resilient even during periods of economic downturn.","Critics argue that the global trade in luxury goods exacerbates social inequality in developing countries."],"col": ["luxury goods market","luxury goods brand","demand for luxury goods","high-end luxury goods","luxury goods industry","export luxury goods","luxury goods consumption","premium luxury goods"],"syn": [{"w": "premium products","n": "強調高品質、高定價，但比luxury goods少了稀有和地位象徵的意涵"},{"w": "status symbols","n": "強調用以炫耀社會地位的物品，更側重社會功能而非商品本身"},{"w": "high-end merchandise","n": "偏正式商業用語，強調高端商品定位"}],"note": "luxury goods在IELTS消費主義類文章中極為常見；可與conspicuous consumption（炫耀性消費）搭配使用，提升論述層次。"},{"word": "calculated risk","ipa": "/ˈkælkjʊleɪtɪd rɪsk/","pos": "phrase","zh": "經計算過的風險","part": "D","examples": ["Entrepreneurs must be willing to take calculated risks in order to capitalise on market opportunities.","The government acknowledged that the policy change involved a calculated risk but argued that inaction would be more damaging."],"col": ["take a calculated risk","small calculated risk","acceptable calculated risk","involve a calculated risk","calculated risk assessment","a deliberate and calculated risk","managed calculated risk","calculated risk-taking"],"syn": [{"w": "informed gamble","n": "強調在有所了解的情況下冒險，比calculated risk更口語"},{"w": "measured approach","n": "強調謹慎評估後的行動，偏向保守穩健"},{"w": "strategic risk","n": "強調在策略層面評估和接受的風險"}],"note": "calculated risk強調風險是經過評估而非魯莽的；IELTS商業和政策類寫作中，take a calculated risk是論述決策智慧的高分表達。"},{"word": "chair a meeting","ipa": "/tʃeə ə ˈmiːtɪŋ/","pos": "phrase","zh": "主持會議","part": "D","examples": ["The ability to chair a meeting effectively is a highly valued skill in any professional environment.","She was asked to chair a meeting of senior stakeholders to discuss the company's long-term strategic direction."],"col": ["chair a meeting effectively","chair a conference","asked to chair","experience in chairing","chair a session","chair a discussion","chair a board meeting","chair an event"],"syn": [{"w": "facilitate a discussion","n": "強調促進參與者討論，比chair更強調過程"},{"w": "preside over a meeting","n": "更正式，強調主持人的權威地位"},{"w": "lead a session","n": "最廣義，泛指帶領某場活動或討論"}],"note": "chair作動詞指主持會議；IELTS職場類題目中chair a meeting是專業詞彙，比lead a meeting更精準正式。"},{"word": "golden opportunity","ipa": "/ˈɡəʊldən ˌɒpəˈtjuːnɪti/","pos": "phrase","zh": "黃金機會","part": "D","examples": ["The trade agreement presents a golden opportunity for domestic exporters to expand into new international markets.","Failing to act on this golden opportunity would be a serious strategic error for the company."],"col": ["offer a golden opportunity","miss a golden opportunity","seize a golden opportunity","present a golden opportunity","a rare golden opportunity","this golden opportunity","golden opportunity for growth","a once-in-a-lifetime golden opportunity"],"syn": [{"w": "prime opportunity","n": "強調時機恰好，是最佳機會"},{"w": "unique chance","n": "強調機會的獨特性和不可複製性"},{"w": "window of opportunity","n": "強調機會有時間限制，強調把握時機的緊迫性"}],"note": "golden opportunity是固定搭配，不能說silver opportunity；window of opportunity是更學術的替換表達。"},{"word": "keep track of","ipa": "/kiːp træk əv/","pos": "phrase","zh": "追蹤；記錄","part": "D","examples": ["Modern businesses rely on sophisticated software systems to keep track of inventory and customer orders.","It is important for students to keep track of their progress by reviewing completed work at regular intervals."],"col": ["keep track of expenses","keep track of progress","keep track of time","keep track of records","difficult to keep track of","keep track of changes","keep track of performance","keep track of data"],"syn": [{"w": "monitor","n": "強調持續觀察和評估，比keep track of更正式"},{"w": "record","n": "強調記錄下來以供查閱，比keep track of更具體"},{"w": "maintain oversight of","n": "更正式，強調對某事保持管控和了解"}],"note": "keep track of是非常實用的口語和書面表達；IELTS學術寫作中可替換為monitor或maintain a record of以提升正式程度。"},{"word": "make a name for yourself","ipa": "/meɪk ə neɪm fɔː jɔːˈself/","pos": "phrase","zh": "出名；建立名聲","part": "D","examples": ["Young researchers who publish groundbreaking work early in their careers can quickly make a name for themselves in academic circles.","She moved to New York with little more than ambition, determined to make a name for herself in the fashion industry."],"col": ["try to make a name for yourself","make a name for yourself in a field","quickly make a name","make a name as a writer","make a name through hard work","beginning to make a name","made a name for herself","make a reputation"],"syn": [{"w": "establish a reputation","n": "更正式，強調通過長期努力建立的聲譽"},{"w": "gain recognition","n": "強調獲得他人的認可和注意"},{"w": "build a profile","n": "偏商業或媒體語境，強調建立個人品牌形象"}],"note": "make a name for yourself是固定慣用語；學術寫作中可替換為establish a reputation或gain recognition以提高正式程度。"},{"word": "win-win situation","ipa": "/ˈwɪn wɪn ˌsɪtʃuˈeɪʃn/","pos": "phrase","zh": "雙贏局面","part": "D","examples": ["Trade agreements that reduce tariffs on both sides create a win-win situation for the economies involved.","The partnership was described as a win-win situation, benefiting both the local community and the corporation."],"col": ["create a win-win situation","a genuine win-win","describe as win-win","achieve a win-win outcome","mutually beneficial win-win","win-win for all parties","win-win scenario","win-win solution"],"syn": [{"w": "mutually beneficial","n": "更正式，指對各方均有利益，是win-win的學術替換"},{"w": "positive-sum outcome","n": "經濟學術語，指各方均能獲益的局面，比win-win更學術"},{"w": "advantageous for all parties","n": "最正式，強調各方均有所得"}],"note": "win-win situation略顯口語；學術寫作中建議替換為mutually beneficial outcome以提升分數。"}]
};
const PART_LABELS = {
  A:'Part A · Nouns', B:'Part B · Adjectives',
  C:'Part C · Verbs',  D:'Part D · Phrases'
};
const SK = 'ielts_u3';
let cur=0, mode='browse', flipped=false, known=[], onIntro=true;
function load(){ try{ known=JSON.parse(localStorage.getItem(SK)||'[]'); }catch(e){known=[];} }
function save(){ try{ localStorage.setItem(SK,JSON.stringify(known)); }catch(e){} }
function isKnown(i){ return known.includes(i); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function updateDots(){
  const n=UNIT.words.length, max=Math.min(n,30);
  let h='';
  for(let i=0;i<max;i++){
    const c=(!onIntro&&i===cur)?'dot cur':isKnown(i)?'dot known':'dot';
    h+='<div class="'+c+'"></div>';
  }
  if(n>max) h+='<span style="font-family:var(--fm);font-size:.5rem;color:var(--g400);margin-left:2px;">+'+(n-max)+'</span>';
  document.getElementById('dots').innerHTML=h;
}
function renderIntro(){
  document.getElementById('counter').textContent='Introduction';
  document.getElementById('known-badge').textContent='';
  document.getElementById('prog-fill').style.width='0%';
  document.getElementById('action-count').textContent='';
  document.getElementById('know-btn').style.display='none';
  document.getElementById('review-btn').style.display='none';
  const f=document.getElementById('front-face');
  f.className='face front intro-face';
  f.innerHTML=
    '<div class="ic-eyebrow">IELTS Core Thematic Vocabulary · Chapter 3 of 10</div>'+
    '<div class="ic-title">Work, Careers & Professional Skills</div>'+
    '<div class="ic-zh">職場發展與專業素養</div>'+
    '<div class="ic-rule"></div>'+
    '<div class="ic-body">'+
      '<div>'+
        '<div class="ic-sec-label">關於本章</div>'+
        '<div class="ic-about">本章收錄 56 個核心詞彙。每個詞條包含搭配詞與中文解釋。</div>'+
      '</div>'+
      '<div>'+
        '<div class="ic-sec-label">使用方式</div>'+
        '<div class="ic-steps">'+
          '<div class="ic-step"><span class="ic-tag">Browse</span>正面顯示英文單字，翻面查看中文與搭配詞。</div>'+
          '<div class="ic-step"><span class="ic-tag">Quiz</span>正面顯示中文，翻面前先回想英文，訓練主動回憶。</div>'+
          '<div class="ic-step"><span class="ic-tag">Know it ✓</span>標記已掌握。<span class="ic-tag">Review ↺</span>重新複習。</div>'+
          '<div class="ic-step"><span class="ic-tag">快捷鍵</span>← → 切換卡片 &nbsp;·&nbsp; F 翻轉 &nbsp;·&nbsp; K 標記</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="ic-hint">按 Next → 開始學習</div>';
  document.getElementById('back-face').innerHTML='';
  updateDots();
}
function render(){
  if(onIntro){ renderIntro(); return; }
  document.getElementById('front-face').className='face front';
  document.getElementById('know-btn').style.display='';
  document.getElementById('review-btn').style.display='';
  const w=UNIT.words[cur], n=UNIT.words.length, k=isKnown(cur);
  document.getElementById('counter').textContent=(cur+1)+' / '+n;
  document.getElementById('known-badge').textContent=known.length+' / '+n+' known';
  document.getElementById('prog-fill').style.width=((cur+1)/n*100)+'%';
  document.getElementById('action-count').textContent=known.length+'/'+n;
  const isQuiz=(mode==='quiz');
  document.getElementById('front-face').innerHTML=
    '<div class="f-top">'+
      '<div class="f-meta">'+
        '<div class="f-num">#'+String(cur+1).padStart(3,'0')+'</div>'+
        '<div class="f-part">'+(PART_LABELS[w.part]||'')+'</div>'+
      '</div>'+
      '<span class="f-known-mark'+(k?' vis':'')+'">✓ known</span>'+
    '</div>'+
    '<div class="f-body">'+
      '<div class="f-word">'+esc(isQuiz?w.zh:w.word)+'</div>'+
      (!isQuiz&&w.ipa?'<div class="f-ipa">'+esc(w.ipa)+'</div>':'')+
      (!isQuiz?'<div class="f-pos">'+esc(w.pos)+'</div>':'')+
    '</div>'+
    '<div class="f-hint">'+(isQuiz?'think → click to flip':'click to flip →')+'</div>';
  const exH=(w.examples||[]).map(e=>'<div class="b-ex">"'+esc(e)+'"</div>').join('');
  const colH=(w.col||[]).map(c=>'<div class="b-col">'+esc(c)+'</div>').join('');
  const synH=(w.syn||[]).map(s=>
    '<div class="b-syn-row"><div class="b-syn-w">'+esc(s.w)+'</div>'+
    '<div class="b-syn-n">（'+esc(s.n)+'）</div></div>'
  ).join('');
  const noteH=w.note?'<div class="b-sec"><div class="b-label">注意</div><div class="b-note">'+esc(w.note)+'</div></div>':'';
  let zhLine, metaLine='';
  if(isQuiz){
    zhLine='<div class="b-quiz-word">'+esc(w.word)+'</div>';
    metaLine='<div class="b-quiz-meta">'+esc(w.pos)+(w.ipa?' &nbsp;'+esc(w.ipa):'')+'</div>';
  } else {
    zhLine='<div class="b-zh">'+esc(w.zh)+'</div>';
  }
  document.getElementById('back-face').innerHTML=
    zhLine+metaLine+
    '<div class="b-rule"></div>'+
    '<div class="b-content">'+
      (exH?'<div class="b-sec"><div class="b-label">Examples</div>'+exH+'</div>':'')+
      (colH?'<div class="b-sec"><div class="b-label">搭配</div><div class="b-cols">'+colH+'</div></div>':'')+
      (synH?'<div class="b-sec"><div class="b-label">近義</div><div class="b-syns">'+synH+'</div></div>':'')+
      noteH+
    '</div>';
  updateDots();
}
function flip(){ if(onIntro) return; flipped=!flipped; document.getElementById('card').classList.toggle('flipped',flipped); }
function go(dir){
  if(onIntro&&dir>0){ onIntro=false;cur=0;flipped=false;document.getElementById('card').classList.remove('flipped');render();return; }
  if(!onIntro&&dir<0&&cur===0){ onIntro=true;flipped=false;document.getElementById('card').classList.remove('flipped');render();return; }
  if(onIntro) return;
  cur=Math.max(0,Math.min(UNIT.words.length-1,cur+dir));
  flipped=false;document.getElementById('card').classList.remove('flipped');render();
}
function markKnown(){ if(onIntro) return; if(!isKnown(cur)) known.push(cur); save();render(); setTimeout(function(){ if(cur<UNIT.words.length-1) go(1); },180); }
function markReview(){ if(onIntro) return; known=known.filter(function(x){return x!==cur;}); save();render(); }
function setMode(m){ mode=m;flipped=false;document.getElementById('card').classList.remove('flipped');document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.toggle('active',b.dataset.mode===m);});render(); }
document.getElementById('scene').addEventListener('click',flip);
document.getElementById('prev-btn').addEventListener('click',function(e){e.stopPropagation();go(-1);});
document.getElementById('next-btn').addEventListener('click',function(e){e.stopPropagation();go(1);});
document.getElementById('know-btn').addEventListener('click',function(e){e.stopPropagation();markKnown();});
document.getElementById('review-btn').addEventListener('click',function(e){e.stopPropagation();markReview();});
document.querySelectorAll('.mode-btn').forEach(function(b){ b.addEventListener('click',function(e){e.stopPropagation();setMode(b.dataset.mode);});});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='f'||e.key==='F') flip();
  else if(e.key==='k'||e.key==='K') markKnown();
});
load();render();
</script>
</body>
</html>
